   請求書・納品書 台帳
   ============================================================ */
function docYears(){
  return [...new Set(S.docs.map(d=>(d.issuedAt||'').slice(0,4)).filter(Boolean))].sort().reverse();
}
function docVendors(){
  return [...new Set(S.docs.map(d=>d.vendor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
}
function filteredDocs(){
  const f=S.dfil, kw=(f.kw||'').toLowerCase().split(/\s+/).filter(Boolean);
  return S.docs.filter(d=>{
    if(f.type   && d.type   !== f.type) return false;
    if(f.store  && d.store  !== f.store) return false;
    if(f.status && d.status !== f.status) return false;
    if(f.vendor && d.vendor !== f.vendor) return false;
    if(f.year   && (d.issuedAt||'').slice(0,4) !== f.year) return false;
    if(f.day    && d.dueAt !== f.day) return false;
    if(kw.length){
      const hay = `${d.vendor||''} ${d.fileName||''} ${d.noteTitle||''} ${d.folder||''} ${d.memo||''} ${d.period||''} ${d.amount||''} ${d.ocrText||''}`.toLowerCase();
      if(!kw.every(k=>hay.includes(k))) return false;
    }
    return true;
  });
}
const emptyDfil = () => ({type:'',store:'',year:'',status:'',vendor:'',kw:'',day:''});

/* ============================================================
   ファイルの保存（完全無料・Firestoreの中に入れる）

   Firebase Storage は有料プラン（Blaze）が要るので使いません。
   代わりに、写真を小さく圧縮して Firestore のドキュメントに直接しまいます。
   Firestore の1ドキュメントは1MBまで。写真は長辺1400px・JPEGに落として
   だいたい100〜300KBに収まるので、無料枠1GB＝およそ4,000〜8,000枚ぶん入ります。
   ============================================================ */
const MAX_BYTES = 900000;   // 1MB制限に対する安全圏

async function compressImage(file, onProgress){
  const bmp = await createImageBitmap(file);
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  let last = null;
  for(const [w, q] of [[1600,.82],[1400,.75],[1200,.68],[1000,.62],[800,.55],[640,.5]]){
    const sc = Math.min(1, w/Math.max(bmp.width, bmp.height));
    cv.width  = Math.max(1, Math.round(bmp.width*sc));
    cv.height = Math.max(1, Math.round(bmp.height*sc));
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r=>cv.toBlob(r, 'image/jpeg', q));
    if(!blob) break;
    last = blob;
    onProgress && onProgress(`画像を軽くしています… ${mb(blob.size)}`);
    if(blob.size <= MAX_BYTES) return blob;
  }
  if(last) return last;
  throw new Error('画像を処理できませんでした。');
}

// ファイルを Firestore の docFiles/{書類ID} に保存する
async function saveDocFile(docId, file, onProgress){
  let blob = file, type = file.type || 'application/octet-stream', name = file.name;
  if(DECODABLE.test(name) || /^image\/(jpeg|png|webp|gif|avif)$/.test(type)){
    try{
      blob = await compressImage(file, onProgress);
      type = 'image/jpeg';
      name = name.replace(/\.[^.]+$/,'') + '.jpg';
    }catch(e){ blob = file; }
  }
  if(blob.size > MAX_BYTES){
    throw new Error(/pdf/i.test(type)
      ? `このPDFは大きすぎます（${mb(blob.size)}／上限 ${mb(MAX_BYTES)}）。かわりに紙を写真で撮るか、下の「ファイルのリンク」にGoogleドライブの共有リンクを貼ってください。`
      : `ファイルが大きすぎます（${mb(blob.size)}／上限 ${mb(MAX_BYTES)}）。`);
  }
  onProgress && onProgress('保存しています…');
  const u8 = new Uint8Array(await blob.arrayBuffer());
  await setDoc(doc(db,'docFiles',docId),
    { data:Bytes.fromUint8Array(u8), type, name, size:blob.size, updatedAt:nowISO() });
  return { fileName:name, fileType:type, fileSize:blob.size, hasFile:true };
}

// 表示用に読み出す（開いたときだけ取りに行く）
const fileCache = new Map();
async function loadDocFile(docId){
  if(fileCache.has(docId)) return fileCache.get(docId);
  const s = await getDoc(doc(db,'docFiles',docId));
  if(!s.exists()) return null;
  const v = s.data();
  const url = URL.createObjectURL(new Blob([v.data.toUint8Array()], {type:v.type}));
  const out = { url, type:v.type, name:v.name, size:v.size };
  fileCache.set(docId, out);
  return out;
}

/* ============================================================
   中身の整理
   ─────────────────────────────────────────────
   方針：ノートも本文も、ひとつも消さない。
   やるのは「アーカイブに移す」「タイトルに年を足す」「タグを付ける」だけ。
   実行前に何が変わるか全部見せて、実行後は取り消せるようにする。
   ============================================================ */

/* --- タグの判定ルール --- */
const TAG_RULES = [
  ['請求書',   /請求書|ご請求|御請求/],
  ['領収書',   /領収書|領収証|レシート/],
  ['見積書',   /見積書|御見積|お見積/],
  ['納品書',   /納品書|納品明細/],
  ['議事録',   /議事録|MTG|ミーティング|打ち合わせ|打合せ|会議/i],
  ['日報',     /日報|日誌/],
  ['マニュアル', /マニュアル|手順|やり方|使い方|ルール|規定/],
  ['契約',     /契約書|申込書|覚書|規約/],
  ['採用・教育', /採用|面接|新人教育|研修|チャレンジシート|評価/],
  ['経理',     /精算|振込|支払|入金|小口|タイムシート|給与|PL|決算/],
  ['発注・在庫', /発注|注文|在庫|物販|オーダー|仕入/],
  ['告知・販促', /キャンペーン|告知|チラシ|POP|SNS|広告|イベント/i],
];
function guessTags(n, text){
  const hay = `${n.title||''} ${n.folder||''} ${(text||'').slice(0,1200)}`;
  const out=[];
  for(const [tag, re] of TAG_RULES){
    if(re.test(hay)) out.push(tag);
    if(out.length>=3) break;
  }
  return out;
}

/* --- 日付だけのタイトルを見つける --- */
const DATE_TITLE = /^\s*(\d{1,2})\s*[\/\.\-月]\s*(\d{1,2})\s*日?\s*(?:[（(][^）)]{0,4}[）)])?\s*$/;
function dailyTitleFix(n){
  const t = String(n.title||'');
  if(/(19|20)\d{2}/.test(t)) return null;           // すでに年が入っている
  const m = DATE_TITLE.exec(t);
  if(!m) return null;
  const mo = Number(m[1]), da = Number(m[2]);
  if(!(mo>=1 && mo<=12 && da>=1 && da<=31)) return null;
  const key = createdKey(n);
  const y = /^(19|20)\d{2}/.test(key) ? key.slice(0,4) : null;
  if(!y) return null;
  return `${y}/${mo}/${da}`;
}

/* --- 何が直せるか調べる（書き込みはしない） --- */
function analyzeCleanup(){
  const textOf = n => (S.corpus && S.corpus[String(n.id)]) || n.preview || '';

  // 1) 「〜のコピー」フォルダの中で、本体と中身が完全に同じもの
  const byFolder = {};
  S.notes.forEach(n=>{ (byFolder[n.folder]=byFolder[n.folder]||[]).push(n); });
  const dupes=[];
  Object.keys(byFolder).forEach(name=>{
    if(!/のコピー\s*$/.test(name)) return;
    const orig = byFolder[name.replace(/のコピー\s*$/,'')];
    if(!orig) return;
    const sig = n => `${n.title} ${textOf(n)}`;
    const origSet = new Set(orig.map(sig));
    byFolder[name].forEach(n=>{
      if(!n.archived && origSet.has(sig(n))) dupes.push(n);
    });
  });

  // 2) 日付だけのタイトル
  const titles=[];
  S.notes.forEach(n=>{
    const t = dailyTitleFix(n);
    if(t && t!==n.title) titles.push({n, to:t});
  });

  // 3) タグ
  const tags=[]; const tagCount={};
  S.notes.forEach(n=>{
    const now = (S.tags && S.tags[String(n.id)]) || [];
    const t = guessTags(n, textOf(n));
    if(t.length && t.join(',')!==now.join(',')){
      tags.push({n, to:t});
      t.forEach(x=>tagCount[x]=(tagCount[x]||0)+1);
    }
  });

  return {dupes, titles, tags, tagCount};
}

/* --- 一覧インデックスを作り直す（タイトル変更を全員に反映するため） --- */
async function rebuildIndex(log){
  log && log('一覧インデックスを作り直しています…');
  const idx = S.notes.map(n=>({id:String(n.id), folderId:String(n.folderId), folder:n.folder,
    title:n.title, preview:n.preview, updatedAt:n.updatedAt, author:n.author,
    archived:!!n.archived, daily:!!n.daily, att:n.att||0}));
  const shards=[]; let cur=[], size=0;
  for(const r of idx){
    const s=JSON.stringify(r).length;
    if(size+s > 900000){ shards.push(cur); cur=[]; size=0; }
    cur.push(r); size+=s;
  }
  if(cur.length) shards.push(cur);
  let b=writeBatch(db);
  for(let i=0;i<shards.length;i++){
    const gz = await gzipStr(JSON.stringify(shards[i]));
    b.set(doc(db,'indexShards','s'+String(i).padStart(3,'0')), {n:i, gz:Bytes.fromUint8Array(gz)});
    if((i+1)%5===0){ await b.commit(); b=writeBatch(db); }
  }
  await b.commit();
  const ver=Date.now();
  await setDoc(doc(db,'meta','index'),{version:ver, count:idx.length, builtAt:nowISO()});
  await idbSet('idx_'+ver, S.notes);
  log && log(`インデックスを更新しました（${shards.length}分割）`);
}

/* --- 取り消し用の記録 --- */
async function saveUndo(kind, label, items){
  const id = 'u'+Date.now();

    { id, kind, label, count:items.length, by:ME.name, at:nowISO(), gz:Bytes.fromUint8Array(gz) });
  return id;
}
async function listUndo(){

      .sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  }catch(e){ return []; }
}

    at:nowISO(), by:ME.name});

  await idbSet('note_tags', map);
}

/* ============================================================
   Stockから引き継いだ添付ファイル（Googleドライブの680件）

   ファイルの保存場所（パス）から決まるIDを付けて Firestore にしまう。
   1MBを超えるものは900KBずつに割って、開くときに繋ぎ直す。
   ============================================================ */
const CHUNK = 900000;
// 取り込む対象。表示できないものも「ダウンロードして開く」ために入れておく。
const VIEWABLE = /\.[A-Za-z0-9]{1,8}$/;
const SKIP_EXT = /\.(ds_store|localized)$/i;
const MAX_FILE = 80 * 1024 * 1024;        // 1件80MBまで
const MIME = { pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
               webp:'image/webp', avif:'image/avif', gif:'image/gif', heic:'image/heic',
               m4a:'audio/mp4', mp3:'audio/mpeg', wav:'audio/wav',
               mov:'video/quicktime', mp4:'video/mp4',
               xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
               docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
               pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
               csv:'text/csv', txt:'text/plain', zip:'application/zip',
               numbers:'application/zip', pages:'application/zip', key:'application/zip',
               webloc:'application/xml' };
// ブラウザでそのまま開けるもの
const CAN_PREVIEW = /\.(pdf|jpe?g|png|webp|avif|gif|m4a|mp3|wav|mov|mp4|txt|csv)$/i;
// ブラウザが中身を読める画像（HEICは読めないので縮小しない）
const DECODABLE = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;

// パスから決まるID（NFC正規化してから64bitハッシュ）
function pathId(p){
  const s = String(p||'').normalize('NFC');
  let a=0x811c9dc5, b=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    a = Math.imul(a ^ c, 16777619) >>> 0;
    b = Math.imul(b + c + 0x9e3779b9, 2246822519) >>> 0;
  }
  return 'a' + a.toString(36) + b.toString(36);
}

/* ノートの作成日の表（並び替え用）。1ドキュメントに圧縮して入れてある。 */
async function loadCreated(){
  try{
    const cached = await idbGet('note_created');
    if(cached){ S.created = cached; return; }
    const m = await getDoc(doc(db,'meta','noteCreated'));
    if(!m.exists()) return;
    S.created = JSON.parse(await ungzip(m.data().gz.toUint8Array()));
    await idbSet('note_created', S.created);
  }catch(e){}
}
async function importCreated(){
  const m=el('div','modal');
  m.innerHTML=`<div class="box"><h3>ノートの作成日を取り込む</h3>
    <p>並び替えの「作成が新しい／古い順」を正確にするためのデータです。<br>
       アプリ/note_created.json.gz を選んでください。1回だけで済みます。</p>
    <input type="file" id="cimp" accept=".json,.gz" style="font-size:13px;padding:9px;border:1px solid var(--line);border-radius:4px;width:100%">
    <div class="log" id="clg" style="display:none;margin-top:12px"></div>
    <div class="row"><button id="ccl">閉じる</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#ccl').onclick=()=>m.remove();
  m.querySelector('#cimp').onchange = async e=>{
    const f=e.target.files[0]; if(!f) return;
    const lg=m.querySelector('#clg'); lg.style.display='block';
    const log=t=>{ lg.textContent+=t+'\n'; };
    try{
      let text;
      if(f.name.endsWith('.gz'))
        text = await new Response(f.stream().pipeThrough(new DecompressionStream('gzip'))).text();
      else text = await f.text();
      const map = JSON.parse(text);
      log(`${Object.keys(map).length}件を読み込みました`);
      const gz = await gzipStr(JSON.stringify(map));
      if(gz.length > 950000) throw new Error('データが大きすぎます');
      await setDoc(doc(db,'meta','noteCreated'), {gz:Bytes.fromUint8Array(gz), count:Object.keys(map).length});
      S.created = map;
      await idbSet('note_created', map);
      log('保存しました。並び替えに使えるようになりました。');
      setTimeout(()=>{ m.remove(); renderList(); toast('作成日を取り込みました'); }, 700);
    }catch(err){ log('エラー: '+err.message); }
  };
}

// 取り込み済みの一覧（どれがアプリで開けるか）。IDは1つ14文字ほどなので、
// 1,000件でも15KB程度。1回の読み取りで済むように1ドキュメントにまとめて持つ。
async function loadAttIndex(){
  try{
    const m = await getDoc(doc(db,'meta','attIndex'));
    S.attIds = new Set((m.exists() && m.data().ids) || []);
  }catch(e){ S.attIds = new Set(); }
}

const attCache = new Map();
async function loadAttachment(path, onProgress){
  const id = pathId(path);
  if(attCache.has(id)) return attCache.get(id);
  const m = await getDoc(doc(db,'attFiles',id));
  if(!m.exists()) return null;
  const v = m.data();
  const parts = [];
  for(let n=0; n<v.chunks; n++){
    onProgress && onProgress(v.chunks>1 ? `読み込み中… ${n+1}/${v.chunks}` : '読み込み中…');
    const c = await getDoc(doc(db,'attChunks', `${id}_${String(n).padStart(3,'0')}`));
    if(!c.exists()) throw new Error('ファイルの一部が見つかりません');
    parts.push(c.data().b.toUint8Array());
  }
  const out = { url: URL.createObjectURL(new Blob(parts, {type:v.type})),
                type:v.type, name:v.name, size:v.size };
  attCache.set(id, out);
  return out;
}

let ATT_STOP = false;
// ファイルの読み込みが固まったときのための時間制限
async function withTimeout(promise, ms, msg){
  let timer;
  try{
    return await Promise.race([promise,
      new Promise((_,rej)=>{ timer=setTimeout(
        ()=>rej(new Error(msg||`${ms/1000}秒以内に読めませんでした`)), ms); })]);
  } finally { clearTimeout(timer); }
}
const hhmm = sec => sec<60 ? `${Math.round(sec)}秒`
  : `${Math.floor(sec/60)}分${String(Math.round(sec%60)).padStart(2,'0')}秒`;

async function runAttImport(files, $$, mode){
  const lg=$$('#alg'); lg.style.display='block';
  const log = t => { lg.textContent += t+'\n'; lg.scrollTop=lg.scrollHeight; };
  const prog = p => $$('#apb').style.width = (p*100).toFixed(1)+'%';
  const stEl = $$('#astat'); if(stEl) stEl.style.display='block';
  const status = h => { if(stEl) stEl.innerHTML = h; };
  // 画面を描き直す隙をつくる（つくらないと固まって見える）
  const breathe = () => new Promise(r=>setTimeout(r, 0));
  try{
    // 先に「書き込めるか」を1件だけ試す。ルールが古いとここで分かる。
    try{
      await setDoc(doc(db,'attFiles','__preflight'), {t:nowISO()});
      await deleteDoc(doc(db,'attFiles','__preflight'));
    }catch(e){
      log('【中断】Firestoreに書き込めませんでした。');
      log('');
      log('ルールがまだ古い可能性が高いです。次の手順で直してください：');
      log('  1. https://console.firebase.google.com/project/period-knowledge/firestore/rules');
      log('  2. アプリ/firestore.rules の中身を全部貼り付ける');
      log('     （attFiles と attChunks の行が入っているもの）');
      log('  3.「公開」を押す → 1分ほど待つ');
      log('  4. この画面をリロードして、もう一度取り込む');
      log('');
      log('元のエラー: '+(e.message||e));
      return;
    }

    await loadAttIndex();
    const done = new Set(S.attIds);
    // 「添付ファイル/…」から始まる相対パスに揃える
    let skipped = 0;
    const targets = files.filter(f=>{
      if(!VIEWABLE.test(f.name) || SKIP_EXT.test(f.name) || f.name.startsWith('.')) return false;
      if(f.size > MAX_FILE){ skipped++; return false; }
      return true;
    }).map(f=>{
      if(mode==='photo'){
        // Stockの写真。ファイル名が「写真ID.jpg」になっている
        const pid = (f.name.match(/^(\d+)\./)||[])[1];
        if(!pid) return null;
        const rel = 'stockimg/'+pid;
        return {f, rel, id:pathId(rel)};
      }
      let rel = (f.webkitRelativePath || f.name).normalize('NFC');
      const i = rel.indexOf('添付ファイル/');
      rel = i>=0 ? rel.slice(i) : ('添付ファイル/'+rel);
      return {f, rel, id:pathId(rel)};
    }).filter(Boolean);
    const todo = targets.filter(t=>!done.has(t.id));
    const totalMB = todo.reduce((s,t)=>s+t.f.size,0)/1048576;
    log(`対象のファイル ${targets.length}件` + (skipped?`（80MBを超える ${skipped}件は対象外）`:''));
    log(`取り込み済み ${targets.length-todo.length}件 / これから ${todo.length}件（${totalMB.toFixed(0)}MB）`);
    if(!todo.length){ log('すべて取り込み済みです。'); prog(1); return; }
    log(`小さいものから順に入れます。10件ごとに保存するので、`);
    log(`途中で「中断する」を押しても、次回は続きから再開します。\n`);
    // 小さいものを先に。早い段階で「進んでいる」ことが分かるようにする
    todo.sort((a,b)=>a.f.size-b.f.size);

    let b = writeBatch(db), ops=0, bytes=0, okCount=0, ngCount=0, ngRun=0;
    // 送信に失敗しても、書き込み枠は必ず新しいものに入れ替える
    // （使い終わった枠を使い回すと、以降すべてエラーになるため）
    const flush = async ()=>{
      if(!ops) return;
      const cur = b;
      b = writeBatch(db); ops = 0; bytes = 0;
      await cur.commit();
    };
    const saveIndex = async ()=>{
      const ids=[...done];
      await setDoc(doc(db,'meta','attIndex'), { version:Date.now(), count:ids.length, ids });
      S.attIds = new Set(ids);
    };

    const T0 = Date.now();
    const totalBytes = todo.reduce((s,t)=>s+t.f.size,0) || 1;
    let doneBytes = 0;

    for(let i=0;i<todo.length;i++){
      if(ATT_STOP){
        log(`\n【中断しました】${okCount}件まで保存済みです。もう一度実行すれば続きから再開します。`);
        await flush().catch(()=>{}); await saveIndex(); return;
      }
      const {f, rel, id} = todo[i];
      const el0 = (Date.now()-T0)/1000;
      const rate = doneBytes / Math.max(el0, .001);
      status(`<b>${i+1} / ${todo.length}件</b>　${(doneBytes/1048576).toFixed(0)} / ${(totalBytes/1048576).toFixed(0)}MB`
        + `　経過 ${hhmm(el0)}`
        + (doneBytes>3000000 ? `　残り およそ ${hhmm((totalBytes-doneBytes)/rate)}` : '')
        + `<span class="fn2">${esc(f.name)}</span>`);
      await breathe();
      const tf = Date.now();
      try{
        const ext = (f.name.split('.').pop()||'').toLowerCase();
        let blob = f, type = MIME[ext] || f.type || 'application/octet-stream';
        // 画像は縮めてから入れる。ただしブラウザが読めない形式（HEICなど）はそのまま。
        if(DECODABLE.test(f.name) && f.size > CHUNK){
          try{
            blob = await compressImage(f); type = 'image/jpeg';
          }catch(e){ blob = f; }          // 縮められなければ元のまま入れる
        }
        // Googleドライブの「オンラインのみ」ファイルは読むのに時間がかかることがある
        const u8 = new Uint8Array(await withTimeout(blob.arrayBuffer(), 90000,
          'ファイルを読めませんでした（Googleドライブの同期待ちかもしれません）'));
        const chunks = Math.max(1, Math.ceil(u8.length / CHUNK));
        for(let n=0;n<chunks;n++){
          const part = u8.subarray(n*CHUNK, Math.min(u8.length, (n+1)*CHUNK));
          b.set(doc(db,'attChunks', `${id}_${String(n).padStart(3,'0')}`),
                { b: Bytes.fromUint8Array(part) });
          ops++; bytes += part.length;
          if(ops>=100 || bytes > 4000000) await flush();
        }
        b.set(doc(db,'attFiles',id), { name:f.name, type, size:u8.length, chunks, path:rel });
        ops++;
        if(ops>=100 || bytes > 4000000) await flush();
        done.add(id); okCount++; ngRun=0; doneBytes += f.size;
        const sec = (Date.now()-tf)/1000;
        if(sec > 5) log(`△ ${f.name.slice(0,30)}（${mb(f.size)}）に ${hhmm(sec)} かかりました`);
      }catch(err){
        ngCount++; ngRun++; doneBytes += f.size;
        const msg = String(err && err.message || err);
        log(`× ${f.name}：${msg}`);
        if(/permission|insufficient|PERMISSION_DENIED/i.test(msg)){
          log('\n【中断】書き込みを拒否されました。Firestoreのルールを貼り直してから、もう一度お試しください。');
          await saveIndex(); return;
        }
        // 書き込みそのものが続けて失敗したときだけ止める
        if(ngRun >= 25){
          log(`\n【中断】${ngRun}件 続けて失敗したので止めました。`);
          log('ここまでのぶんは保存しました。もう一度実行すれば続きから再開します。');
          await saveIndex(); return;
        }
      }
      prog(doneBytes/totalBytes*0.97);
      if((i+1)%10===0){
        // 途中で閉じても続きから再開できるように、こまめに記録する
        try{ await flush(); await saveIndex(); }catch(e){}
        log(`… ${i+1} / ${todo.length}件（${(doneBytes/1048576).toFixed(0)}MB）`);
      }
    }
    await flush();

    log('一覧を更新しています…');
    await saveIndex();
    prog(1);
    status(`<b>完了しました</b>　${okCount}件・${(doneBytes/1048576).toFixed(0)}MB　（${hhmm((Date.now()-T0)/1000)}）`);
    log(`\n完了しました。取り込み ${okCount}件${ngCount?` / 失敗 ${ngCount}件`:''}`);
    log(`アプリで開けるファイル 合計 ${S.attIds.size}件`);
    toast(`${okCount}件を取り込みました`);
    if(S.noteId) renderDetail();
  }catch(e){ log('エラー: '+e.message); }
}

      S.docs.unshift(d);
      await idbSet('docs_cache', null);
      await logChange('doc', id, `${d.vendor||''} ${d.period||''}`, null, d, 'create');
      const n = await notifyAccounting('doc', '請求書が登録されました',
        `${d.store}　${d.vendor||'取引先未記入'}　${d.amount?yen(d.amount):'金額未記入'}（登録 ${ME.name}）`,
        {view:'docs', id});
      m.remove();
      buildNotifications(); renderDocs();
      toast(n ? `登録しました。経理${n}名に通知しました` : '登録しました');
    }catch(err){
      msg.innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
      btn.disabled=false;
    }
  };
}

/* 状態を進める（確認・承認・支払済など）。関係する人に結果を通知する。 */
async function setStatus(d, status, done, note){
  const before = {...d};
  const patch = { status, updatedAt:nowISO(), editor:ME.name };
  if(status==='unpaid' || status==='hold' || status==='approval'){ patch.checkedBy=ME.name; patch.checkedAt=nowISO(); }
  if(status==='unpaid' && before.status==='approval'){ patch.approvedBy=ME.name; patch.approvedAt=nowISO(); }
  if(status==='paid'){ patch.paidBy=ME.name; patch.paidAt=nowISO(); }
  if(status==='pending' && before.status==='planned'){ patch.planned=false; }
  Object.assign(d, patch);
  await setDoc(doc(db,'documents',d.id), patch, {merge:true});
  await logChange('doc', d.id, `${d.vendor||''} ${d.period||''}`,
                  {status:before.status}, {status}, 'status', note||'');
  await idbSet('docs_cache', null);

  // 承認に回したときはマネージャーへ
  if(status==='approval'){
    await notifyRoles(['manager','admin'], 'doc', '承認をお願いします',
      `${d.vendor||''}　${yen(d.amount)}（${d.store||''}）`, {view:'docs', id:d.id});
  }
  // 経理へ（予定に請求書が届いた／保留から戻した）
  if(status==='pending'){
    await notifyAccounting('doc', '請求書の確認をお願いします',
      `${d.vendor||''}　${yen(d.amount)}（${d.store||''}）`, {view:'docs', id:d.id});
  }
  // 登録した人へ結果を返す
  if(d.createdByEmail && d.createdByEmail!==ME.email){
    const msg = { unpaid:'経理・マネージャーの確認が終わりました', approval:'マネージャーの承認に回りました',
                  hold:'保留になりました。内容を確認してください',
                  paid:'支払いが完了しました' }[status];
    if(msg) await pushNotif(d.createdByEmail, 'doc', msg,
      `${d.vendor||''}　${yen(d.amount)}（${d.store||''}）`, {view:'docs', id:d.id});
  }
  buildNotifications();
  toast(`「${DSTATUS[status]}」にしました`);
  done && done();
  renderDocs();
}

function exportDocsCsv(){
  const rows = filteredDocs();
  const head = ['発行日','種別','取引先','店舗','対象月','金額','支払期日','状態','支払サイト',
                '金融機関','支店','種別(口座)','口座番号','口座名義','担当者',
                'ファイル名','保存パス','メモ','登録者','確認者','承認者','最終更新'];
  const line = a => a.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
  const body = rows.map(d=>{
    const v = vendorFor(d) || {};
    return line([d.issuedAt,d.type,d.vendor,d.store,d.period,d.amount??'',
      d.dueAt,DSTATUS[d.status]||'', v.payDay?payTermsLabel(v):'',
      v.bankName||'', v.bankBranch||'', v.bankType||'', v.bankNumber||'', v.bankHolder||'', v.contact||'',
      d.fileName,d.filePath,d.memo,d.createdBy||'',d.checkedBy||'',d.approvedBy||'',fmtT(d.updatedAt)]);
  });
  const csv = '﻿' + [line(head), ...body].join('\r\n');
  const a=el('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`Period_stock_書類台帳_${today()}.csv`; a.click();
  toast(`${rows.length}件を書き出しました`);
}

function importDocs(){
  const m=el('div','modal');
  m.innerHTML=`<div class="box"><h3>書類台帳の初期データを取り込む</h3>
    <p>documents_seed.json（または .gz）を選ぶと、Stockの添付から作った台帳を一括登録します。
       同じIDの書類は上書きされます。</p>
    <input type="file" id="dimp" accept=".json,.gz" style="font-size:13px;padding:9px;border:1px solid var(--line);border-radius:4px;width:100%">
    <div class="bar"><i id="dpb"></i></div><div class="log" id="dlg" style="display:none"></div>
    <div class="row"><button id="dcl">閉じる</button></div></div>`;
  document.body.appendChild(m);
  $('#dcl').onclick=()=>m.remove();
  $('#dimp').onchange = async e => {
    const file=e.target.files[0]; if(!file) return;
    const lg=$('#dlg'); lg.style.display='block';
    const log=t=>{ lg.textContent+=t+'\n'; lg.scrollTop=lg.scrollHeight; };
    try{
      let text;
      if(file.name.endsWith('.gz'))
        text = await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text();
      else text = await file.text();
      const rows = JSON.parse(text);
      log(`${rows.length}件を読み込みました`);
      const now=nowISO();
      let b=writeBatch(db), c=0;
      for(let i=0;i<rows.length;i++){
        const r=rows[i];
        b.set(doc(db,'documents',String(r.id)), {...r, id:String(r.id), updatedAt:now, deleted:false});
        if(++c%400===0){ await b.commit(); b=writeBatch(db);
          $('#dpb').style.width=(i/rows.length*100).toFixed(0)+'%'; log(`${i+1} / ${rows.length}`); }
      }
      await b.commit();
      $('#dpb').style.width='100%';
      log('完了しました。画面を更新します。');
      await idbSet('docs_cache', null);
      await syncDocs(); buildNotifications();
      setTimeout(()=>{ m.remove(); renderDocs(); toast(`${rows.length}件を取り込みました`); }, 700);
    }catch(err){ log('エラー: '+err.message); }
  };
}

/* ============================================================
   変更履歴（A-9）
   ─────────────────────────────────────────────
   「誰がいつ、どの項目を、何から何に変えたか」を history に残す。
   消さない・書き換えない。詳細画面のいちばん下に時系列で出す。
   ============================================================ */
const HLABEL = {
  type:'種別', vendor:'取引先', vendorId:'取引先', store:'店舗・部門', amount:'金額',
  issuedAt:'発行日', dueAt:'支払期日', period:'対象月', status:'状態', memo:'メモ',
  fileLink:'ファイルのリンク', hasFile:'添付ファイル', fileName:'ファイル名',
  title:'タイトル', date:'日付', body:'本文', decisions:'決定事項', todos:'ToDo', attendees:'参加者',
  name:'取引先名', kana:'よみ', closeDay:'締め日', payMonth:'支払月', payDay:'支払日',
  bankName:'金融機関', bankBranch:'支店', bankType:'預金種別', bankNumber:'口座番号', bankHolder:'口座名義',
  contact:'担当者', tel:'電話', email:'メール', contractLink:'契約書のリンク',
  active:'有効', dayOfMonth:'発生日', label:'名称', startYM:'開始月', endYM:'終了月',
  section:'区分', folder:'フォルダ',
};
const HTARGET = { doc:'書類', minute:'議事録', vendor:'取引先', rule:'定期支払い', folder:'フォルダ' };

function hval(field, v){
  if(v===undefined || v===null || v==='') return '（空）';
  if(field==='amount') return yen(v);
  if(field==='status') return DSTATUS[v] || String(v);
  if(field==='hasFile' || field==='active') return v ? 'あり' : 'なし';
  if(field==='closeDay' || field==='payDay') return Number(v)>=31 ? '月末' : v+'日';
  if(field==='payMonth') return ['当月','翌月','翌々月','翌々々月'][Number(v)] || (v+'か月後');
  if(Array.isArray(v)) return v.map(x=> typeof x==='object' ? (x.text||JSON.stringify(x)) : x).join('、') || '（空）';
  const s = String(v);
  return s.length>60 ? s.slice(0,60)+'…' : s;
}
function diffFields(before, after){
  const out=[];
  const keys = new Set([...Object.keys(before||{}), ...Object.keys(after||{})]);
  const skip = new Set(['updatedAt','editor','id','deleted','createdAt','createdBy','createdByEmail',
                        'ocrText','ocrCands','ocrAt','fileType','fileSize','source','lastYM']);
  keys.forEach(k=>{
    if(skip.has(k)) return;
    const a=before?before[k]:undefined, b=after?after[k]:undefined;
    const sa = typeof a==='object' ? JSON.stringify(a) : String(a===undefined||a===null?'':a);
    const sb = typeof b==='object' ? JSON.stringify(b) : String(b===undefined||b===null?'':b);
    if(sa===sb) return;
    out.push({ f:k, label:HLABEL[k]||k, from:hval(k,a), to:hval(k,b) });
  });
  return out;
}
/* 変更を1件記録する。失敗しても本体の保存は止めない。 */
async function logChange(target, targetId, title, before, after, action, note){
  try{
    const changes = (action==='create' || action==='delete') ? [] : diffFields(before, after);
    if(action==='update' && !changes.length) return;
    const id = 'h'+Date.now()+Math.random().toString(36).slice(2,6);
    await setDoc(doc(db,'history',id), {
      id, target, targetId:String(targetId), title:String(title||'').slice(0,120),
      action: action||'update', changes: changes.slice(0,30),
      note: note||'', by:ME.name, byEmail:ME.email, at:nowISO() });
  }catch(e){}
}
const ACTLABEL = { create:'作成しました', update:'変更しました', delete:'削除しました',
                   status:'状態を進めました', file:'ファイルを操作しました' };

async function mountHistory(container, target, targetId){
  container.innerHTML='';
  container.appendChild(el('div','sect-t','変更履歴'));
  const box=el('div',null,'<div style="font-size:11.5px;color:#9aa3b2;padding:6px 0"><span class="spin"></span> 読み込み中</div>');
  container.appendChild(box);
  let rows=[];
  try{
    const s = await getDocs(query(collection(db,'history'), where('targetId','==',String(targetId)), limit(120)));
    rows = s.docs.map(d=>d.data()).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  }catch(e){}
  box.innerHTML='';
  if(!rows.length){
    box.appendChild(el('div',null,'<div style="font-size:11.5px;color:#9aa3b2;padding:6px 0">まだ変更はありません。これから直したぶんが、ここに残ります。</div>'));
    return;
  }
  const h=el('div','hist');
  rows.slice(0,40).forEach((r,i)=>{
    const w=el('div','hrow'+(i===0?' new':''));
    let body='';
    if(r.changes && r.changes.length){
      body = r.changes.map(c=>`<div><span class="f">${esc(c.label)}</span>
        <span class="o">${esc(c.from)}</span>→<span class="n">${esc(c.to)}</span></div>`).join('');
    }else if(r.note){ body = `<div>${esc(r.note)}</div>`; }
    w.innerHTML=`<div class="hh"><b>${esc(r.by||'')}</b>が${esc(ACTLABEL[r.action]||'変更しました')}
      <span style="margin-left:auto">${esc(fmtT(r.at))}</span></div>
      ${body?`<div class="hc">${body}</div>`:''}`;
    h.appendChild(w);
  });
  box.appendChild(h);
  if(rows.length>40) box.appendChild(el('div',null,`<div style="font-size:11px;color:#9aa3b2;padding:8px 0">ほか ${rows.length-40}件</div>`));
}

/* ============================================================
   取引先マスタ（A-4）
   ─────────────────────────────────────────────
   支払サイト（月末締め翌月末払いなど）・振込先・担当者・契約書リンクを1か所に。
   請求書を登録するとき取引先を選ぶだけで、支払期日が自動で入る。
   ============================================================ */
const PAYMONTHS = [[0,'当月'],[1,'翌月'],[2,'翌々月']];
const DAYOPTS = (()=>{ const a=[]; for(let i=1;i<=30;i++) a.push([String(i), i+'日']); a.push(['31','月末']); return a; })();

const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();       // m は 0始まり
const daysInYM = ym => { const [y,m]=ym.split('-').map(Number); return daysInMonth(y, m-1); };
const ymAdd = (ym, n) => { const [y,m]=ym.split('-').map(Number);
  const t=new Date(y, m-1+n, 1); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`; };
const thisYM = () => today().slice(0,7);

/* 支払サイトから支払期日を出す */
function calcDueDate(v, baseDate){
  if(!v || !v.payDay) return '';
  const d = new Date(baseDate || today());
  if(isNaN(d)) return '';
  const close = Number(v.closeDay || 31);
  let mIndex = d.getMonth();
  // 締め日を過ぎて発行されたぶんは、次の締めに乗る
  if(close < 31 && d.getDate() > close) mIndex += 1;
  const off = Number(v.payMonth==null ? 1 : v.payMonth);
  const t = new Date(d.getFullYear(), mIndex + off, 1);
  const last = daysInMonth(t.getFullYear(), t.getMonth());
  const day = Math.min(Number(v.payDay||31), last);
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function payTermsLabel(v){
  if(!v || !v.payDay) return '支払サイト未設定';
  const c = Number(v.closeDay||31)>=31 ? '月末' : (v.closeDay+'日');
  const pm = ['当月','翌月','翌々月'][Number(v.payMonth==null?1:v.payMonth)] || '';
  const pd = Number(v.payDay)>=31 ? '末' : (v.payDay+'日');
  return `${c}締め ${pm}${pd}払い`;
}
const vendorById   = id => S.vendors.find(v=>v.id===id) || null;
const vendorByName = nm => S.vendors.find(v=>v.name===nm) || null;

  document.body.appendChild(m);

  if(!names.length) list.innerHTML='<div style="font-size:12px;color:var(--sub);padding:12px 0">新しく取り込める取引先はありません。</div>';
  names.forEach(([n,c])=>{
    const r=el('label','swrow');
    r.innerHTML=`<input type="checkbox" checked value="${esc(n)}"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span style="color:#9aa3b2;font-size:11.5px">${c}件</span>`;
    list.appendChild(r);
  });
  m.querySelector('#vc').onclick=()=>m.remove();
  m.querySelector('#vg').onclick=async()=>{
    const picked=[...list.querySelectorAll('input:checked')].map(i=>i.value);
    if(!picked.length) return m.remove();
    let b=writeBatch(db), i=0;
    for(const n of picked){
      const v=newVendorObj(n);
      const d=S.docs.find(x=>x.vendor===n);
      if(d && d.store) v.store=d.store;
      b.set(doc(db,'vendors',v.id), v); S.vendors.push(v);
      if(++i%300===0){ await b.commit(); b=writeBatch(db); }
    }
    await b.commit();
    await idbSet('vendors_cache', null);
    m.remove(); renderVendors(); toast(`${picked.length}件を登録しました`);
  };
}

/* ============================================================
   定期支払い（A-1）
   ─────────────────────────────────────────────
   毎月ほぼ同額で必ず来るもの（hacomono・税理士・家賃など）をルールにしておき、
   毎月「予定」の行を台帳に自動で立てる。
   月が進んでも予定のままで請求書が紐づいていない ＝ 請求書が届いていない、が見える。
   ============================================================ */
function newRuleObj(){
  return { id:'r'+Date.now()+Math.random().toString(36).slice(2,5), label:'', vendorId:'', vendor:'',
    store:STORES[0], type:'請求書', amount:null, dayOfMonth:1, dueDay:null,
    startYM:thisYM(), endYM:'', memo:'', active:true,
    createdBy:ME.name, createdAt:nowISO(), updatedAt:nowISO(), deleted:false };
}
const recId = (ruleId, ym) => `rec_${ruleId}_${ym.replace('-','')}`;

/* 予定を立てる対象の月。今月と、月末が近ければ来月ぶんも先に立てる */
function recurringTargetMonths(){
  const t=new Date();
  const out=[thisYM()];
  if(t.getDate() >= daysInMonth(t.getFullYear(), t.getMonth()) - 6) out.push(ymAdd(thisYM(), 1));
  return out;
}
function ruleDue(r, issued){
  if(r.dueDay){
    const d=new Date(issued);
    const t=new Date(d.getFullYear(), d.getMonth()+1, 1);   // 既定は翌月
    const last=daysInMonth(t.getFullYear(), t.getMonth());
    const day=Math.min(Number(r.dueDay), last);
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  return calcDueDate(vendorById(r.vendorId), issued);
}
function plannedDocFor(r, ym){
  const id=recId(r.id, ym);
  const v=vendorById(r.vendorId);
  const day=Math.min(Number(r.dayOfMonth||1), daysInYM(ym));
  const issued=`${ym}-${String(day).padStart(2,'0')}`;
  return { id, type:r.type||'請求書', vendor:r.vendor || (v?v.name:''), vendorId:r.vendorId||'',
    amount: r.amount==null?null:Number(r.amount),
    issuedAt:issued, dueAt:ruleDue(r, issued), period:ym,
    store:r.store||'', section:'', status:'planned', planned:true, recurringId:r.id, recurringYM:ym,
    fileName:'', hasFile:false, fileSize:0, fileType:'', filePath:'', fileLink:'',
    noteId:'', noteTitle:'', folder:'', memo:r.memo||'',
    createdBy:'（定期支払いより自動）', createdByEmail:'', createdAt:nowISO(), updatedAt:nowISO(),
    deleted:false, source:'recurring' };
}
/* 足りていない予定行を作る。同じIDなので何度実行しても増えない */
async function ensureRecurring(monthsOverride){
  const rules = S.recurring.filter(r=>r.active!==false && !r.deleted);
  if(!rules.length) return 0;
  const months = monthsOverride || recurringTargetMonths();
  const have = new Set(S.docs.map(d=>d.id));
  const make=[];
  rules.forEach(r=>months.forEach(ym=>{
    if(r.startYM && ym < r.startYM) return;
    if(r.endYM && ym > r.endYM) return;
    if(have.has(recId(r.id, ym))) return;
    make.push(plannedDocFor(r, ym));
  }));
  if(!make.length) return 0;
  let b=writeBatch(db), i=0;
  for(const d of make){
    b.set(doc(db,'documents',d.id), d);
    if(++i%300===0){ await b.commit(); b=writeBatch(db); }
  }
  await b.commit();
  make.forEach(d=>S.docs.push(d));
  await idbSet('docs_cache', null);
  return make.length;
}

/* 請求書が届いていない予定行。
   予定日ちょうどで騒ぐと毎月うるさいので、5日過ぎてから知らせる。 */
const MISS_GRACE = 5;
const isMissing = d => d.status==='planned' && !d.deleted
  && !d.hasFile && !d.filePath && !d.fileLink
  && (d.issuedAt||'') !== '' && daysBetween(d.issuedAt, today()) >= MISS_GRACE;
function missingInvoices(){
  const t=today();
  return S.docs.filter(d=> d.status==='planned' && !d.deleted
      && !d.hasFile && !d.filePath && !d.fileLink
      && (d.issuedAt||'') !== ''
      && daysBetween(d.issuedAt, t) >= MISS_GRACE)
    .sort((a,b)=>String(a.issuedAt||'').localeCompare(String(b.issuedAt||'')));
}

  const V=$('#view-recurring'); V.innerHTML='';
  const p=el('div','page'); const w=el('div','page-w'); p.appendChild(w); V.appendChild(p);

  acctTabs(w);
  const hd=el('div'); hd.style.cssText='display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap';
  const ti=el('div');

  ti.appendChild(el('div','lead','毎月かならず来るものを登録しておくと、月初に台帳へ「予定」の行が自動で立ちます。予定のまま請求書が来ない＝届いていない、が見えます。'));
  hd.appendChild(ti);

  const gb=el('button','btn','いま予定を作る');
  gb.onclick=async()=>{ gb.disabled=true; gb.textContent='作成中…';
    const n=await ensureRecurring(); gb.disabled=false; gb.textContent='いま予定を作る';
    toast(n? `${n}件の予定を立てました` : '不足している予定はありません'); renderRecurring(); };
  acts.appendChild(gb);
  hd.appendChild(acts); w.appendChild(hd);

  // 届いていない請求書
  const miss = missingInvoices();
  if(miss.length){
    const b=el('div','miss');
    b.innerHTML=`<b>請求書が届いていないかもしれません（${miss.length}件）</b>
      <div class="mt">予定日を過ぎましたが、まだファイルもリンクも付いていません。先方に確認してください。</div>`;

      b.appendChild(r);
    });
    w.appendChild(b);
  }

  const rules = S.recurring.filter(r=>!r.deleted)
    .sort((a,b)=>(b.active!==false)-(a.active!==false) || String(a.vendor||'').localeCompare(String(b.vendor||''),'ja'));
  const monthly = rules.filter(r=>r.active!==false).reduce((s,r)=>s+(Number(r.amount)||0),0);
  const st=el('div','stat');
  st.innerHTML = `${rules.length}件`
    + (monthly ? `　/　毎月の固定費 ${yen(monthly)}` : '')
    + `　/　次に予定を立てる月 ${esc(recurringTargetMonths().join('・'))}`;
  w.appendChild(st);

  if(!rules.length){
    w.appendChild(el('div','empty',
      'まだ登録がありません。<br>hacomono・税理士・家賃・リースなど、毎月ほぼ同額で必ず来るものを入れてください。'));
    return;
  }

  const g=el('div','vcards');
  rules.forEach(r=>{
    const ym=thisYM();
    const d=S.docs.find(x=>x.id===recId(r.id, ym));
    const state = !d ? ['—','未作成']
      : d.status==='planned' ? ['planned','予定（請求書待ち）']
      : [d.status, DSTATUS[d.status]||''];
    const c=el('div','vcard');
    c.innerHTML=`<div class="nm">${esc(r.label || r.vendor || '(名称未設定)')}</div>
      <div class="kn">${esc(r.vendor||'')}${r.store?'　'+esc(r.store):''}</div>
      <div class="rw"><span class="amt">${yen(r.amount)}</span>
        <span style="color:var(--sub)">毎月${esc(String(r.dayOfMonth||1))}日ごろ</span>
        ${r.active===false?'<span class="badge">停止中</span>':''}</div>

    c.onclick=()=>openRule(r.id);

  w.appendChild(g);
}

function openRule(id){
  const isNew=!id;
  const r = isNew ? newRuleObj() : S.recurring.find(x=>x.id===id);
  if(!r) return;
  const before = JSON.parse(JSON.stringify(r));

  const bg=el('div','drawer-bg'); const dw=el('div','drawer');
  const close=()=>{ bg.remove(); dw.remove(); };
  bg.onclick=close;

  const hd=el('div','dh'); hd.style.position='relative';
  hd.innerHTML=`<button class="x">&times;</button>
    <div style="font-size:11.5px;color:var(--sub);letter-spacing:.05em">定期支払い</div>
    <h2>${esc(r.label || r.vendor || '新しい定期支払い')}</h2>`;
  hd.querySelector('.x').onclick=close;
  dw.appendChild(hd);
  const bd=el('div','db'); dw.appendChild(bd);

  const g=el('div','fgrid');
  const f=(l,n)=>{ g.appendChild(el('label',null,esc(l))); g.appendChild(n); return n; };
  const inp=(v,t)=>{ const i=el('input'); i.type=t||'text'; i.value=v==null?'':v; return i; };
  const sl=(v,opts)=>{ const s=el('select'); opts.forEach(([o,l])=>{ const e=el('option',null,esc(l)); e.value=o; s.appendChild(e); }); s.value=String(v==null?'':v); return s; };

  const fLabel = f('名称', inp(r.label)); fLabel.placeholder='例：hacomono 月額';
  const fVen   = f('取引先', sl(r.vendorId, [['','（マスタから選ぶ）'],...activeVendors().map(v=>[v.id,v.name])]));
  const fVenTx = f('取引先名（直接入力）', inp(r.vendor));
  const fStore = f('店舗・部門', sl(r.store, STORES.map(s=>[s,s])));
  const fType  = f('種別', sl(r.type||'請求書', DTYPES.map(t=>[t,t])));
  const fAmt   = f('毎月の金額', inp(r.amount,'number'));
  const fDay   = f('毎月の発生日', sl(r.dayOfMonth||1, DAYOPTS));
  const fDue   = f('支払期日', sl(r.dueDay||'', [['','取引先の支払サイトに従う'],...DAYOPTS.map(([a,b])=>[a,'翌月'+b])]));
  const fStart = f('開始月', inp(r.startYM)); fStart.placeholder='2026-08';
  const fEnd   = f('終了月', inp(r.endYM));   fEnd.placeholder='空欄なら終わりなし';
  const fMemo  = f('メモ', el('textarea')); fMemo.value=r.memo||'';
  const fAct   = f('有効', (()=>{ const c=el('input'); c.type='checkbox'; c.checked=r.active!==false;
    c.style.cssText='width:16px;height:16px;accent-color:var(--accent)'; return c; })());
  bd.appendChild(g);

  const prev=el('div','help'); bd.appendChild(prev);
  const drawPrev=()=>{
    const tmp={...r, vendorId:fVen.value, dueDay:fDue.value?Number(fDue.value):null,
      dayOfMonth:Number(fDay.value), amount: fAmt.value===''?null:Number(fAmt.value)};
    const ym=thisYM();
    const d=plannedDocFor({...tmp, id:'preview'}, ym);
    prev.innerHTML=`今月なら <b>${esc(d.issuedAt)}</b> に予定を立て、支払期日は <b>${esc(d.dueAt||'—（取引先の支払サイトが未設定）')}</b> になります。`;
  };
  [fVen,fDay,fDue,fAmt].forEach(x=>x.onchange=drawPrev);
  fVen.onchange=()=>{ const v=vendorById(fVen.value);
    if(v){ if(!fVenTx.value) fVenTx.value=v.name; if(!fAmt.value && v.defaultAmount) fAmt.value=v.defaultAmount;
           if(v.store) fStore.value=v.store; }

  const rw=el('div'); rw.style.cssText='display:flex;gap:8px;margin-top:18px;flex-wrap:wrap';
  const save=el('button','btn primary', isNew?'追加する':'保存'); rw.appendChild(save);
  if(!isNew){
    const del=el('button','btn','削除');

      if(!confirm('この定期支払いを消します。すでに立った予定の行は残ります。よろしいですか？')) return;

    if(i<0) S.recurring.push(after); else S.recurring[i]=after;
    await idbSet('recurring_cache', null);

  if(!isNew){
    const ds=S.docs.filter(d=>d.recurringId===r.id)

    bd.appendChild(el('div','sect-t',`この定期支払いから立った行 ${ds.length}件`));
    if(!ds.length) bd.appendChild(el('div',null,'<div style="font-size:11.5px;color:#9aa3b2">まだありません</div>'));

      const box=el('div','listbox');
      ds.slice(0,12).forEach(d=>{
        const row=el('div','srow');
        row.innerHTML=`<span class="pill ${esc(d.status||'checked')}">${esc(DSTATUS[d.status]||'—')}</span>
          <b>${esc(d.period||'')}</b><span class="s">期日 ${esc(d.dueAt||'—')}</span><span class="d">${yen(d.amount)}</span>`;
        row.onclick=()=>{ close(); go('docs'); openDoc(d.id); };
        box.appendChild(row);
      });
      bd.appendChild(box);
    }
    const hw=el('div'); bd.appendChild(hw); mountHistory(hw, 'rule', r.id);
  }

  document.body.appendChild(bg); document.body.appendChild(dw);
  if(isNew) fLabel.focus();
}

/* ============================================================
   支払いカレンダー（A-5）
   ============================================================ */
const WDAY=['日','月','火','水','木','金','土'];
function renderDocCalendar(w, rows){
  const ym = S.calYM || thisYM();
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const start = new Date(y, m-1, 1 - first.getDay());
  const inMonth = rows.filter(d=>(d.dueAt||'').slice(0,7)===ym);
  const sum = a => a.reduce((s,d)=>s+(Number(d.amount)||0),0);
  const openRows = inMonth.filter(d=>OPEN_ST.includes(d.status) || d.status==='planned');
  const paidRows = inMonth.filter(d=>d.status==='paid');

  const bar=el('div','calbar');
  const prev=el('button','btn sm','←'); prev.onclick=()=>{ S.calYM=ymAdd(ym,-1); renderDocs(); };
  const next=el('button','btn sm','→'); next.onclick=()=>{ S.calYM=ymAdd(ym, 1); renderDocs(); };
  const now =el('button','btn sm','今月'); now.onclick=()=>{ S.calYM=thisYM(); renderDocs(); };
  bar.appendChild(prev);
  bar.appendChild(el('div','mo',`${y}年${m}月`));
  bar.appendChild(next); bar.appendChild(now);
  const s=el('div','sum');
  s.innerHTML = `この月に出ていくお金 <b>${yen(sum(openRows))}</b>（${openRows.length}件）`
    + (paidRows.length? `　/　支払済 ${yen(sum(paidRows))}` : '');
  bar.appendChild(s);
  w.appendChild(bar);

  const byDay = new Map();
  inMonth.forEach(d=>{ const k=d.dueAt; if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(d); });

  const cal=el('div','cal');
  WDAY.forEach((d,i)=>cal.appendChild(el('div','dow'+(i===0?' sun':i===6?' sat':''), d)));
  const t=today();
  for(let i=0;i<42;i++){
    const dt=new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const out = dt.getMonth() !== m-1;
    if(out && i>=35) continue;
    const c=el('div','cell'+(out?' out':'')+(iso===t?' today':''));
    const list=(byDay.get(iso)||[]).sort((a,b)=>(Number(b.amount)||0)-(Number(a.amount)||0));
    const dsum=list.reduce((s2,d)=>s2+(Number(d.amount)||0),0);
    c.appendChild(el('div','dn',`${dt.getDate()}${dsum?`<span class="t">${yen(dsum)}</span>`:''}`));
    list.slice(0,3).forEach(d=>{
      const e=el('div','ev '+(d.status||'checked'));
      e.innerHTML=`<span class="a">${d.amount?Number(d.amount).toLocaleString('ja-JP'):''}</span>${esc(d.vendor||d.type||'')}`;
      e.title=`${d.vendor||''} ${yen(d.amount)} ${DSTATUS[d.status]||''}`;
      e.onclick=()=>openDoc(d.id);
      c.appendChild(e);
    });
    if(list.length>3){
      const mo=el('div','more',`ほか ${list.length-3}件`);
      mo.onclick=()=>{ S.dfil={...S.dfil, day:iso}; S.docView='table'; renderDocs(); };
      c.appendChild(mo);
    }
    cal.appendChild(c);
  }
  w.appendChild(cal);

  const legend=el('div','help');
  legend.innerHTML='支払期日の日に置いています。<span class="pill planned">予定</span> は定期支払いから自動で立った行、'
    + '<span class="pill unpaid">未払い</span> は支払い待ち、<span class="pill paid">支払済</span> は済んだものです。';
  legend.style.marginTop='10px';
  w.appendChild(legend);

  const noDue = rows.filter(d=>!d.dueAt && OPEN_ST.includes(d.status));
  if(noDue.length){
    const n=el('div','miss');
    n.innerHTML=`<b>支払期日が入っていない書類が ${noDue.length}件 あります</b>
      <div class="mt">期日が無いとカレンダーに出ません。取引先マスタに支払サイトを入れておくと、次からは自動で入ります。</div>`;
    noDue.slice(0,6).forEach(d=>{
      const r=el('div','mi');
      r.innerHTML=`<span>${esc(d.vendor||'(取引先未設定)')}</span><span style="color:var(--sub)">${esc(d.period||d.issuedAt||'')}</span><span class="d">${yen(d.amount)}</span>`;
      r.onclick=()=>openDoc(d.id);
      n.appendChild(r);
    });
    w.appendChild(n);
  }
}

/* ============================================================
   OCR（A-2）— ブラウザの中だけで読む。外に送らない
   ─────────────────────────────────────────────
   Tesseract.js で日本語OCR。PDFは pdf.js で1ページ目を画像にしてから読む。
   読み取った金額は「候補」として出し、押したものだけを採用する。
   ============================================================ */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

function loadScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const s=document.createElement('script'); s.src=src; s.async=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('読み込めませんでした（ネットにつながっているか確認してください）'));
    document.head.appendChild(s);
  });
}
async function ensureTesseract(){ if(!window.Tesseract) await loadScript(TESS_URL); return window.Tesseract; }
async function ensurePdfjs(){
  if(!window.pdfjsLib) await loadScript(PDFJS_URL);
  if(window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc)
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  return window.pdfjsLib;
}

/* 読み取る対象（画像ならそのまま、PDFなら1ページ目を画像にする） */
async function ocrSource(d, onMsg){
  const f = await loadDocFile(d.id);
  if(!f) throw new Error('アプリの中にファイルがありません。先に写真かPDFを添付してください。');
  if(/^image\//.test(f.type||'')) return f.url;
  if(/pdf/i.test(f.type||'') || /\.pdf$/i.test(f.name||'')){
    onMsg && onMsg('PDFを画像にしています…');
    const pdfjs = await ensurePdfjs();
    const buf = await (await fetch(f.url)).arrayBuffer();
    const pdf = await pdfjs.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:2});
    const cv = document.createElement('canvas');
    cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    return cv;
  }
  throw new Error('この形式は読み取れません（写真かPDFにしてください）');
}

/* 金額の候補を拾う。合計・ご請求金額などの近くにある数字を優先する */
const AMT_KEYS = ['合計','ご請求','御請求','請求金額','お支払','支払金額','総額','税込','小計','計'];
const NEG_KEYS = ['消費税','内税','外税','税額','単価','数量','電話','TEL','〒','振込手数料','ページ'];
function parseAmounts(text){
  const norm = (text||'')
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[，]/g, ',').replace(/[￥]/g,'¥');
  const lines = norm.split(/\n/);
  const found = new Map();
  lines.forEach(line=>{
    const kw  = AMT_KEYS.some(k=>line.includes(k));
    const neg = NEG_KEYS.some(k=>line.includes(k));
    const re = /(¥|\\)?\s*([0-9][0-9,\s]{2,})\s*(円)?/g;
    let mm;
    while((mm = re.exec(line))){
      const raw = mm[2].replace(/[,\s]/g,'');
      if(raw.length<3 || raw.length>9) continue;
      const n = Number(raw);
      if(!n || n<100 || n>99999999) continue;
      let score = 0;
      if(kw) score += 6;
      if(neg) score -= 5;
      if(mm[1]) score += 3;
      if(mm[3]) score += 2;
      if(mm[2].includes(',')) score += 3;
      if(/(合計|ご請求|御請求|請求金額|お支払)/.test(line)) score += 3;
      score += Math.min(3, String(n).length - 3);
      const cur = found.get(n);
      if(!cur || cur.score < score) found.set(n, {n, score, line:line.trim().slice(0,60)});
    }
  });
  return [...found.values()].sort((a,b)=> b.score-a.score || b.n-a.n).slice(0,6);
}
function parseDates(text){
  const norm=(text||'').replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const out=new Set();
  const re1=/(20[0-9]{2})\s*[年\/\.\-]\s*([01]?[0-9])\s*[月\/\.\-]\s*([0-3]?[0-9])/g;
  let m;
  while((m=re1.exec(norm))){
    const y=+m[1], mo=+m[2], d=+m[3];
    if(mo<1||mo>12||d<1||d>31) continue;
    out.add(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return [...out].sort().slice(0,6);
}

let _ocrWorker=null;
async function ocrRecognize(src, onMsg){
  const T = await ensureTesseract();
  onMsg && onMsg('日本語の文字データを用意しています…（初回だけ少し待ちます）');
  if(!_ocrWorker){
    _ocrWorker = await T.createWorker('jpn', 1, {
      logger: m => { if(m.status==='recognizing text') onMsg && onMsg(`読み取り中… ${Math.round((m.progress||0)*100)}%`); }
    });
  }
  onMsg && onMsg('読み取り中…');
  const { data } = await _ocrWorker.recognize(src);
  return data.text || '';
}

/* 書類ひとつをOCRして、結果を保存する（金額は勝手に入れない） */
async function ocrDoc(d, onMsg){
  const src = await ocrSource(d, onMsg);
  const text = await ocrRecognize(src, onMsg);
  const amts = parseAmounts(text);
  const dates = parseDates(text);
  const patch = { ocrText:(text||'').slice(0,3000), ocrCands:amts.map(a=>a.n),
                  ocrDates:dates, ocrAt:nowISO(), updatedAt:nowISO() };
  Object.assign(d, patch);
  try{
    await setDoc(doc(db,'documents',d.id), patch, {merge:true});
    await idbSet('docs_cache', null);
  }catch(e){}
  return { text, amts, dates };
}

/* 保存前のファイル（登録モーダル）をそのまま読む */
async function ocrFile(file, onMsg){
  let src = file;
  if(/pdf/i.test(file.type||'') || /\.pdf$/i.test(file.name||'')){
    onMsg && onMsg('PDFを画像にしています…');
    const pdfjs = await ensurePdfjs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjs.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:2});
    const cv = document.createElement('canvas');
    cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    src = cv;
  }
  const text = await ocrRecognize(src, onMsg);
  return { text, amts:parseAmounts(text), dates:parseDates(text) };
}

      dr.appendChild(el('span',null,'<span style="font-size:11.5px;color:var(--sub);align-self:center">日付</span>'));

/* ============================================================
   二重払いの検知（追加①）
   ─────────────────────────────────────────────
   同じ取引先・同じ対象月・同じ金額の書類が2件以上あったら知らせる。
   請求書の再送、登録のダブり、月をまたいだ重複入力を、支払う前に見つけるためのもの。
   「これは別物」と判断したら、その組み合わせは以後出さない。
   ============================================================ */
const dupKey = d => `${d.vendor}|${d.period || (d.issuedAt||'').slice(0,7)}|${Number(d.amount)}`;

function findDuplicates(){
  const ignore = new Set(S.settings.dupIgnore || []);
  const rows = S.docs.filter(d=>!d.deleted && d.status!=='planned'
    && d.vendor && d.amount!=null && d.amount!=='' && Number(d.amount)>0);
  const g = new Map();
  rows.forEach(d=>{
    const k = dupKey(d);
    if(ignore.has(k)) return;
    if(!g.has(k)) g.set(k, []);
    g.get(k).push(d);
  });
  return [...g.entries()]
    .filter(([,v])=>v.length>1)
    .map(([k,v])=>({
      key:k, kind:'same',
      vendor:v[0].vendor, period:v[0].period || (v[0].issuedAt||'').slice(0,7),
      amount:Number(v[0].amount),
      // まだ払っていないものが混じっているかどうかで、危なさが変わる
      risk: v.some(d=>OPEN_ST.includes(d.status)) ? 'open' : 'paid',
      rows:v.slice().sort((a,b)=>String(a.issuedAt||'').localeCompare(String(b.issuedAt||'')))
    }))
    .sort((a,b)=> (a.risk==='open'?0:1)-(b.risk==='open'?0:1) || b.amount-a.amount);
}
/* まだ払っていないものを含む＝いま止められるもの */

/* ============================================================
   過去のぶんをまとめて支払済にする
   ─────────────────────────────────────────────
   「これから来るぶんだけを管理する」ときの区切り作業。
   区切りの日より前に発行された書類を、まとめて「支払済」にする。
   予定の行（定期支払いから自動で立ったもの）には触らない。
   1件ずつ変更履歴に残すので、あとから何を変えたか追える。
   ============================================================ */
const PAYABLE = ['請求書','納品書'];   // お金を払う書類だけが「支払済」になりうる
function bulkPaidTargets(cutoff, onlyPayable){
  return S.docs.filter(d=>
    !d.deleted &&
    d.status !== 'planned' &&          // 予定は触らない
    d.status !== 'paid' &&             // すでに支払済はそのまま
    (d.issuedAt||'') !== '' &&
    d.issuedAt <= cutoff &&
    (onlyPayable === false || PAYABLE.includes(d.type))
  );
}

    <div class="row"><button id="bp-c">閉じる</button>

  document.body.appendChild(m);

        ${noDate?`<br><span style="color:var(--warn)">発行日が空の ${noDate}件 は対象外です（日付が無いと過去かどうか判断できないため）。あとで個別に直してください。</span>`:''}

  $$('#bp-g').onclick=async()=>{

    const go=$$('#bp-g');

      armed=true;
      go.textContent=`本当に ${targets.length}件 を支払済にする`;
      go.style.background='var(--danger)'; go.style.borderColor='var(--danger)';
      $$('#bp-sum').insertAdjacentHTML('beforeend',
        '<div class="help" id="bp-warn" style="color:var(--danger)">もう一度押すと実行します。やめるときは「閉じる」を押してください。</div>');
      return;
    }
    go.disabled=true; go.textContent='実行中…';
    go.style.background=''; go.style.borderColor='';
    const lg=$$('#bp-l'); lg.style.display='block';
    const log=t=>{ lg.textContent+=t+'\n'; lg.scrollTop=lg.scrollHeight; };
    const at=nowISO();
    const note=`${cutoff} 以前のぶんをまとめて支払済にしました`;
    try{
      let b=writeBatch(db), n=0;
      for(let i=0;i<targets.length;i++){
        const d=targets[i];
        const before=d.status;
        const p={ status:'paid', paidBy:ME.name, paidAt:at, updatedAt:nowISO(), editor:ME.name };
        b.set(doc(db,'documents',d.id), p, {merge:true});
        // 変更履歴（1件ずつ残す）
        const hid='h'+Date.now()+i.toString(36)+Math.random().toString(36).slice(2,5);
        b.set(doc(db,'history',hid), {
          id:hid, target:'doc', targetId:String(d.id),
          title:`${d.vendor||''} ${d.period||''}`.slice(0,120),
          action:'status', note,
          changes:[{f:'status', label:'状態', from:(DSTATUS[before]||before), to:'支払済'}],
          by:ME.name, byEmail:ME.email, at:nowISO() });
        Object.assign(d, p);
        n+=2;
        if(n>=400){ await b.commit(); b=writeBatch(db); n=0;
          $$('#bp-b').style.width=((i+1)/targets.length*100).toFixed(0)+'%';
          log(`${i+1} / ${targets.length}`); }
      }
      await b.commit();
      $$('#bp-b').style.width='100%';
      await idbSet('docs_cache', null);
      log(`${targets.length}件を支払済にしました。`);
      go.textContent='完了';

      if(S.view==='docs') renderDocs();
      renderAlertBar(); renderNav();
      toast(`${targets.length}件を支払済にしました`);
    }catch(e){
      log('エラー: '+e.message);
      go.disabled=false; go.textContent='もう一度';
    }
  };
}

/* ============================================================
   店舗分類の統合（2026年8月）
   ─────────────────────────────────────────────
   Fitness と Li'l Fit と NIRAM → FITNESS
   Beauty と ULuLu → BEAUTY
   CAFE と it's Time coffee → CAFE
   経理 → 本部
   台帳（documents）・取引先（vendors）・定期支払い（recurring）の
   store フィールドをまとめて書き換える。1件ずつ変更履歴に残す。
   ============================================================ */
function storeMergeTargets(){
  const mk = (list, coll) => list
    .filter(x => !x.deleted && x.store && STORE_MERGE_MAP[x.store] && STORE_MERGE_MAP[x.store]!==x.store)
    .map(x => ({ coll, id:x.id, from:x.store, to:STORE_MERGE_MAP[x.store], item:x }));
  return [
    ...mk(S.docs, 'documents'),
    ...mk(S.vendors, 'vendors'),
    ...mk(S.recurring, 'recurring'),
  ];
}
const STOREMERGE_LABEL = { documents:'台帳', vendors:'取引先', recurring:'定期支払い' };
function openStoreMerge(){
  const m=el('div','modal');

    byPair[k].n++;
    if(t.coll==='documents') byPair[k].amount += Number(t.item.amount)||0;
  });
  const pairs = Object.values(byPair).sort((a,b)=> a.to.localeCompare(b.to) || a.from.localeCompare(b.from));
  const byColl = {};
  targets.forEach(t=>{ byColl[t.coll]=(byColl[t.coll]||0)+1; });

    <p>台帳・取引先・定期支払いの「店舗・部門」を、下の対応でまとめて書き換えます。<br>
       1件ずつ変更履歴に残るので、あとから何を変えたか追えます。</p>
    <div id="sm-sum" style="margin-top:14px">

            <tbody>${pairs.map(p=>`<tr>
              <td>${esc(p.from)}</td><td>→</td><td><b>${esc(p.to)}</b></td>

      return;
    }
    go.disabled=true; go.textContent='実行中…';
    go.style.background=''; go.style.borderColor='';

    try{

      for(let i=0;i<targets.length;i++){
        const t=targets[i];
        b.set(doc(db,t.coll,t.id), { store:t.to, updatedAt:nowISO(), editor:ME.name }, {merge:true});
        const hid='h'+Date.now()+i.toString(36)+Math.random().toString(36).slice(2,5);

/* ============================================================
   月次レポート（追加②）
   ─────────────────────────────────────────────
   台帳を「店舗 × 月」で集計する。前月比と、取引先の上位10件も出す。
   いま手で作っている月次のスプレッドシートを置き換えるのが狙い。
   ============================================================ */
const repMonthOf = d => d.period && /^\d{4}-\d{2}$/.test(d.period)
  ? d.period : (d.issuedAt||'').slice(0,7);

function reportRows(year){
  return S.docs.filter(d=>{
    if(d.deleted) return false;
    if(d.status==='planned') return false;         // 予定はまだ確定していないので入れない
    if(S.repScope==='請求書' && d.type!=='請求書') return false;
    const ym = repMonthOf(d);
    return ym.slice(0,4)===String(year);
  });
}
function renderReport(){
  const V=$('#view-report'); V.innerHTML='';
  const p=el('div','page'); const w=el('div','page-w'); p.appendChild(w); V.appendChild(p);

  const years = [...new Set(S.docs.map(d=>repMonthOf(d).slice(0,4)).filter(Boolean))].sort().reverse();
  const year = S.repYear || (years.includes(today().slice(0,4)) ? today().slice(0,4) : years[0]) || today().slice(0,4);
  S.repYear = year;

  acctTabs(w);
  const hd=el('div'); hd.style.cssText='display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap';
  const ti=el('div');
  ti.appendChild(el('h1',null,'月次レポート'));
  ti.appendChild(el('div','lead','台帳を店舗×月で集計します。前月と比べてどうかが一目でわかります。予定の行は入れていません。'));
  hd.appendChild(ti);
  const acts=el('div'); acts.style.cssText='margin-left:auto;display:flex;gap:8px;flex-wrap:wrap';
  const cb=el('button','btn','CSV書き出し'); cb.onclick=()=>exportReportCsv(year); acts.appendChild(cb);
  hd.appendChild(acts); w.appendChild(hd);

  const f=el('div','filters'); f.style.marginTop='16px';
  const ys=el('select');
  (years.length?years:[year]).forEach(y=>{ const o=el('option',null,y+'年'); o.value=y; ys.appendChild(o); });
  ys.value=year; ys.onchange=()=>{ S.repYear=ys.value; renderReport(); };
  f.appendChild(ys);
  const sc=el('div','segs');
  [['請求書','請求書だけ'],['all','すべての書類']].forEach(([k,l])=>{
    const b=el('button', S.repScope===k?'on':'', esc(l));
    b.onclick=()=>{ S.repScope=k; renderReport(); };
    sc.appendChild(b);
  });
  f.appendChild(sc);
  w.appendChild(f);

  const rows = reportRows(year);
  if(!rows.length){
    w.appendChild(el('div','empty',`${year}年のデータがありません`));
    return;
  }

  // 店舗 × 月
  const stores=[...new Set(rows.map(d=>d.store||'（未設定）'))].sort();
  const cell={}, monthTot=new Array(12).fill(0);
  stores.forEach(s=>cell[s]=new Array(12).fill(0));
  rows.forEach(d=>{
    const mi = Number(repMonthOf(d).slice(5,7))-1;
    if(mi<0||mi>11) return;
    const a = Number(d.amount)||0;
    cell[d.store||'（未設定）'][mi]+=a; monthTot[mi]+=a;
  });
  const total = monthTot.reduce((a,b)=>a+b,0);

  const st=el('div','stat');
  const withAmt = rows.filter(d=>d.amount!=null && d.amount!=='').length;
  st.innerHTML = `${year}年　${rows.length}件　/　合計 <b style="color:var(--text)">${yen(total)}</b>`
    + (withAmt!==rows.length ? `　/　<span style="color:var(--warn)">金額が空 ${rows.length-withAmt}件（集計に入っていません）</span>` : '');
  w.appendChild(st);

  const wrap=el('div','rep');
  const t=el('table','rept');
  const th=el('thead'); const tr=el('tr');
  tr.appendChild(el('th',null,'店舗・部門'));
  for(let i=0;i<12;i++) tr.appendChild(el('th',null,(i+1)+'月'));
  tr.appendChild(el('th',null,'合計'));
  th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody');
  stores.forEach(s=>{
    const r=el('tr');
    r.appendChild(el('td',null,esc(s)));
    let sum=0;
    for(let i=0;i<12;i++){
      const v=cell[s][i]; sum+=v;
      const td=el('td', v?null:'z', v?Number(v).toLocaleString('ja-JP'):'—');
      r.appendChild(td);
    }
    r.appendChild(el('td',null,'<b>'+Number(sum).toLocaleString('ja-JP')+'</b>'));
    tb.appendChild(r);
  });
  const tr2=el('tr');
  tr2.appendChild(el('td',null,'合計'));
  for(let i=0;i<12;i++){
    const v=monthTot[i];
    const prev=i>0?monthTot[i-1]:0;
    let dlt='';
    if(v && prev){
      const pc=Math.round((v-prev)/prev*100);
      if(pc) dlt=`<span class="delta ${pc>0?'up':'dn'}">${pc>0?'+':''}${pc}%</span>`;
    }
    tr2.appendChild(el('td', v?null:'z', (v?Number(v).toLocaleString('ja-JP'):'—')+dlt));
  }
  tr2.appendChild(el('td',null,Number(total).toLocaleString('ja-JP')));
  tb.appendChild(tr2);
  t.appendChild(tb); wrap.appendChild(t); w.appendChild(wrap);
  w.appendChild(el('div','help','「合計」の行に出ている％は前の月と比べた増減です。金額が空の書類は集計に入りません。'));

  // 取引先 上位10
  const byV={};
  rows.forEach(d=>{ const k=d.vendor||'（未設定）'; byV[k]=(byV[k]||0)+(Number(d.amount)||0); });
  const top=Object.entries(byV).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(top.length){
    w.appendChild(el('div','sect-t',`取引先の上位 ${top.length}件（${year}年）`));
    const bars=el('div','bars');
    const max=top[0][1];
    top.forEach(([name,v])=>{
      const b=el('div','bar2');
      b.innerHTML=`<span class="lb">${esc(name)}</span>
        <span class="tr"><i style="width:${Math.max(2,Math.round(v/max*100))}%"></i></span>
        <span class="vl">${yen(v)}</span>`;
      const ven = vendorByName(name);
      if(ven){ b.style.cursor='pointer'; b.onclick=()=>{ go('vendors'); openVendor(ven.id); }; }
      bars.appendChild(b);
    });
    w.appendChild(bars);
  }
}
function exportReportCsv(year){
  const rows = reportRows(year);
  const stores=[...new Set(rows.map(d=>d.store||'（未設定）'))].sort();
  const cell={}; stores.forEach(s=>cell[s]=new Array(12).fill(0));
  rows.forEach(d=>{ const mi=Number(repMonthOf(d).slice(5,7))-1; if(mi<0||mi>11) return;
    cell[d.store||'（未設定）'][mi]+=Number(d.amount)||0; });
  const line = a => a.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
  const head = ['店舗・部門', ...Array.from({length:12},(_,i)=>(i+1)+'月'), '合計'];
  const body = stores.map(s=>line([s, ...cell[s], cell[s].reduce((a,b)=>a+b,0)]));
  const tot = Array.from({length:12},(_,i)=>stores.reduce((a,s)=>a+cell[s][i],0));
  body.push(line(['合計', ...tot, tot.reduce((a,b)=>a+b,0)]));
  const csv='﻿'+[line(head),...body].join('\r\n');
  const a=el('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`Period_stock_月次レポート_${year}.csv`; a.click();
  toast('書き出しました');
}

/* ============================================================
   全データの書き出し（追加③・バックアップ）
   ─────────────────────────────────────────────
   Stockのときに「エクスポートが無くて出せない」で困ったので、
   同じことが二度と起きないよう、いつでも全部を1ファイルで持ち出せるようにする。
   ============================================================ */
const BACKUP_COLLS = [
  ['folders','フォルダ'], ['documents','書類の台帳'], ['minutes','議事録'],
  ['vendors','取引先'], ['recurring','定期支払い'], ['comments','コメント'],
  ['history','変更履歴'], ['members','メンバー'], ['settings','設定'],
];
function openBackup(){
  const m=el('div','modal');
  m.innerHTML=`<div class="box"><h3>全データを書き出す（バックアップ）</h3>
    <p>ノート・書類の台帳・議事録・取引先・コメント・変更履歴を、1つのファイルにまとめて保存します。
       Stockのときのように「出せなくて困る」ことが起きないための保険です。</p>
    <label class="swrow"><input type="checkbox" id="bk-notes" checked>
      <span>ノートの本文も含める（${S.notes.length.toLocaleString()}件・数分かかります）</span></label>
    <div class="help">写真とPDFの実体は入りません（重くなりすぎるため）。
      台帳のファイルは、必要なときに書類の詳細から個別に保存してください。</div>
    <div class="bar"><i id="bk-b"></i></div>
    <div class="log" id="bk-l" style="display:none"></div>
    <div class="row"><button id="bk-c">閉じる</button><button id="bk-g" class="primary">書き出す</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#bk-c').onclick=()=>m.remove();
  m.querySelector('#bk-g').onclick=async()=>{
    const go=m.querySelector('#bk-g'); go.disabled=true; go.textContent='書き出し中…';
    const lg=m.querySelector('#bk-l'); lg.style.display='block';
    const log=t=>{ lg.textContent+=t+'\n'; lg.scrollTop=lg.scrollHeight; };
    const bar=m.querySelector('#bk-b');
    const out={ __meta:{ app:'Period.stock', exportedAt:nowISO(), exportedBy:ME.email,
                         note:'このファイルは Period.stock の全データです。写真とPDFの実体は含まれません。' } };
    try{
      const withNotes = m.querySelector('#bk-notes').checked;
      const steps = BACKUP_COLLS.length + (withNotes?1:0);
      let i=0;
      for(const [name,label] of BACKUP_COLLS){
        const s = await getDocs(collection(db, name));
        out[name] = s.docs.map(d=>({id:d.id, ...d.data()}));
        log(`${label} … ${out[name].length}件`);
        bar.style.width = (++i/steps*100).toFixed(0)+'%';
      }
      if(withNotes){
        log('ノート本文を読み込んでいます…（いちばん時間がかかります）');
        const s = await getDocs(collection(db,'notes'));
        out.notes = s.docs.map(d=>({id:d.id, ...d.data()}));
        log(`ノート … ${out.notes.length}件`);
        bar.style.width='100%';
      }
      const json = JSON.stringify(out);
      log('圧縮しています…');
      let blob, fname;
      try{
        const gz = await gzipStr(json);
        blob = new Blob([gz], {type:'application/gzip'});
        fname = `Period_stock_バックアップ_${today()}.json.gz`;
      }catch(e){
        // 圧縮できない環境でも、書き出しだけは必ず成功させる
        log('圧縮できなかったので、そのままの形で書き出します');
        blob = new Blob([json], {type:'application/json'});
        fname = `Period_stock_バックアップ_${today()}.json`;
      }
      const a=el('a');
      a.href=URL.createObjectURL(blob);
      a.download=fname;
      a.click();
      log(`できました（${mb(blob.size)}・${fname}）。ダウンロードフォルダを見てください。`);
      go.textContent='完了';
    }catch(e){
      log('エラー: '+e.message);
      go.disabled=false; go.textContent='もう一度';
    }
  };
}

/* ============================================================

    const hay=`${v.name||''} ${v.kana||''} ${v.contact||''} ${v.memo||''} ${v.bankName||''}`.toLowerCase();
    return keys.every(k=>hay.includes(k));
  }).map(v=>({kind:'vendor', id:v.id, title:v.name||'(名称未設定)', sub:payTermsLabel(v), at:''}));

function openGlobal(kind, id){

function drawGpop(q){

  }else{
    p.appendChild(el('div','gh',`${rows.length}件（Enter で一覧に出します）`));
    rows.slice(0,25).forEach(r=>{
      const it=el('div','grow');
      it.innerHTML=`<span class="pill t">${esc(GKIND[r.kind]||'')}</span>
        <b>${esc(r.title)}</b><span class="s">${esc(r.sub||'')}</span><span class="d">${esc(r.at||'')}</span>`;
      it.onclick=()=>{ closeGpop(); if(r.kind!=='vendor') pushRecent(r.kind, r.id, r.title, r.sub); openGlobal(r.kind, r.id); };
      p.appendChild(it);
    });
    if(rows.length>25){
      const more=el('div','gmore',`ノートの中身まで探す（ナレッジで検索）`);
      more.onclick=()=>{ closeGpop(); go('knowledge'); S.noteQ=q; doSearch(q); kStep(1); };
      p.appendChild(more);
    }
  }
  p.onclick=e=>e.stopPropagation();
  $('#gsearch').appendChild(p);
  gpop=p;
}
const GKIND = {note:'ノート', doc:'書類', minute:'議事録', vendor:'取引先'};
function initGlobalSearch(){
  const i=$('#gq'); if(!i) return;
  let t=null;
  i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{
    const q=i.value.trim();
    if(q.length<1) return closeGpop();
    drawGpop(q);
  }, 220); };
  i.onkeydown=e=>{
    if(e.key==='Escape'){ i.value=''; closeGpop(); i.blur(); }
    if(e.key==='Enter'){ const q=i.value.trim(); if(!q) return; closeGpop();
      go('knowledge'); S.noteQ=q; doSearch(q); kStep(1); }
  };
  i.onclick=e=>e.stopPropagation();
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
       && !document.activeElement.isContentEditable){ e.preventDefault(); i.focus(); }
  });
  document.addEventListener('click', ()=>closeGpop());
}

function allTodos(){

}
function renderMinutes(){
  const V=$('#view-minutes'); V.innerHTML='';

  const hd=el('div'); hd.style.cssText='display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap';

  nb.onclick=()=>newMinute(); hd.appendChild(nb);
  w.appendChild(hd);

  const todos = allTodos().filter(t=>!t.done);
  const over = todos.filter(t=>t.due && t.due<today());

  const f=el('div','filters');
  const sel=(key,label,opts)=>{
    const s=el('select'); s.appendChild(el('option',null,label)); s.lastChild.value='';
    opts.forEach(([v,l])=>{ const o=el('option',null,esc(l)); o.value=v; s.appendChild(o); });
    s.value=S.mfil[key]||''; s.onchange=()=>{ S.mfil[key]=s.value; renderMinutes(); }; return s;
  };
  f.appendChild(sel('store','店舗（すべて）', [...new Set(S.minutes.map(m=>m.store).filter(Boolean))].sort().map(t=>[t,t])));
  f.appendChild(sel('year','年（すべて）', [...new Set(S.minutes.map(m=>(m.date||'').slice(0,4)).filter(Boolean))].sort().reverse().map(y=>[y,y+'年'])));
  const kw=el('input','kw'); kw.placeholder='キーワード'; kw.value=S.mfil.kw;
  let kt=null;
  kw.oninput=()=>{ clearTimeout(kt); kt=setTimeout(()=>{ S.mfil.kw=kw.value; renderMinutes();
    const nk=$('#view-minutes input.kw'); if(nk){ nk.focus(); nk.setSelectionRange(nk.value.length,nk.value.length); } },250); };
  f.appendChild(kw);
  w.appendChild(f);

  const kws=(S.mfil.kw||'').toLowerCase().split(/\s+/).filter(Boolean);
  let rows = S.minutes.filter(m=>{
    if(S.mfil.store && m.store!==S.mfil.store) return false;
    if(S.mfil.year && (m.date||'').slice(0,4)!==S.mfil.year) return false;
    if(kws.length){
      const hay=`${m.title||''} ${m.store||''} ${(m.attendees||[]).join(' ')} ${stripHtml(m.body||'')} ${(m.decisions||[]).join(' ')} ${(m.todos||[]).map(t=>t.text).join(' ')}`.toLowerCase();
      if(!kws.every(k=>hay.includes(k))) return false;
    }
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const st=el('div','stat');
  st.innerHTML = `${rows.length}件`
    + (todos.length ? `　/　未完了ToDo ${todos.length}件` : '')
    + (over.length ? `　/　<span style="color:var(--danger)">期限切れ ${over.length}件</span>` : '');
  w.appendChild(st);

  if(!S.minutes.length){
    w.appendChild(el('div','empty','議事録がまだありません。「＋ 議事録を作成」から始めてください。'));
    return;
  }
  if(!rows.length){ w.appendChild(el('div','empty','条件に一致する議事録がありません')); return; }

  const grid=el('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px';
  rows.forEach(m=>{
    const openT=(m.todos||[]).filter(t=>!t.done).length;
    const c=el('div','card'); c.style.cursor='pointer';

        <span class="pill t">${esc(m.store||'')}</span>

      <div style="font-size:11.5px;color:var(--sub);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        ${esc((m.attendees||[]).join('、')||'参加者未設定')}</div>

function stripHtml(h){ const d=document.createElement('div'); d.innerHTML=h||''; return d.innerText||''; }

async function toggleTodo(minuteId, idx, done){
  const m=S.minutes.find(x=>x.id===minuteId); if(!m) return;
  if(!m.todos || !m.todos[idx]) return;
  m.todos[idx].done = done;
  m.updatedAt = nowISO();
  await setDoc(doc(db,'minutes',m.id), {todos:m.todos, updatedAt:m.updatedAt}, {merge:true});
  await idbSet('minutes_cache', null);
  buildNotifications();
}
