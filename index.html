<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Period.stock</title>
<style>
:root{
  --navy:#141b2d; --navy2:#1e2740; --navy3:#28324e; --line:#e3e6ec; --line2:#2a3450;
  --text:#1a1f2b; --sub:#6b7280; --accent:#8a6d3b; --accent2:#b08d4f;
  --bg:#f7f8fa; --white:#fff; --danger:#b3261e; --ok:#2e6b4f; --warn:#9a6a1a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium",sans-serif;
  color:var(--text);background:var(--bg);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- 全体レイアウト ---------- */
#app{display:none;flex-direction:column;height:100vh}
#app.ready{display:flex}
.topbar{height:56px;flex:none;background:var(--navy);display:flex;align-items:center;gap:18px;padding:0 20px;color:#fff;position:relative;z-index:30}
.brand{font-size:15px;letter-spacing:.14em;font-weight:600;white-space:nowrap}
.brand span{color:var(--accent2);font-weight:400;letter-spacing:.06em}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{padding:7px 15px;font-size:12.5px;color:#9aa4b8;border-radius:4px;white-space:nowrap}
.nav button:hover{color:#fff;background:var(--navy2)}
.nav button.on{color:#fff;background:var(--navy3);box-shadow:inset 0 -2px 0 var(--accent2)}
.search-wrap{flex:1;max-width:460px;position:relative}
.search-wrap.hide{visibility:hidden}
.search-wrap input{width:100%;height:34px;border-radius:4px;border:1px solid var(--line2);
  background:var(--navy2);color:#fff;padding:0 12px 0 34px;outline:none}
.search-wrap input::placeholder{color:#8892a6}
.search-wrap input:focus{border-color:var(--accent2)}
.search-ico{position:absolute;left:11px;top:9px;width:15px;height:15px;opacity:.55}
.topbar .who{font-size:12px;color:#a9b2c4;margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.topbar .who button{color:#a9b2c4;font-size:12px;text-decoration:underline}
.bell{position:relative;width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.bell:hover{background:var(--navy2)}
.bell .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);
  color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}
.notif-panel{position:absolute;top:52px;right:16px;width:400px;max-height:70vh;overflow-y:auto;background:#fff;
  border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(20,27,45,.22);z-index:40;color:var(--text)}
.notif-panel h4{font-size:12px;letter-spacing:.06em;color:var(--sub);padding:13px 16px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center}
.notif-panel h4 button{margin-left:auto;font-size:11px;color:var(--accent);text-decoration:underline}
.nrow{padding:11px 16px;border-bottom:1px solid #f2f4f7;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.nrow:hover{background:#fafbfc}
.nrow.unread{background:#fdfbf6}
.nrow .ic{width:22px;height:22px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:#eceff4;color:var(--sub);margin-top:2px}
.nrow .ic.due{background:#f7ece9;color:var(--danger)}
.nrow .ic.men{background:#f0e9dc;color:var(--accent)}
.nrow .ic.todo{background:#e8f0ec;color:var(--ok)}
.nrow .tx{flex:1;min-width:0}
.nrow .tx b{font-size:12.5px;font-weight:600;display:block}
.nrow .tx span{font-size:11.5px;color:var(--sub);display:block;line-height:1.5}
.nrow .tm{font-size:10.5px;color:#9aa3b2;white-space:nowrap}

#views{flex:1;min-height:0;position:relative}
.view{display:none;height:100%}
.view.on{display:block}
#view-knowledge.on{display:grid;grid-template-columns:264px 340px 1fr}
.pane{overflow-y:auto;background:var(--white);height:100%}
#sidebar{background:var(--navy);color:#c8cfdd;border-right:1px solid var(--line2);padding-bottom:40px}
#list{border-right:1px solid var(--line)}
.page{height:100%;overflow-y:auto;padding:26px 32px 80px}
.page-w{max-width:1240px;margin:0 auto}
.page h1{font-size:19px;font-weight:600;letter-spacing:.02em}
.page .lead{font-size:12.5px;color:var(--sub);margin-top:4px}

/* ---------- ナレッジ ---------- */
.mode-tabs{display:flex;border-bottom:1px solid var(--line2)}
.mode-tabs button{flex:1;padding:11px 0;font-size:12px;color:#8892a6;border-bottom:2px solid transparent}
.mode-tabs button.on{color:#fff;border-bottom-color:var(--accent2)}
.sec{margin-top:6px}
.sec-h{display:flex;align-items:center;gap:7px;padding:9px 16px;font-size:12px;letter-spacing:.06em;
  color:#9aa4b8;cursor:pointer;user-select:none}
.sec-h:hover{color:#fff}
.sec-h .cnt{margin-left:auto;font-size:11px;color:#6f7a92}
.fold{padding:7px 16px 7px 34px;font-size:13px;color:#c8cfdd;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.fold:hover{background:var(--navy2)}
.fold.on{background:var(--navy2);color:#fff;box-shadow:inset 2px 0 0 var(--accent2)}
.fold .n{margin-left:auto;font-size:11px;color:#6f7a92}
.arrow{width:8px;transition:transform .15s;display:inline-block;font-size:8px}
.arrow.open{transform:rotate(90deg)}
.list-head{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:2}
.list-head h2{font-size:15px;font-weight:600}
.list-head .meta{font-size:11px;color:var(--sub);margin-top:3px}
.newbtn{margin-top:10px;background:var(--navy);color:#fff;padding:7px 14px;border-radius:4px;font-size:12px}
.newbtn:hover{background:var(--navy2)}
.item{padding:13px 18px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.item:hover{background:#fafbfc}
.item.on{background:#f4f1ea;box-shadow:inset 3px 0 0 var(--accent)}
.item h3{font-size:13.5px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item p{font-size:12px;color:var(--sub);line-height:1.55;max-height:3.1em;overflow:hidden}
.item .foot{margin-top:6px;font-size:11px;color:#9aa3b2;display:flex;gap:10px;align-items:center}
.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--sub)}
.badge{font-size:10px;background:#eceff4;color:#6b7280;border-radius:3px;padding:1px 6px;white-space:nowrap}
.badge.arc{background:#f0e9dc;color:#8a6d3b}
.detail-head{padding:22px 32px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:2}
.detail-head h1{font-size:20px;font-weight:600;line-height:1.45;outline:none}
.detail-head h1[contenteditable]:focus{background:#fbfaf7}
.detail-meta{font-size:11.5px;color:var(--sub);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:11.5px;color:var(--sub)}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools button.primary:hover{background:var(--navy2)}
.body{padding:24px 32px 40px;max-width:900px;outline:none;font-size:14px;word-wrap:break-word}
.body[contenteditable="true"]{background:#fdfcfa;min-height:40vh}
.body img{max-width:100%;height:auto}
.body a{word-break:break-all}
.body table{border-collapse:collapse;max-width:100%}
.body td,.body th{border:1px solid var(--line);padding:5px 8px}
.attach{margin:0 32px 30px;max-width:900px;border-top:1px solid var(--line);padding-top:16px}
.attach h4{font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:.06em}
.att-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f2f4f7;font-size:12.5px}
.att-row .sz{color:#9aa3b2;font-size:11px;margin-left:auto}
.att-row button{font-size:11px;color:var(--accent);text-decoration:underline;white-space:nowrap}
.empty{padding:70px 40px;text-align:center;color:#9aa3b2;font-size:13px}

/* ---------- 共通パーツ ---------- */
/* ---------- ホーム ---------- */
.page-w.home{max-width:760px;padding-top:26px}
.hsearch{position:relative;display:flex;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:0 16px;height:52px;box-shadow:0 1px 3px rgba(20,27,45,.04);transition:border-color .15s}
.hsearch:focus-within{border-color:var(--accent);box-shadow:0 2px 10px rgba(138,109,59,.1)}
.hsearch svg{width:18px;height:18px;flex:none}
.hsearch input{flex:1;border:none;outline:none;background:none;font-size:15px;padding:0 12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 17px;text-align:left}
.quick button:hover{border-color:var(--accent);background:#fdfcfa}
.quick button b{display:block;font-size:13.5px;font-weight:600}
.quick button span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
.listbox{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f2f4f7;cursor:pointer}
.srow:last-child{border-bottom:none}
.srow:hover{background:#fafbfc}
.srow b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;max-width:52%}
.srow .s{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.srow .d{font-size:11px;color:#b6bdc9;white-space:nowrap;margin-left:auto}
.srow.todo-row b{max-width:none;flex:none}
.srow.todo-row.alert b{color:var(--danger)}
.srow.todo-row.warn b{color:var(--warn)}
.stat{font-size:12px;color:var(--sub);margin:16px 0 4px;font-variant-numeric:tabular-nums}

.meta-row{display:flex;align-items:center;gap:8px;margin-top:3px}
.meta-row .meta{margin-top:0}
.sortsel{margin-left:auto;border:1px solid var(--line);border-radius:5px;background:#fff;
  padding:3px 6px;font-size:11.5px;color:var(--sub);outline:none;max-width:60%}
.sortsel:hover{border-color:var(--accent);color:var(--accent)}
.sortsel:focus{border-color:var(--accent)}
.lsearch{position:relative;display:flex;align-items:center;background:#fafbfc;border:1px solid var(--line);
  border-radius:6px;padding:0 10px;height:34px;margin-bottom:11px}
.lsearch:focus-within{border-color:var(--accent);background:#fff}
.lsearch svg{width:14px;height:14px;flex:none}
.lsearch input{flex:1;border:none;outline:none;background:none;font-size:12.5px;padding:0 8px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:12px;margin:18px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px 17px}
.card .lb{font-size:11px;color:var(--sub);letter-spacing:.04em}
.card .vl{font-size:23px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.card .vl.sm{font-size:17px}
.card .sfx{font-size:11.5px;color:#9aa3b2;margin-top:3px}
.card.alert{border-color:#e6c9c4;background:#fdf8f7}
.card.alert .vl{color:var(--danger)}
.card.warn{border-color:#e8dcc0;background:#fdfbf6}
.card.warn .vl{color:var(--warn)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);border-radius:4px;padding:6px 9px;background:#fff;outline:none;font-size:12.5px}
.filters select:focus,.filters input:focus{border-color:var(--accent)}
.filters input.kw{min-width:200px}
.btn{border:1px solid var(--line);border-radius:4px;padding:6px 13px;font-size:12.5px;background:#fff;color:var(--sub)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2);color:#fff}
.btn.sm{padding:4px 10px;font-size:11.5px}

table.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
table.tbl th{font-size:11px;color:var(--sub);letter-spacing:.04em;text-align:left;padding:10px 12px;
  background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
table.tbl th:hover{color:var(--accent)}
table.tbl th .s{color:var(--accent);font-size:9px}
table.tbl td{padding:9px 12px;border-bottom:1px solid #f2f4f7;font-size:12.5px;vertical-align:middle}
table.tbl tr:hover td{background:#fafbfc}
table.tbl tr{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.el{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;border-radius:10px;padding:1px 9px;white-space:nowrap;border:1px solid transparent}
.pill.pending{background:#fdf4e8;color:#8a5a12;border-color:#ebd9bb;font-weight:600}
.pill.unpaid{background:#fdf3f2;color:var(--danger);border-color:#eed6d2}
.pill.paid{background:#eef4f0;color:var(--ok);border-color:#d3e3da}
.pill.checked{background:#eef1f6;color:#41506e;border-color:#d8dfea}
.pill.hold{background:#fdf8ec;color:var(--warn);border-color:#eadfc4}
.pill.over{background:var(--danger);color:#fff}
.pill.soon{background:#fdf8ec;color:var(--warn);border-color:#eadfc4}
.pill.t{background:#f5f6f8;color:#5b6577;border-color:#e6e9ef}

/* ---------- ドロワー ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(20,27,45,.4);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:61;
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(20,27,45,.18)}
.drawer .dh{padding:20px 26px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer .dh h2{font-size:16.5px;font-weight:600;line-height:1.45;padding-right:30px}
.drawer .dh .x{position:absolute;top:16px;right:20px;font-size:20px;color:#9aa3b2;line-height:1}
.drawer .dh .x:hover{color:var(--text)}
.drawer .db{flex:1;overflow-y:auto;padding:20px 26px 60px}
.fgrid{display:grid;grid-template-columns:104px 1fr;gap:9px 14px;align-items:center;font-size:12.5px}
.fgrid label{color:var(--sub);font-size:11.5px}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 9px;outline:none;background:#fff}
.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{border-color:var(--accent)}
.fgrid textarea{min-height:64px;resize:vertical;line-height:1.6}
.sect-t{font-size:11.5px;color:var(--sub);letter-spacing:.06em;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* ---------- コメント ---------- */
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f2f4f7}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:none;font-weight:600}
.cmt .cb{flex:1;min-width:0}
.cmt .cb .hd{font-size:12px;font-weight:600;display:flex;gap:9px;align-items:baseline}
.cmt .cb .hd time{font-weight:400;font-size:10.5px;color:#9aa3b2}
.cmt .cb .hd button{margin-left:auto;font-size:10.5px;color:#c0c6d0}
.cmt .cb .hd button:hover{color:var(--danger)}
.cmt .cb p{font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.men{color:var(--accent);background:#f6f2e9;border-radius:3px;padding:0 3px;font-weight:600}
.cmt-form{margin-top:14px;position:relative}
.cmt-form textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-height:70px;
  outline:none;resize:vertical;font-size:12.5px;line-height:1.6}
.cmt-form textarea:focus{border-color:var(--accent)}
.cmt-form .rw{display:flex;align-items:center;gap:10px;margin-top:8px}
.cmt-form .rw .hint{font-size:11px;color:#9aa3b2}
.mention-pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:5px;
  box-shadow:0 8px 22px rgba(20,27,45,.16);z-index:70;max-height:200px;overflow-y:auto;min-width:190px}
.mention-pop div{padding:7px 12px;font-size:12.5px;cursor:pointer}
.mention-pop div:hover,.mention-pop div.sel{background:#f4f1ea}

/* ---------- ToDo ---------- */
.todo{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f2f4f7}
.todo input[type=checkbox]{margin-top:4px;width:15px;height:15px;flex:none;accent-color:var(--accent)}
.todo .tt{flex:1;min-width:0;font-size:12.5px}
.todo .tt.done{text-decoration:line-through;color:#9aa3b2}
.todo .as{font-size:11px;color:var(--sub);white-space:nowrap}
.todo .rm{font-size:11px;color:#c0c6d0}
.todo .rm:hover{color:var(--danger)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;background:#f2f4f7;border-radius:12px;padding:2px 10px;display:flex;align-items:center;gap:5px}
.chip button{font-size:11px;color:#9aa3b2}
.chip button:hover{color:var(--danger)}

/* ---------- ゲート / モーダル ---------- */
.gate{max-width:520px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px 40px}
.gate h1{font-size:17px;margin-bottom:6px;letter-spacing:.1em}
.gate h1 span{color:var(--accent)}
.gate p{font-size:13px;color:var(--sub);margin-bottom:22px}
.gate label{display:block;font-size:11.5px;color:var(--sub);margin:14px 0 4px}
.gate input,.gate textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:9px 11px;outline:none}
.gate input:focus,.gate textarea:focus{border-color:var(--accent)}
.gate textarea{height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.gate button.go{margin-top:22px;width:100%;background:var(--navy);color:#fff;padding:11px;border-radius:4px}
.gate button.go:hover{background:var(--navy2)}
.gate .err{color:var(--danger);font-size:12px;margin-top:12px}
.gate .note{font-size:11.5px;color:#9aa3b2;margin-top:16px;line-height:1.65}

.modal{position:fixed;inset:0;background:rgba(20,27,45,.55);display:flex;align-items:center;justify-content:center;z-index:80}
.modal .box{background:#fff;border-radius:6px;padding:32px 36px;width:540px;max-height:82vh;overflow:auto}
.modal h3{font-size:15px;margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sub);max-height:180px;overflow:auto;
  background:#fafbfc;border:1px solid var(--line);border-radius:4px;padding:10px;white-space:pre-wrap}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal .row button{padding:8px 16px;border-radius:4px;font-size:13px;border:1px solid var(--line)}
.modal .row button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 20px;border-radius:5px;font-size:12.5px;z-index:99;box-shadow:0 8px 24px rgba(20,27,45,.28)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 添付・アップロード ---------- */
.drop{border:2px dashed var(--line);border-radius:8px;background:#fbfcfd;cursor:pointer;
  padding:26px 18px;text-align:center;transition:border-color .15s,background .15s}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where,

/* ============================================================
   小道具
   ============================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => { if(!d) return ''; const t=new Date(d);
  return isNaN(t) ? '' : `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`; };
const fmtT = d => { if(!d) return ''; const t=new Date(d); if(isNaN(t)) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; };
const mb  = n => n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const yen = n => (n==null||n==='') ? '—' : '¥'+Number(n).toLocaleString('ja-JP');
const today = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const initials = s => (s||'?').trim().slice(0,1);
function toast(msg){ const t=el('div','toast',esc(msg)); document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200); }

let fb=null, db=null, auth=null, ME=null;

const STORES  = ["本部","Li'l Fit","ULuLu","NIRAM","it's Time coffee","Fitness","Beauty","CAFE","経理","その他"];
const DTYPES  = ["請求書","納品書","領収書","見積書","発注書","契約書","その他"];
// 流れ： 確認待ち（店舗が登録）→ 未払い（経理が確認）→ 支払済
const DSTATUS = { pending:'確認待ち', unpaid:'未払い', paid:'支払済', hold:'保留', checked:'確認済' };
const isAccounting = () => ['accounting','admin'].includes((S.myRole||'').toLowerCase());

const S = {
  view:'home',
  // ナレッジ
  folders:[], notes:[], corpus:null, mode:'work', folderId:null, noteId:null, open:{}, results:null, editing:false,
  // 共通
  members:[], myRole:'member', notifs:[], notifOpen:false, attIds:new Set(), homeQ:'', noteQ:'',
  created:null, tags:null, noteSort: localStorage.getItem('period_stock_notesort') || 'updated_desc',
  // 書類
  docs:[], docSort:{k:'issuedAt',d:-1}, docId:null, docEditing:false,
  dfil:{type:'',store:'',year:'',status:'',vendor:'',kw:''},
  // 議事録
  minutes:[], minuteId:null, minuteEditing:false,
  mfil:{store:'',year:'',kw:''},
};

const CFG_KEY = 'period_stock_cfg';
const OLD_CFG_KEY = 'period_knowledge_cfg';
boot();

/* ============================================================
   起動・認証
   ============================================================ */
async function boot(){
  let raw = null;
  try{
    const r = await fetch('./firebase-config.json', {cache:'no-cache'});
    if(r.ok){ const j = await r.json(); if(j && j.apiKey) raw = JSON.stringify(j); }
  }catch(e){}
  if(!raw) raw = localStorage.getItem(CFG_KEY) || localStorage.getItem(OLD_CFG_KEY);
  if(!raw){ return renderSetup(); }
  let cfg; try{ cfg=JSON.parse(raw); }catch(e){ return renderSetup('保存された設定を読めませんでした'); }
  try{ fb = initializeApp(cfg); db = getFirestore(fb); auth = getAuth(fb); }
  catch(e){ return renderSetup('Firebaseの初期化に失敗しました: '+e.message); }

  onAuthStateChanged(auth, async u => {
    if(!u) return renderLogin();
    const ok = await allowed(u.email);
    if(!ok){ await signOut(auth);
      return renderLogin(`${u.email} はまだ許可されていません。管理者に members への追加を依頼してください。`); }
    ME = { email:u.email, name:u.displayName || u.email };
    $('#gate').style.display='none';
    $('#app').classList.add('ready');
    $('#whoami').textContent = ME.name;
    renderNav();
    await loadAll();
  });
}

async function allowed(email){
  try{
    const s = await getDoc(doc(db,'members',email));
    if(s.exists()) return true;
    const any = await getDocs(query(collection(db,'members'), limit(1)));
    return any.empty;
  }catch(e){ return false; }
}

function renderSetup(err){
  $('#app').classList.remove('ready');
  const g=$('#gate'); g.style.display='block';
  g.innerHTML = `<div class="gate">
    <h1>初回セットアップ</h1>
    <p>Firebaseコンソールで作成したウェブアプリの設定を貼り付けてください。この端末にのみ保存されます。</p>
    <label>firebaseConfig（波かっこごと貼り付け）</label>
    <textarea id="cfg" placeholder='{ "apiKey": "...", "projectId": "..." }'></textarea>
    <button class="go" id="save">保存して開始</button>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="note">Firebaseコンソール → プロジェクトの設定 → マイアプリ → ウェブアプリ の
    「SDK の設定と構成」に出る内容です。const firebaseConfig = の右側だけを貼ってください。</div>
  </div>`;
  $('#save').onclick = () => {
    let t = $('#cfg').value.trim();
    t = t.replace(/^const\s+firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'');
    let cfg;
    try{ cfg = JSON.parse(t); }
    catch(e){ try{ cfg = (0,eval)('('+t+')'); }catch(e2){ return alert('設定を読み取れませんでした。波かっこごと貼り付けてください。'); } }
    if(!cfg || !cfg.apiKey || !cfg.projectId) return alert('apiKey と projectId が見つかりません。');
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    location.reload();
  };
}

function renderLogin(err){
  $('#app').classList.remove('ready');
  const g=$('#gate'); g.style.display='block';
  g.innerHTML = `<div class="gate">
    <h1>PERIOD.<span>stock</span></h1>
    <p>社内アカウントでログインしてください。</p>
    <button class="go" id="gin">Googleでログイン</button>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="note"><button id="reset" style="text-decoration:underline">Firebaseの設定をやり直す</button></div>

  $('#gin').onclick = async () => {
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ renderLogin('ログインに失敗しました: '+e.message); }
  };
  $('#reset').onclick = () => { localStorage.removeItem(CFG_KEY); localStorage.removeItem(OLD_CFG_KEY); location.reload(); };
}
$('#signout').onclick = () => signOut(auth).then(()=>location.reload());

/* ---------- 管理メニュー ---------- */
$('#admin').onclick = () => {
  const m=el('div','modal');
  const n = S.attIds ? S.attIds.size : 0;
  m.innerHTML=`<div class="box" style="width:520px">
    <h3>管理</h3>
    <p>データの取り込みなど、ふだんは使わない操作です。</p>
    <div class="adm">
      <button data-a="clean"><b>中身を整理する</b>
        <span>重複コピーのアーカイブ、日付だけのタイトルに年を足す、タグ付け。
              何も消しません。実行前に確認でき、あとから取り消せます。</span></button>
      <button data-a="att"><b>過去の添付ファイルを取り込む</b>
        <span>Googleドライブにある請求書PDFなどを、アプリの中で直接開けるようにします。
              いま開けるのは ${n}件です。</span></button>
      <button data-a="photo"><b>Stockの写真を取り込む</b>
        <span>本文に貼ってあった写真408枚。「Stockの写真を取り戻す.js」で集めたフォルダを読ませます。</span></button>
      <button data-a="docs"><b>書類台帳の初期データを取り込む</b>
        <span>documents_seed.json.gz を読み込んで、台帳261件を一括登録します。</span></button>
      <button data-a="created"><b>ノートの作成日を取り込む</b>
        <span>並び替えの「作成日順」を正確にします。${S.created?'取り込み済み':'まだ取り込んでいません'}。</span></button>
      <button data-a="cache"><b>端末のキャッシュを消す</b>
        <span>表示がおかしいときに。次に開いたとき読み直します。</span></button>

    <div class="row"><button id="am-cl">閉じる</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#am-cl').onclick=()=>m.remove();
  m.querySelectorAll('.adm button').forEach(b=>{
    b.onclick=async()=>{
      const a=b.dataset.a; m.remove();

      if(a==='docs') importDocs();
      if(a==='created') importCreated();
      if(a==='cache'){
        try{ indexedDB.deleteDatabase('period_knowledge'); }catch(e){}
        toast('キャッシュを消しました。画面を再読み込みします');
        setTimeout(()=>location.reload(), 900);
      }
    };
  });
};

/* ============================================================
   ナビゲーション
   ============================================================ */
const NAVS = [['home','ホーム'],['knowledge','ナレッジ'],['docs','請求書・納品書'],['minutes','議事録']];
function renderNav(){
  const n=$('#nav'); n.innerHTML='';
  NAVS.forEach(([k,label])=>{
    const b=el('button',S.view===k?'on':'',esc(label));
    b.onclick=()=>go(k);
    n.appendChild(b);
  });
}
function go(v){
  S.view=v; renderNav();
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $('#view-'+v).classList.add('on');
  if(v==='home') renderHome();
  if(v==='docs') renderDocs();
  if(v==='minutes') renderMinutes();
}

/* ============================================================
   データ読み込み
   ============================================================ */
async function loadAll(){
  $('#sidebar').innerHTML = '<div style="padding:20px;color:#8892a6;font-size:12px"><span class="spin"></span> 読み込み中</div>';
  $('#view-home').innerHTML = '<div class="empty"><span class="spin"></span> 読み込み中</div>';
  go('home');
  try{
    const fs = await getDocs(collection(db,'folders'));
    S.folders = fs.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ S.folders = []; }

  if(S.folders.length===0){ go('knowledge'); return offerImport(); }

  try{ await loadIndex(); }catch(e){ S.notes = []; }
  renderSidebar(); renderList(); renderDetail();

  // 追加機能のデータは並行して読む
  loadMembers();
  loadAttIndex().then(()=>{ if(S.noteId) renderDetail(); });
  loadCreated().then(()=>{ if(S.view==='knowledge' && /^created_/.test(S.noteSort)) renderList(); });
  loadTags().then(()=>{ if(S.view==='knowledge') renderList(); });
  Promise.all([syncDocs(), syncMinutes()]).then(()=>{
    buildNotifications();
    if(S.view==='home') renderHome();
  });
}

async function loadMembers(){
  try{
    const s = await getDocs(collection(db,'members'));
    S.members = s.docs.map(d=>({email:d.id, ...d.data()}));
    const me = S.members.find(x=>x.email===ME.email);
    S.myRole = (me && me.role) || 'member';
  }catch(e){ S.members=[{email:ME.email,name:ME.name}]; }
}
// 経理・管理者あてに通知を配る
async function notifyAccounting(kind, title, body, link){
  const to = S.members.filter(m=>['accounting','admin'].includes((m.role||'').toLowerCase())
                                 && m.email !== ME.email);
  for(const m of to) await pushNotif(m.email, kind, title, body, link);
  return to.length;
}

/* --- 汎用 差分同期（updatedAt をキーに端末にキャッシュ） --- */
async function syncColl(name, cacheKey){
  let cache = await idbGet(cacheKey);
  if(!cache || !Array.isArray(cache.rows)) cache = {rows:[], since:'1970-01-01T00:00:00.000Z'};
  let snap;
  try{
    snap = await getDocs(query(collection(db,name),
      where('updatedAt','>',cache.since), orderBy('updatedAt','asc'), limit(3000)));
  }catch(e){ return cache.rows; }
  const map = new Map(cache.rows.map(r=>[r.id,r]));
  let since = cache.since;
  snap.docs.forEach(d=>{
    const v = {id:d.id, ...d.data()};
    map.set(d.id, v);
    if((v.updatedAt||'') > since) since = v.updatedAt;
  });
  const rows = [...map.values()].filter(r=>!r.deleted);
  await idbSet(cacheKey, {rows:[...map.values()], since});
  return rows;
}
async function syncDocs(){    S.docs    = await syncColl('documents','docs_cache'); return S.docs; }
async function syncMinutes(){ S.minutes = await syncColl('minutes','minutes_cache'); return S.minutes; }

/* --- ナレッジ索引（既存） --- */
async function loadIndex(){
  const meta = await getDoc(doc(db,'meta','index'));
  const md  = meta.exists()? meta.data() : {version:0, builtAt:'1970-01-01'};
  const cached = await idbGet('idx_'+md.version);
  if(cached){ S.notes = cached; }
  else{
    const shards = await getDocs(query(collection(db,'indexShards'), orderBy('n')));
    let all=[];
    for(const s of shards.docs){
      const txt = await ungzip(s.data().gz.toUint8Array());
      all = all.concat(JSON.parse(txt));
    }
    S.notes = all;
    await idbSet('idx_'+md.version, all);
  }
  try{
    const delta = await getDocs(query(collection(db,'notes'),
      where('updatedAt','>', md.builtAt || '1970-01-01'), orderBy('updatedAt','desc'), limit(500)));
    const map = new Map(S.notes.map(n=>[String(n.id),n]));
    delta.docs.forEach(d=>{
      const v=d.data();
      map.set(d.id, {id:d.id, folderId:String(v.folderId), folder:v.folder, title:v.title,
        preview:v.preview, updatedAt:v.updatedAt, author:v.author, archived:!!v.archived,
        daily:!!v.daily, att:(v.attachments||[]).length});
    });
    S.notes=[...map.values()];
  }catch(e){}
  loadCorpus();
}
async function loadCorpus(){
  if(S.corpus) return;
  try{
    const meta = await getDoc(doc(db,'meta','corpus'));
    const ver = meta.exists()? meta.data().version : 0;
    if(!ver) return;
    const cached = await idbGet('corpus_'+ver);
    if(cached){ S.corpus = cached; return; }
    const shards = await getDocs(query(collection(db,'corpusShards'), orderBy('n')));
    const all = {};
    for(const s of shards.docs){
      const txt = await ungzip(s.data().gz.toUint8Array());
      Object.assign(all, JSON.parse(txt));
    }
    S.corpus = all;
    await idbSet('corpus_'+ver, all);
  }catch(e){}
}

async function ungzip(u8){
  const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
async function gzipStr(str){
  const cs = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(cs).arrayBuffer());
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('period_knowledge',1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
  r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const d=await idb();
  return await new Promise(r=>{ const q=d.transaction('kv').objectStore('kv').get(k);
    q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const d=await idb();
  const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); }catch(e){} }

const RECENT_KEY='period_stock_recent';
const recents = () => { try{ return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]'); }catch(e){ return []; } };
function pushRecent(kind, id, title, sub){
  if(!title) return;
  const a = recents().filter(x=>!(x.kind===kind && x.id===id));
  a.unshift({kind, id, title, sub:sub||'', at:nowISO()});
  localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0,12)));
}

function openByKind(kind, id){
  if(kind==='note'){ go('knowledge'); S.noteId=id; S.results=null; S.editing=false; renderList(); renderDetail(); }
  if(kind==='doc'){ go('docs'); openDoc(id); }

/* --- 全体をまとめて検索 --- */
function globalSearch(q){
  const keys=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!keys.length) return [];
  const hit=(hay)=>keys.every(k=>hay.toLowerCase().includes(k));
  const out=[];
  S.docs.forEach(d=>{
    if(hit(`${d.vendor||''} ${d.fileName||''} ${d.noteTitle||''} ${d.folder||''} ${d.memo||''} ${d.period||''} ${d.store||''} ${d.amount||''}`))
      out.push({kind:'doc', id:d.id, title:`${d.vendor||'（取引先未設定）'}　${d.period||''}`,
        sub:`${d.type||''}・${d.store||''}・${yen(d.amount)}`, at:d.issuedAt||''});
  });
  S.minutes.forEach(m=>{
    if(hit(`${m.title||''} ${m.store||''} ${(m.attendees||[]).join(' ')} ${(m.decisions||[]).join(' ')} ${(m.todos||[]).map(t=>t.text).join(' ')} ${stripHtml(m.body||'')}`))
      out.push({kind:'minute', id:m.id, title:m.title||'(無題)',
        sub:`${m.date||''}・${m.store||''}`, at:m.date||''});
  });
  const C=S.corpus;
  S.notes.forEach(n=>{
    if(hit(`${n.title||''} ${n.folder||''} ${n.preview||''} ${tagsOf(n).join(' ')} ${(C&&C[String(n.id)])||''}`))
      out.push({kind:'note', id:n.id, title:n.title||'(無題)',
        sub:`${n.folder||''}${n.att?`・添付${n.att}`:''}`, at:(n.updatedAt||'').slice(0,10)});
  });
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,60);
}

const NOTE_SORTS = [
  ['updated_desc', '更新が新しい順'],
  ['updated_asc',  '更新が古い順'],
  ['created_desc', '作成が新しい順'],
  ['created_asc',  '作成が古い順'],
  ['title_asc',    'タイトル順（あ→ん）'],
  ['title_desc',   'タイトル順（ん→あ）'],
  ['author_asc',   '作成者順'],
  ['att_desc',     '添付が多い順'],
];
// 作成日。索引には入っていないので、別に読み込んだ表を使う。
// 無ければノートIDの順（Stockでは古いものほど番号が小さい）で代用する。
function createdKey(n){
  const c = (S.created && S.created[String(n.id)]) || n.createdAt;
  if(c) return c;
  const num = Number(String(n.id).replace(/\D/g,''));
  return isNaN(num) ? '' : String(num).padStart(20,'0');
}
function sortNotes(rows){
  const s = rows.slice();
  const txt = (v)=>String(v||'');
  const cmpJa = (a,b)=>txt(a).localeCompare(txt(b),'ja',{numeric:true});
  const byUpdated = (a,b)=>txt(b.updatedAt).localeCompare(txt(a.updatedAt));
  switch(S.noteSort){
    case 'updated_asc':  s.sort((a,b)=>txt(a.updatedAt).localeCompare(txt(b.updatedAt))); break;
    case 'created_desc': s.sort((a,b)=>txt(createdKey(b)).localeCompare(txt(createdKey(a)))); break;
    case 'created_asc':  s.sort((a,b)=>txt(createdKey(a)).localeCompare(txt(createdKey(b)))); break;
    case 'title_asc':    s.sort((a,b)=>cmpJa(a.title,b.title) || byUpdated(a,b)); break;
    case 'title_desc':   s.sort((a,b)=>cmpJa(b.title,a.title) || byUpdated(a,b)); break;
    case 'author_asc':   s.sort((a,b)=>cmpJa(a.author,b.author) || byUpdated(a,b)); break;
    case 'att_desc':     s.sort((a,b)=>(b.att||0)-(a.att||0) || byUpdated(a,b)); break;
    default:             s.sort(byUpdated);
  }
  return s;
}

  if(S.mode==='arc') return S.notes.filter(n=>n.archived);

/* ------------------------------------------------------------
   Stockは添付を貼ると、本文にファイル名・日時・サイズ・投稿者を
   自動で書き込んでいた。下の「添付ファイル」欄と丸かぶりになるので、
   本文がその再掲だけのときは本文を出さない（データは消さない）。
   ------------------------------------------------------------ */
function stripAttachmentNoise(text, names, people){
  let t = String(text||'');
  (names||[]).forEach(nm=>{
    if(!nm) return;
    t = t.split(nm).join(' ');
    const base = nm.replace(/\.[^.]+$/,'');
    if(base.length>3) t = t.split(base).join(' ');
  });
  (people||[]).forEach(p=>{
    if(!p) return;
    t = t.split(p).join(' ');
    t = t.split(String(p).replace(/[\s　]/g,'')).join(' ');
  });
  return t
    .replace(/[^\s　]+\.(pdf|jpe?g|png|gif|webp|avif|heic|xlsx?|docx?|pptx?|numbers|key|pages|mov|mp4|m4a|zip|gz|csv|txt|webloc)/gi,' ')
    .replace(/[\d.,]+\s*(KB|MB|GB|バイト|bytes?)/gi,' ')
    .replace(/\d{1,4}[\/\-年.]\d{1,2}[\/\-月.]\d{1,2}日?/g,' ')
    .replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ')
    .replace(/[\s　.,、。・:：\-–—_|/\\()（）\[\]【】'"“”]/g,'')
    .trim();
}
// 本文が添付の再掲だけか？
function isAttachmentEcho(text, atts, people){
  if(!atts || !atts.length) return false;
  const t = String(text||'').trim();
  if(!t) return true;
  return stripAttachmentNoise(t, atts.map(a=>a.name), people).length <= 6;
}
// 一覧の抜粋用（添付の名前が分からないので文面から判断する）
function previewText(n){
  const p = String(n.preview||'');
  if(!p) return '';
  if(!n.att) return p;
  const hasFile = /\.(pdf|jpe?g|png|gif|webp|avif|heic|xlsx?|docx?|pptx?|numbers|key|pages|mov|mp4|m4a|zip|csv)\b/i.test(p);
  if(!hasFile) return p;
  if(stripAttachmentNoise(p, [], [n.author, n.editor]).length <= 6) return '';
  return p;
}

const DEAD_IMG_HOST = /stock-app\.jp|llstock\.s3|s3[.-][\w-]*amazonaws\.com/i;
function tidyBodyImages(container){
  container.querySelectorAll('img').forEach(im=>{
    const src = im.getAttribute('src') || '';
    const inWidget = im.closest && im.closest('.stockImageWidget, .attachmentPanel, .photoLi');
    if(/^data:/i.test(src)){
      if(inWidget) im.style.display='none';       // ファイル種別アイコン
      return;
    }
    const name = im.getAttribute('alt') || im.getAttribute('title') || '画像';
    const swap = ()=>{
      if(!im.parentNode) return;
      const ph = el('div','imgmiss');
      ph.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#b9c0cc" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/></svg>
        <b>${esc(name)}</b>
        <span>Stockのサーバーに置いたままの写真です。取り込むと、ここに表示されます。</span>`;
      im.replaceWith(ph);
    };
    // 取り込み済みなら、その場で本物の写真に差し替える
    const pid = (src.match(/\/uploads\/photo\/image\/(\d+)\//)||[])[1];
    if(pid && S.attIds && S.attIds.has(pathId('stockimg/'+pid))){
      loadAttachment('stockimg/'+pid).then(v=>{
        if(v && im.parentNode){ im.src = v.url; im.style.maxWidth='100%'; im.style.height='auto'; }
        else swap();
      }).catch(swap);
      return;
    }
    if(DEAD_IMG_HOST.test(src)) swap();
    else im.addEventListener('error', swap, {once:true});
  });
}

function doSearch(q){
  if(!q){ S.results=null; renderList(); return; }
  const keys = q.toLowerCase().split(/\s+/).filter(Boolean);
  const C = S.corpus;
  const hits = S.notes.filter(n=>{
    const hay = ((n.title||'')+' '+(n.folder||'')+' '+(n.preview||'')+' '
      +tagsOf(n).join(' ')+' '
      +((C && C[String(n.id)]) || n.text || '')).toLowerCase();
    return keys.every(k=>hay.includes(k));
  });
  hits.sort((a,b)=>{
    const at=(a.title||'').toLowerCase(), bt=(b.title||'').toLowerCase();
    const ah=keys.every(k=>at.includes(k))?1:0, bh=keys.every(k=>bt.includes(k))?1:0;
    if(ah!==bh) return bh-ah;
    return (b.updatedAt||'').localeCompare(a.updatedAt||'');
  });
  S.results = hits; renderList();
}

    if(f.year   && (d.issuedAt||'').slice(0,4) !== f.year) return false;

      if(!kw.every(k=>hay.includes(k))) return false;

/* ============================================================
   ファイルの保存（完全無料・Firestoreの中に入れる）

   Firebase Storage は有料プラン（Blaze）が要るので使いません。
   代わりに、写真を小さく圧縮して Firestore のドキュメントに直接しまいます。
   Firestore の1ドキュメントは1MBまで。写真は長辺1400px・JPEGに落として
   だいたい100〜300KBに収まるので、無料枠1GB＝およそ4,000〜8,000枚ぶん入ります。
   ============================================================ */
const MAX_BYTES = 900000;   // 1MB制限に対する安全圏

async function compressImage(file, onProgress){
  const bmp = await createImageBitmap(file);
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  let last = null;
  for(const [w, q] of [[1600,.82],[1400,.75],[1200,.68],[1000,.62],[800,.55],[640,.5]]){
    const sc = Math.min(1, w/Math.max(bmp.width, bmp.height));
    cv.width  = Math.max(1, Math.round(bmp.width*sc));
    cv.height = Math.max(1, Math.round(bmp.height*sc));
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r=>cv.toBlob(r, 'image/jpeg', q));
    if(!blob) break;
    last = blob;
    onProgress && onProgress(`画像を軽くしています… ${mb(blob.size)}`);
    if(blob.size <= MAX_BYTES) return blob;
  }
  if(last) return last;
  throw new Error('画像を処理できませんでした。');
}

// ファイルを Firestore の docFiles/{書類ID} に保存する
async function saveDocFile(docId, file, onProgress){
  let blob = file, type = file.type || 'application/octet-stream', name = file.name;
  if(DECODABLE.test(name) || /^image\/(jpeg|png|webp|gif|avif)$/.test(type)){
    try{
      blob = await compressImage(file, onProgress);
      type = 'image/jpeg';
      name = name.replace(/\.[^.]+$/,'') + '.jpg';
    }catch(e){ blob = file; }
  }
  if(blob.size > MAX_BYTES){
    throw new Error(/pdf/i.test(type)
      ? `このPDFは大きすぎます（${mb(blob.size)}／上限 ${mb(MAX_BYTES)}）。かわりに紙を写真で撮るか、下の「ファイルのリンク」にGoogleドライブの共有リンクを貼ってください。`
      : `ファイルが大きすぎます（${mb(blob.size)}／上限 ${mb(MAX_BYTES)}）。`);
  }
  onProgress && onProgress('保存しています…');
  const u8 = new Uint8Array(await blob.arrayBuffer());
  await setDoc(doc(db,'docFiles',docId),
    { data:Bytes.fromUint8Array(u8), type, name, size:blob.size, updatedAt:nowISO() });
  return { fileName:name, fileType:type, fileSize:blob.size, hasFile:true };
}

// 表示用に読み出す（開いたときだけ取りに行く）
const fileCache = new Map();
async function loadDocFile(docId){
  if(fileCache.has(docId)) return fileCache.get(docId);
  const s = await getDoc(doc(db,'docFiles',docId));
  if(!s.exists()) return null;
  const v = s.data();
  const url = URL.createObjectURL(new Blob([v.data.toUint8Array()], {type:v.type}));
  const out = { url, type:v.type, name:v.name, size:v.size };
  fileCache.set(docId, out);
  return out;
}

/* ============================================================
   中身の整理
   ─────────────────────────────────────────────
   方針：ノートも本文も、ひとつも消さない。
   やるのは「アーカイブに移す」「タイトルに年を足す」「タグを付ける」だけ。
   実行前に何が変わるか全部見せて、実行後は取り消せるようにする。
   ============================================================ */

/* --- タグの判定ルール --- */
const TAG_RULES = [
  ['請求書',   /請求書|ご請求|御請求/],
  ['領収書',   /領収書|領収証|レシート/],
  ['見積書',   /見積書|御見積|お見積/],
  ['納品書',   /納品書|納品明細/],
  ['議事録',   /議事録|MTG|ミーティング|打ち合わせ|打合せ|会議/i],
  ['日報',     /日報|日誌/],
  ['マニュアル', /マニュアル|手順|やり方|使い方|ルール|規定/],
  ['契約',     /契約書|申込書|覚書|規約/],
  ['採用・教育', /採用|面接|新人教育|研修|チャレンジシート|評価/],
  ['経理',     /精算|振込|支払|入金|小口|タイムシート|給与|PL|決算/],
  ['発注・在庫', /発注|注文|在庫|物販|オーダー|仕入/],
  ['告知・販促', /キャンペーン|告知|チラシ|POP|SNS|広告|イベント/i],
];
function guessTags(n, text){
  const hay = `${n.title||''} ${n.folder||''} ${(text||'').slice(0,1200)}`;
  const out=[];
  for(const [tag, re] of TAG_RULES){
    if(re.test(hay)) out.push(tag);
    if(out.length>=3) break;
  }
  return out;
}

/* --- 日付だけのタイトルを見つける --- */
const DATE_TITLE = /^\s*(\d{1,2})\s*[\/\.\-月]\s*(\d{1,2})\s*日?\s*(?:[（(][^）)]{0,4}[）)])?\s*$/;
function dailyTitleFix(n){
  const t = String(n.title||'');
  if(/(19|20)\d{2}/.test(t)) return null;           // すでに年が入っている
  const m = DATE_TITLE.exec(t);
  if(!m) return null;
  const mo = Number(m[1]), da = Number(m[2]);
  if(!(mo>=1 && mo<=12 && da>=1 && da<=31)) return null;
  const key = createdKey(n);
  const y = /^(19|20)\d{2}/.test(key) ? key.slice(0,4) : null;
  if(!y) return null;
  return `${y}/${mo}/${da}`;
}

/* --- 何が直せるか調べる（書き込みはしない） --- */
function analyzeCleanup(){
  const textOf = n => (S.corpus && S.corpus[String(n.id)]) || n.preview || '';

  // 1) 「〜のコピー」フォルダの中で、本体と中身が完全に同じもの
  const byFolder = {};
  S.notes.forEach(n=>{ (byFolder[n.folder]=byFolder[n.folder]||[]).push(n); });
  const dupes=[];
  Object.keys(byFolder).forEach(name=>{
    if(!/のコピー\s*$/.test(name)) return;
    const orig = byFolder[name.replace(/のコピー\s*$/,'')];
    if(!orig) return;
    const sig = n => `${n.title} ${textOf(n)}`;
    const origSet = new Set(orig.map(sig));
    byFolder[name].forEach(n=>{
      if(!n.archived && origSet.has(sig(n))) dupes.push(n);
    });
  });

  // 2) 日付だけのタイトル
  const titles=[];
  S.notes.forEach(n=>{
    const t = dailyTitleFix(n);
    if(t && t!==n.title) titles.push({n, to:t});
  });

  // 3) タグ
  const tags=[]; const tagCount={};
  S.notes.forEach(n=>{
    const now = (S.tags && S.tags[String(n.id)]) || [];
    const t = guessTags(n, textOf(n));
    if(t.length && t.join(',')!==now.join(',')){
      tags.push({n, to:t});
      t.forEach(x=>tagCount[x]=(tagCount[x]||0)+1);
    }
  });

  return {dupes, titles, tags, tagCount};
}

/* --- 一覧インデックスを作り直す（タイトル変更を全員に反映するため） --- */
async function rebuildIndex(log){
  log && log('一覧インデックスを作り直しています…');
  const idx = S.notes.map(n=>({id:String(n.id), folderId:String(n.folderId), folder:n.folder,
    title:n.title, preview:n.preview, updatedAt:n.updatedAt, author:n.author,
    archived:!!n.archived, daily:!!n.daily, att:n.att||0}));
  const shards=[]; let cur=[], size=0;
  for(const r of idx){
    const s=JSON.stringify(r).length;
    if(size+s > 900000){ shards.push(cur); cur=[]; size=0; }
    cur.push(r); size+=s;
  }
  if(cur.length) shards.push(cur);
  let b=writeBatch(db);
  for(let i=0;i<shards.length;i++){
    const gz = await gzipStr(JSON.stringify(shards[i]));
    b.set(doc(db,'indexShards','s'+String(i).padStart(3,'0')), {n:i, gz:Bytes.fromUint8Array(gz)});
    if((i+1)%5===0){ await b.commit(); b=writeBatch(db); }
  }
  await b.commit();
  const ver=Date.now();
  await setDoc(doc(db,'meta','index'),{version:ver, count:idx.length, builtAt:nowISO()});
  await idbSet('idx_'+ver, S.notes);
  log && log(`インデックスを更新しました（${shards.length}分割）`);
}

/* ============================================================
   Stockから引き継いだ添付ファイル（Googleドライブの680件）

   ファイルの保存場所（パス）から決まるIDを付けて Firestore にしまう。
   1MBを超えるものは900KBずつに割って、開くときに繋ぎ直す。
   ============================================================ */
const CHUNK = 900000;
// 取り込む対象。表示できないものも「ダウンロードして開く」ために入れておく。
const VIEWABLE = /\.[A-Za-z0-9]{1,8}$/;
const SKIP_EXT = /\.(ds_store|localized)$/i;
const MAX_FILE = 80 * 1024 * 1024;        // 1件80MBまで
const MIME = { pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
               webp:'image/webp', avif:'image/avif', gif:'image/gif', heic:'image/heic',
               m4a:'audio/mp4', mp3:'audio/mpeg', wav:'audio/wav',
               mov:'video/quicktime', mp4:'video/mp4',
               xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
               docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
               pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
               csv:'text/csv', txt:'text/plain', zip:'application/zip',
               numbers:'application/zip', pages:'application/zip', key:'application/zip',
               webloc:'application/xml' };
// ブラウザでそのまま開けるもの
const CAN_PREVIEW = /\.(pdf|jpe?g|png|webp|avif|gif|m4a|mp3|wav|mov|mp4|txt|csv)$/i;
// ブラウザが中身を読める画像（HEICは読めないので縮小しない）
const DECODABLE = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;

// パスから決まるID（NFC正規化してから64bitハッシュ）
function pathId(p){
  const s = String(p||'').normalize('NFC');
  let a=0x811c9dc5, b=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    a = Math.imul(a ^ c, 16777619) >>> 0;
    b = Math.imul(b + c + 0x9e3779b9, 2246822519) >>> 0;
  }
  return 'a' + a.toString(36) + b.toString(36);
}

const attCache = new Map();
async function loadAttachment(path, onProgress){
  const id = pathId(path);
  if(attCache.has(id)) return attCache.get(id);
  const m = await getDoc(doc(db,'attFiles',id));
  if(!m.exists()) return null;
  const v = m.data();
  const parts = [];
  for(let n=0; n<v.chunks; n++){
    onProgress && onProgress(v.chunks>1 ? `読み込み中… ${n+1}/${v.chunks}` : '読み込み中…');
    const c = await getDoc(doc(db,'attChunks', `${id}_${String(n).padStart(3,'0')}`));
    if(!c.exists()) throw new Error('ファイルの一部が見つかりません');
    parts.push(c.data().b.toUint8Array());
  }
  const out = { url: URL.createObjectURL(new Blob(parts, {type:v.type})),
                type:v.type, name:v.name, size:v.size };
  attCache.set(id, out);
  return out;
}

// ファイルの読み込みが固まったときのための時間制限
async function withTimeout(promise, ms, msg){
  let timer;
  try{
    return await Promise.race([promise,
      new Promise((_,rej)=>{ timer=setTimeout(
        ()=>rej(new Error(msg||`${ms/1000}秒以内に読めませんでした`)), ms); })]);
  } finally { clearTimeout(timer); }
}

    await loadAttIndex();
    const done = new Set(S.attIds);
    // 「添付ファイル/…」から始まる相対パスに揃える
    let skipped = 0;
    const targets = files.filter(f=>{
      if(!VIEWABLE.test(f.name) || SKIP_EXT.test(f.name) || f.name.startsWith('.')) return false;
      if(f.size > MAX_FILE){ skipped++; return false; }
      return true;
    }).map(f=>{
      if(mode==='photo'){
        // Stockの写真。ファイル名が「写真ID.jpg」になっている
        const pid = (f.name.match(/^(\d+)\./)||[])[1];
        if(!pid) return null;
        const rel = 'stockimg/'+pid;
        return {f, rel, id:pathId(rel)};
      }
      let rel = (f.webkitRelativePath || f.name).normalize('NFC');
      const i = rel.indexOf('添付ファイル/');
      rel = i>=0 ? rel.slice(i) : ('添付ファイル/'+rel);
      return {f, rel, id:pathId(rel)};
    }).filter(Boolean);
    const todo = targets.filter(t=>!done.has(t.id));
    const totalMB = todo.reduce((s,t)=>s+t.f.size,0)/1048576;
    log(`対象のファイル ${targets.length}件` + (skipped?`（80MBを超える ${skipped}件は対象外）`:''));
    log(`取り込み済み ${targets.length-todo.length}件 / これから ${todo.length}件（${totalMB.toFixed(0)}MB）`);
    if(!todo.length){ log('すべて取り込み済みです。'); prog(1); return; }
    log(`小さいものから順に入れます。10件ごとに保存するので、`);
    log(`途中で「中断する」を押しても、次回は続きから再開します。\n`);
    // 小さいものを先に。早い段階で「進んでいる」ことが分かるようにする
    todo.sort((a,b)=>a.f.size-b.f.size);

    let b = writeBatch(db), ops=0, bytes=0, okCount=0, ngCount=0, ngRun=0;
    // 送信に失敗しても、書き込み枠は必ず新しいものに入れ替える
    // （使い終わった枠を使い回すと、以降すべてエラーになるため）
    const flush = async ()=>{
      if(!ops) return;
      const cur = b;
      b = writeBatch(db); ops = 0; bytes = 0;
      await cur.commit();
    };
    const saveIndex = async ()=>{
      const ids=[...done];
      await setDoc(doc(db,'meta','attIndex'), { version:Date.now(), count:ids.length, ids });
      S.attIds = new Set(ids);
    };

    const T0 = Date.now();
    const totalBytes = todo.reduce((s,t)=>s+t.f.size,0) || 1;
    let doneBytes = 0;

    for(let i=0;i<todo.length;i++){
      if(ATT_STOP){
        log(`\n【中断しました】${okCount}件まで保存済みです。もう一度実行すれば続きから再開します。`);
        await flush().catch(()=>{}); await saveIndex(); return;
      }
      const {f, rel, id} = todo[i];
      const el0 = (Date.now()-T0)/1000;
      const rate = doneBytes / Math.max(el0, .001);
      status(`<b>${i+1} / ${todo.length}件</b>　${(doneBytes/1048576).toFixed(0)} / ${(totalBytes/1048576).toFixed(0)}MB`
        + `　経過 ${hhmm(el0)}`
        + (doneBytes>3000000 ? `　残り およそ ${hhmm((totalBytes-doneBytes)/rate)}` : '')
        + `<span class="fn2">${esc(f.name)}</span>`);
      await breathe();
      const tf = Date.now();
      try{
        const ext = (f.name.split('.').pop()||'').toLowerCase();
        let blob = f, type = MIME[ext] || f.type || 'application/octet-stream';
        // 画像は縮めてから入れる。ただしブラウザが読めない形式（HEICなど）はそのまま。
        if(DECODABLE.test(f.name) && f.size > CHUNK){
          try{
            blob = await compressImage(f); type = 'image/jpeg';
          }catch(e){ blob = f; }          // 縮められなければ元のまま入れる
        }
        // Googleドライブの「オンラインのみ」ファイルは読むのに時間がかかることがある
        const u8 = new Uint8Array(await withTimeout(blob.arrayBuffer(), 90000,
          'ファイルを読めませんでした（Googleドライブの同期待ちかもしれません）'));
        const chunks = Math.max(1, Math.ceil(u8.length / CHUNK));
        for(let n=0;n<chunks;n++){
          const part = u8.subarray(n*CHUNK, Math.min(u8.length, (n+1)*CHUNK));
          b.set(doc(db,'attChunks', `${id}_${String(n).padStart(3,'0')}`),
                { b: Bytes.fromUint8Array(part) });
          ops++; bytes += part.length;
          if(ops>=100 || bytes > 4000000) await flush();
        }
        b.set(doc(db,'attFiles',id), { name:f.name, type, size:u8.length, chunks, path:rel });
        ops++;
        if(ops>=100 || bytes > 4000000) await flush();
        done.add(id); okCount++; ngRun=0; doneBytes += f.size;
        const sec = (Date.now()-tf)/1000;
        if(sec > 5) log(`△ ${f.name.slice(0,30)}（${mb(f.size)}）に ${hhmm(sec)} かかりました`);
      }catch(err){
        ngCount++; ngRun++; doneBytes += f.size;
        const msg = String(err && err.message || err);
        log(`× ${f.name}：${msg}`);
        if(/permission|insufficient|PERMISSION_DENIED/i.test(msg)){
          log('\n【中断】書き込みを拒否されました。Firestoreのルールを貼り直してから、もう一度お試しください。');
          await saveIndex(); return;
        }
        // 書き込みそのものが続けて失敗したときだけ止める
        if(ngRun >= 25){
          log(`\n【中断】${ngRun}件 続けて失敗したので止めました。`);
          log('ここまでのぶんは保存しました。もう一度実行すれば続きから再開します。');
          await saveIndex(); return;
        }
      }
      prog(doneBytes/totalBytes*0.97);
      if((i+1)%10===0){
        // 途中で閉じても続きから再開できるように、こまめに記録する
        try{ await flush(); await saveIndex(); }catch(e){}
        log(`… ${i+1} / ${todo.length}件（${(doneBytes/1048576).toFixed(0)}MB）`);
      }
    }
    await flush();

    log('一覧を更新しています…');
    await saveIndex();
    prog(1);
    status(`<b>完了しました</b>　${okCount}件・${(doneBytes/1048576).toFixed(0)}MB　（${hhmm((Date.now()-T0)/1000)}）`);
    log(`\n完了しました。取り込み ${okCount}件${ngCount?` / 失敗 ${ngCount}件`:''}`);
    log(`アプリで開けるファイル 合計 ${S.attIds.size}件`);
    toast(`${okCount}件を取り込みました`);
    if(S.noteId) renderDetail();
  }catch(e){ log('エラー: '+e.message); }
}

/* ---------- 請求書の登録（スタッフ用・スマホ想定） ---------- */
function newDoc(){
  const m=el('div','modal');
  m.innerHTML=`<div class="box reg">
    <h3>請求書を登録する</h3>
    <p>写真かPDFを選んで、わかる範囲で入れてください。空欄があっても登録できます。<br>
       登録すると経理に通知が飛び、経理が確認します。</p>
    <div class="drop" id="drop">
      <div class="ph">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b9c0cc" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
        <b>写真をとる / ファイルを選ぶ</b>
        <span>スマホならカメラも使えます・PDFもOK</span>
      </div>
      <img id="prev" style="display:none">
      <div id="fname" class="fn"></div>
    </div>
    <input type="file" id="pick" accept="image/*,application/pdf" style="display:none">
    <div class="fgrid" style="margin-top:18px">
      <label>店舗</label><select id="r-store"></select>
      <label>取引先</label><input id="r-vendor" placeholder="例：株式会社hacomono">
      <label>金額（税込）</label><input id="r-amount" type="number" inputmode="numeric" placeholder="38500">
      <label>支払期日</label><input id="r-due" type="date">
      <label>種別</label><select id="r-type"></select>
      <label>メモ</label><input id="r-memo" placeholder="任意">
      <label>リンク</label><input id="r-link" placeholder="任意：Googleドライブの共有リンク">
    </div>
    <div class="row"><button id="r-cancel">キャンセル</button>
      <button id="r-go" class="primary">登録する</button></div>
    <div id="r-msg" style="font-size:12px;color:var(--sub);margin-top:10px;text-align:right"></div>
  </div>`;
  document.body.appendChild(m);
  const $$ = s => m.querySelector(s);
  STORES.forEach(s=>{ const o=el('option',null,esc(s)); o.value=s; $$('#r-store').appendChild(o); });
  DTYPES.forEach(t=>{ const o=el('option',null,esc(t)); o.value=t; $$('#r-type').appendChild(o); });
  $$('#r-store').value = STORES[0];

  let picked=null;
  const showFile=f=>{
    picked=f;
    $$('#fname').textContent = f.name + '（' + mb(f.size) + '）';
    const p=$$('#prev');
    if(/^image\//.test(f.type)){ p.src=URL.createObjectURL(f); p.style.display='block'; $$('.ph').style.display='none'; }
    else { p.style.display='none'; $$('.ph').style.display='flex'; }
    $$('#drop').classList.add('has');
  };
  $$('#drop').onclick=()=>$$('#pick').click();
  $$('#pick').onchange=e=>{ const f=e.target.files[0]; if(f) showFile(f); };
  const dz=$$('#drop');
  dz.ondragover=e=>{ e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('over');
    const f=e.dataTransfer.files[0]; if(f) showFile(f); };

  $$('#r-cancel').onclick=()=>m.remove();
  $$('#r-go').onclick=async()=>{
    const btn=$$('#r-go'), msg=$$('#r-msg');
    btn.disabled=true;
    const id='d'+Date.now()+Math.random().toString(36).slice(2,5);
    const d = { id, type:$$('#r-type').value, vendor:$$('#r-vendor').value.trim(),
      amount: $$('#r-amount').value==='' ? null : Number($$('#r-amount').value),
      issuedAt:today(), dueAt:$$('#r-due').value, period:today().slice(0,7),
      store:$$('#r-store').value, section:'', status:'pending',
      fileName:'', hasFile:false, fileSize:0, fileType:'', filePath:'',
      fileLink:$$('#r-link').value.trim(),
      noteId:'', noteTitle:'', folder:'', memo:$$('#r-memo').value,
      createdBy:ME.name, createdByEmail:ME.email, createdAt:nowISO(), updatedAt:nowISO(),
      deleted:false, source:'app' };
    try{
      if(picked){
        msg.textContent='ファイルを準備しています…';
        Object.assign(d, await saveDocFile(id, picked, t=>msg.textContent=t));
      }
      msg.textContent='保存しています…';
      await setDoc(doc(db,'documents',id), d);
      S.docs.unshift(d);
      await idbSet('docs_cache', null);
      const n = await notifyAccounting('doc', '請求書が登録されました',
        `${d.store}　${d.vendor||'取引先未記入'}　${d.amount?yen(d.amount):'金額未記入'}（登録 ${ME.name}）`,
        {view:'docs', id});
      m.remove();
      buildNotifications(); renderDocs();
      toast(n ? `登録しました。経理${n}名に通知しました` : '登録しました');
    }catch(err){
      msg.innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
      btn.disabled=false;
    }
  };
}

function openDoc(id, editing){
  const d = S.docs.find(x=>x.id===id); if(!d) return;
  S.docId=id;
  pushRecent('doc', d.id, `${d.vendor||'（取引先未設定）'}　${d.period||''}`, `${d.type||''}・${d.store||''}`);
  const bg=el('div','drawer-bg'); const dw=el('div','drawer');
  const close=()=>{ bg.remove(); dw.remove(); S.docId=null; };
  bg.onclick=close;

  const hd=el('div','dh'); hd.style.position='relative';
  hd.innerHTML=`<button class="x">&times;</button>
    <div style="font-size:11.5px;color:var(--sub);letter-spacing:.05em">
      ${esc(d.type||'')} / ${esc(d.store||'')}
      <span class="pill ${esc(d.status||'checked')}" style="margin-left:6px">${esc(DSTATUS[d.status]||'—')}</span></div>
    <h2>${esc(d.vendor||'（取引先未設定）')}</h2>
    <div style="font-size:12.5px;color:var(--sub);margin-top:4px">
      ${esc(d.period||'')}　<b style="color:var(--text);font-size:15px">${yen(d.amount)}</b>
      ${d.dueAt?`　期日 ${esc(d.dueAt)}`:''}</div>
    ${d.createdBy?`<div style="font-size:11px;color:#9aa3b2;margin-top:3px">登録 ${esc(d.createdBy)} / ${fmt(d.createdAt)}${
      d.checkedBy?`　確認 ${esc(d.checkedBy)} / ${fmt(d.checkedAt)}`:''}</div>`:''}`;
  hd.querySelector('.x').onclick=close;
  dw.appendChild(hd);

  const bd=el('div','db'); dw.appendChild(bd);

  /* --- 経理の確認ボタン（確認待ちのときだけ大きく出す） --- */
  if(d.status==='pending'){
    const box=el('div','approve');
    box.innerHTML=`<b>経理の確認待ちです</b>
      <span>内容を確かめて、問題なければ「確認して未払いにする」を押してください。</span>`;
    const rw=el('div'); rw.style.cssText='display:flex;gap:8px;margin-top:12px;flex-wrap:wrap';
    const ok=el('button','btn primary','確認して未払いにする');
    ok.onclick=()=>setStatus(d, 'unpaid', close);
    const hold=el('button','btn','差し戻す（保留）');
    hold.onclick=()=>setStatus(d, 'hold', close);
    rw.appendChild(ok); rw.appendChild(hold); box.appendChild(rw);
    bd.appendChild(box);
  }else if(d.status==='unpaid'){
    const rw=el('div'); rw.style.cssText='display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap';
    const ok=el('button','btn primary','支払済にする');
    ok.onclick=()=>setStatus(d, 'paid', close);
    rw.appendChild(ok); bd.appendChild(rw);
  }

  const g=el('div','fgrid');
  const field=(label, node)=>{ g.appendChild(el('label',null,esc(label))); g.appendChild(node); return node; };
  const inp=(v,type)=>{ const i=el('input'); i.type=type||'text'; i.value=v==null?'':v; return i; };
  const sl=(v,opts)=>{ const s=el('select'); opts.forEach(([val,l])=>{ const o=el('option',null,esc(l)); o.value=val; s.appendChild(o); }); s.value=v||''; return s; };

  const fType   = field('種別', sl(d.type, DTYPES.map(t=>[t,t])));
  const fVendor = field('取引先', inp(d.vendor));
  const fStore  = field('店舗・部門', sl(d.store, STORES.map(t=>[t,t])));
  const fAmount = field('金額（税込）', inp(d.amount, 'number'));
  const fIssued = field('発行日', inp(d.issuedAt, 'date'));
  const fDue    = field('支払期日', inp(d.dueAt, 'date'));
  const fPeriod = field('対象月', inp(d.period));
  fPeriod.placeholder='2026-07';
  const fStatus = field('状態', sl(d.status, Object.entries(DSTATUS)));
  const fMemo   = field('メモ', el('textarea'));
  fMemo.value = d.memo||'';
  bd.appendChild(g);

  const save = el('button','btn primary','保存');
  const del  = el('button','btn','削除');
  const rw=el('div'); rw.style.cssText='display:flex;gap:8px;margin-top:16px';
  rw.appendChild(save); rw.appendChild(del);
  bd.appendChild(rw);

  save.onclick = async ()=>{
    Object.assign(d, {
      type:fType.value, vendor:fVendor.value.trim(), store:fStore.value,
      amount: fAmount.value===''? null : Number(fAmount.value),
      issuedAt:fIssued.value, dueAt:fDue.value, period:fPeriod.value.trim(),
      status:fStatus.value, memo:fMemo.value, updatedAt:nowISO(), editor:ME.name
    });
    await setDoc(doc(db,'documents',d.id), d);
    await idbSet('docs_cache', null);
    toast('保存しました');
    buildNotifications(); close(); renderDocs();
  };
  del.onclick = async ()=>{
    if(!confirm('この書類を台帳から削除します。よろしいですか？（ドライブのファイルは消えません）')) return;
    await setDoc(doc(db,'documents',d.id), {deleted:true, updatedAt:nowISO()}, {merge:true});
    S.docs = S.docs.filter(x=>x.id!==d.id);
    await idbSet('docs_cache', null);
    close(); renderDocs(); toast('削除しました');
  };

  // ---------- ファイル ----------
  bd.appendChild(el('div','sect-t','ファイル'));
  const fbox = el('div');
  bd.appendChild(fbox);
  const drawFile = async ()=>{
    fbox.innerHTML='';
    if(d.hasFile){
      // アプリに登録されたファイル（Firestoreの中）
      const ph=el('div',null,'<div style="padding:24px;text-align:center;color:#9aa3b2;font-size:12px"><span class="spin"></span> 読み込み中</div>');
      fbox.appendChild(ph);
      let f=null;
      try{ f = await loadDocFile(d.id); }catch(e){}
      ph.remove();
      if(f){
        if(/^image\//.test(f.type||'')){
          const a=el('a'); a.href=f.url; a.target='_blank'; a.rel='noopener';
          const im=el('img'); im.src=f.url; im.className='fprev'; a.appendChild(im); fbox.appendChild(a);
        }else{
          const fr=el('iframe'); fr.src=f.url; fr.className='fprev pdf'; fbox.appendChild(fr);
        }
        const r=el('div','att-row');
        r.innerHTML=`<span style="word-break:break-all">${esc(f.name||'')}</span><span class="sz">${mb(f.size||0)}</span>`;
        const op=el('button',null,'別タブで開く');
        op.onclick=()=>window.open(f.url,'_blank','noopener');
        const rm=el('button',null,'削除');
        rm.style.color='var(--danger)';
        rm.onclick=async()=>{
          if(!confirm('このファイルを削除します。よろしいですか？')) return;
          try{ await deleteDoc(doc(db,'docFiles',d.id)); }catch(e){}
          fileCache.delete(d.id);
          Object.assign(d,{hasFile:false,fileName:'',fileSize:0,fileType:''});
          await setDoc(doc(db,'documents',d.id),
            {hasFile:false,fileName:'',fileSize:0,fileType:'',updatedAt:nowISO()},{merge:true});
          await idbSet('docs_cache', null); drawFile(); toast('削除しました');
        };
        r.appendChild(op); r.appendChild(rm); fbox.appendChild(r);
      }else{
        fbox.appendChild(el('div',null,'<div style="font-size:12px;color:var(--sub);padding:8px 0">ファイルを読み込めませんでした。</div>'));
      }

    }else if(d.filePath){
      // Stockから引き継いだファイル。取り込み済みならその場で開ける
      fbox.appendChild(attachmentRow({name:d.fileName, path:d.filePath, size:d.fileSize}));
      if(!(S.attIds && S.attIds.has(pathId(d.filePath)))){
        fbox.appendChild(el('div',null,
          `<div style="font-size:11px;color:#9aa3b2;margin-top:6px;line-height:1.6">
           Googleドライブにあるファイルです。アプリで直接開くには、右上の「管理」→「過去の添付ファイルを取り込む」を実行してください。</div>`));
      }

    }else{
      // 未添付 → その場で添付できるようにする
      const dz=el('div','drop sm');
      dz.innerHTML=`<div class="ph"><b>写真・PDFを添付する</b><span>ドラッグでもOK</span></div>
        <div class="fn" id="upmsg"></div>`;
      const pick=el('input'); pick.type='file'; pick.accept='image/*,application/pdf'; pick.style.display='none';
      const doUp = async f=>{
        const msg=dz.querySelector('#upmsg');
        try{
          msg.textContent='準備しています…';
          const meta = await saveDocFile(d.id, f, t=>msg.textContent=t);
          Object.assign(d, meta);
          await setDoc(doc(db,'documents',d.id), {...meta, updatedAt:nowISO()}, {merge:true});
          await idbSet('docs_cache', null);
          drawFile(); toast('添付しました');
        }catch(e){ msg.innerHTML=`<span style="color:var(--danger)">${esc(e.message)}</span>`; }
      };
      dz.onclick=()=>pick.click();
      pick.onchange=e=>{ const f=e.target.files[0]; if(f) doUp(f); };
      dz.ondragover=e=>{ e.preventDefault(); dz.classList.add('over'); };
      dz.ondragleave=()=>dz.classList.remove('over');
      dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove('over');
        const f=e.dataTransfer.files[0]; if(f) doUp(f); };
      fbox.appendChild(dz); fbox.appendChild(pick);
    }

    // 外部リンク（Googleドライブなど）
    const lg=el('div','fgrid'); lg.style.marginTop='14px';
    lg.appendChild(el('label',null,'ファイルのリンク'));
    const li=el('input'); li.placeholder='任意：Googleドライブの共有リンク'; li.value=d.fileLink||'';
    li.onchange=async()=>{
      d.fileLink=li.value.trim();
      await setDoc(doc(db,'documents',d.id),{fileLink:d.fileLink, updatedAt:nowISO()},{merge:true});
      await idbSet('docs_cache', null); toast('保存しました');
    };
    lg.appendChild(li); fbox.appendChild(lg);
    if(d.fileLink){
      const a=el('a',null,'リンクを開く'); a.href=d.fileLink; a.target='_blank'; a.rel='noopener';
      a.style.cssText='font-size:12px;display:inline-block;margin-top:8px';
      fbox.appendChild(a);
    }

    if(d.noteId){
      const lk=el('button','btn sm','元のノートを開く'); lk.style.marginTop='10px';
      lk.onclick=()=>{ close(); go('knowledge'); S.noteId=d.noteId; S.results=null; S.editing=false; renderList(); renderDetail(); };
      fbox.appendChild(lk);
    }
  };
  drawFile();

  // コメント
  const cw=el('div'); bd.appendChild(cw);
  mountComments(cw, 'doc', d.id, `${d.vendor||''} ${d.period||''} ${d.type||''}`);

  document.body.appendChild(bg); document.body.appendChild(dw);
  if(editing) fVendor.focus();

/* 状態を進める（経理の確認・支払済など）。登録した人に結果を通知する。 */
async function setStatus(d, status, done){
  const patch = { status, updatedAt:nowISO(), editor:ME.name };
  if(status==='unpaid' || status==='hold'){ patch.checkedBy=ME.name; patch.checkedAt=nowISO(); }
  if(status==='paid'){ patch.paidBy=ME.name; patch.paidAt=nowISO(); }
  Object.assign(d, patch);
  await setDoc(doc(db,'documents',d.id), patch, {merge:true});
  await idbSet('docs_cache', null);
  if(d.createdByEmail && d.createdByEmail!==ME.email){
    const msg = { unpaid:'経理が確認しました', hold:'経理が保留にしました。内容を確認してください',
                  paid:'支払いが完了しました' }[status];
    if(msg) await pushNotif(d.createdByEmail, 'doc', msg,
      `${d.vendor||''}　${yen(d.amount)}（${d.store||''}）`, {view:'docs', id:d.id});
  }
  buildNotifications();
  toast(`「${DSTATUS[status]}」にしました`);
  done && done();
  renderDocs();
}

function exportDocsCsv(){
  const rows = filteredDocs();
  const head = ['発行日','種別','取引先','店舗','対象月','金額','支払期日','状態','ファイル名','保存パス','メモ'];
  const line = a => a.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
  const body = rows.map(d=>line([d.issuedAt,d.type,d.vendor,d.store,d.period,d.amount??'',
    d.dueAt,DSTATUS[d.status]||'',d.fileName,d.filePath,d.memo]));
  const csv = '﻿' + [line(head), ...body].join('\r\n');
  const a=el('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`Period_stock_書類台帳_${today()}.csv`; a.click();
  toast(`${rows.length}件を書き出しました`);
}

function importDocs(){
  const m=el('div','modal');
  m.innerHTML=`<div class="box"><h3>書類台帳の初期データを取り込む</h3>
    <p>documents_seed.json（または .gz）を選ぶと、Stockの添付から作った台帳を一括登録します。
       同じIDの書類は上書きされます。</p>
    <input type="file" id="dimp" accept=".json,.gz" style="font-size:13px;padding:9px;border:1px solid var(--line);border-radius:4px;width:100%">
    <div class="bar"><i id="dpb"></i></div><div class="log" id="dlg" style="display:none"></div>
    <div class="row"><button id="dcl">閉じる</button></div></div>`;
  document.body.appendChild(m);
  $('#dcl').onclick=()=>m.remove();
  $('#dimp').onchange = async e => {
    const file=e.target.files[0]; if(!file) return;
    const lg=$('#dlg'); lg.style.display='block';
    const log=t=>{ lg.textContent+=t+'\n'; lg.scrollTop=lg.scrollHeight; };
    try{
      let text;
      if(file.name.endsWith('.gz'))
        text = await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text();
      else text = await file.text();
      const rows = JSON.parse(text);
      log(`${rows.length}件を読み込みました`);
      const now=nowISO();
      let b=writeBatch(db), c=0;
      for(let i=0;i<rows.length;i++){
        const r=rows[i];
        b.set(doc(db,'documents',String(r.id)), {...r, id:String(r.id), updatedAt:now, deleted:false});
        if(++c%400===0){ await b.commit(); b=writeBatch(db);
          $('#dpb').style.width=(i/rows.length*100).toFixed(0)+'%'; log(`${i+1} / ${rows.length}`); }
      }
      await b.commit();
      $('#dpb').style.width='100%';
      log('完了しました。画面を更新します。');
      await idbSet('docs_cache', null);
      await syncDocs(); buildNotifications();
      setTimeout(()=>{ m.remove(); renderDocs(); toast(`${rows.length}件を取り込みました`); }, 700);
    }catch(err){ log('エラー: '+err.message); }
  };
}

  buildNotifications();
}
