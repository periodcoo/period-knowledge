<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Period.stock</title>
<!-- Googleログイン用。Firebaseの signInWithPopup/signInWithRedirect は
     GitHub Pages（Firebase Hosting以外）だとSafari等でストレージが分離され失敗するため、
     Google Identity Services で直接サインインし、そのIDトークンをFirebaseに渡す方式にしている。
     詳細: https://firebase.google.com/docs/auth/web/redirect-best-practices の Option 5 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --navy:#141b2d; --navy2:#1e2740; --navy3:#28324e; --line:#e3e6ec; --line2:#2a3450;
  --text:#1a1f2b; --sub:#6b7280; --accent:#8a6d3b; --accent2:#b08d4f;
  --bg:#f7f8fa; --white:#fff; --danger:#b3261e; --ok:#2e6b4f; --warn:#9a6a1a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium",sans-serif;
  color:var(--text);background:var(--bg);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);-webkit-tap-highlight-color:transparent}
.fold,.item,.mcard,.tabbar button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---------- 全体レイアウト ---------- */
#app{display:none;flex-direction:column;height:100vh;height:100dvh}
#app.ready{display:flex}
.topbar{height:56px;flex:none;background:var(--navy);display:flex;align-items:center;gap:18px;padding:0 20px;color:#fff;position:relative;z-index:30}
.brand{font-size:15px;letter-spacing:.14em;font-weight:600;white-space:nowrap}
.brand span{color:var(--accent2);font-weight:400;letter-spacing:.06em}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{padding:7px 15px;font-size:12.5px;color:#9aa4b8;border-radius:4px;white-space:nowrap}
.nav button:hover{color:#fff;background:var(--navy2)}
.nav button.on{color:#fff;background:var(--navy3);box-shadow:inset 0 -2px 0 var(--accent2)}
.search-wrap{flex:1;max-width:460px;position:relative}
.search-wrap.hide{visibility:hidden}
.search-wrap input{width:100%;height:34px;border-radius:4px;border:1px solid var(--line2);
  background:var(--navy2);color:#fff;padding:0 12px 0 34px;outline:none}
.search-wrap input::placeholder{color:#8892a6}
.search-wrap input:focus{border-color:var(--accent2)}
.search-ico{position:absolute;left:11px;top:9px;width:15px;height:15px;opacity:.55}
.topbar .who{font-size:12px;color:#a9b2c4;margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap}
.topbar .who button{color:#a9b2c4;font-size:12px;text-decoration:underline}
.bell{position:relative;width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.bell:hover{background:var(--navy2)}
.bell .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);
  color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}
.notif-panel{position:absolute;top:52px;right:16px;width:400px;max-height:70vh;overflow-y:auto;background:#fff;
  border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px rgba(20,27,45,.22);z-index:40;color:var(--text)}
.notif-panel h4{font-size:12px;letter-spacing:.06em;color:var(--sub);padding:13px 16px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center}
.notif-panel h4 button{margin-left:auto;font-size:11px;color:var(--accent);text-decoration:underline}
.nrow{padding:11px 16px;border-bottom:1px solid #f2f4f7;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.nrow:hover{background:#fafbfc}
.nrow.unread{background:#fdfbf6}
.nrow .ic{width:22px;height:22px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:#eceff4;color:var(--sub);margin-top:2px}
.nrow .ic.due{background:#f7ece9;color:var(--danger)}
.nrow .ic.men{background:#f0e9dc;color:var(--accent)}
.nrow .ic.todo{background:#e8f0ec;color:var(--ok)}
.nrow .tx{flex:1;min-width:0}
.nrow .tx b{font-size:12.5px;font-weight:600;display:block}
.nrow .tx span{font-size:11.5px;color:var(--sub);display:block;line-height:1.5}
.nrow .tm{font-size:10.5px;color:#9aa3b2;white-space:nowrap}

#views{flex:1;min-height:0;position:relative}
.view{display:none;height:100%}
.view.on{display:block}
#view-knowledge.on{display:grid;grid-template-columns:264px 340px 1fr}
.pane{overflow-y:auto;background:var(--white);height:100%}
#sidebar{background:var(--navy);color:#c8cfdd;border-right:1px solid var(--line2);padding-bottom:40px}
#list{border-right:1px solid var(--line)}
.page{height:100%;overflow-y:auto;padding:26px 32px 80px}
.page-w{max-width:1240px;margin:0 auto}
.page h1{font-size:19px;font-weight:600;letter-spacing:.02em}
.page .lead{font-size:12.5px;color:var(--sub);margin-top:4px}

/* ---------- ナレッジ ---------- */
.mode-tabs{display:flex;border-bottom:1px solid var(--line2)}
.mode-tabs button{flex:1;padding:11px 0;font-size:12px;color:#8892a6;border-bottom:2px solid transparent}
.mode-tabs button.on{color:#fff;border-bottom-color:var(--accent2)}
.sec{margin-top:6px}
.sec-h{display:flex;align-items:center;gap:7px;padding:9px 16px;font-size:12px;letter-spacing:.06em;
  color:#9aa4b8;cursor:pointer;user-select:none}
.sec-h:hover{color:#fff}
.sec-h .cnt{margin-left:auto;font-size:11px;color:#6f7a92}
.fold{padding:7px 16px 7px 34px;font-size:13px;color:#c8cfdd;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.fold:hover{background:var(--navy2)}
.fold.on{background:var(--navy2);color:#fff;box-shadow:inset 2px 0 0 var(--accent2)}
.fold .n{margin-left:auto;font-size:11px;color:#6f7a92}
.arrow{width:8px;transition:transform .15s;display:inline-block;font-size:8px}
.arrow.open{transform:rotate(90deg)}
.list-head{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:2}
.list-head h2{font-size:15px;font-weight:600}
.list-head .meta{font-size:11px;color:var(--sub);margin-top:3px}
.newbtn{margin-top:10px;background:var(--navy);color:#fff;padding:7px 14px;border-radius:4px;font-size:12px}
.newbtn:hover{background:var(--navy2)}
.item{padding:13px 18px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.item:hover{background:#fafbfc}
.item.on{background:#f4f1ea;box-shadow:inset 3px 0 0 var(--accent)}
.item h3{font-size:13.5px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item p{font-size:12px;color:var(--sub);line-height:1.55;max-height:3.1em;overflow:hidden}
.item .foot{margin-top:6px;font-size:11px;color:#9aa3b2;display:flex;gap:10px;align-items:center}
.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--sub)}
.badge{font-size:10px;background:#eceff4;color:#6b7280;border-radius:3px;padding:1px 6px;white-space:nowrap}
.badge.arc{background:#f0e9dc;color:#8a6d3b}
.detail-head{padding:22px 32px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:2}
.detail-head h1{font-size:20px;font-weight:600;line-height:1.45;outline:none}
.detail-head h1[contenteditable]:focus{background:#fbfaf7}
.detail-meta{font-size:11.5px;color:var(--sub);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:11.5px;color:var(--sub)}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools button.primary:hover{background:var(--navy2)}
.body{padding:24px 32px 40px;max-width:900px;outline:none;font-size:14px;word-wrap:break-word}
.body[contenteditable="true"]{background:#fdfcfa;min-height:40vh}
.body img{max-width:100%;height:auto}
.body a{word-break:break-all}
.body table{border-collapse:collapse;max-width:100%}
.body td,.body th{border:1px solid var(--line);padding:5px 8px}
.attach{margin:0 32px 30px;max-width:900px;border-top:1px solid var(--line);padding-top:16px}
.attach h4{font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:.06em}
.att-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f2f4f7;font-size:12.5px}
.att-row .sz{color:#9aa3b2;font-size:11px;margin-left:auto}
.att-row button{font-size:11px;color:var(--accent);text-decoration:underline;white-space:nowrap}
.empty{padding:70px 40px;text-align:center;color:#9aa3b2;font-size:13px}

/* ---------- 共通パーツ ---------- */
/* ---------- ホーム ---------- */
.page-w.home{max-width:760px;padding-top:26px}
.hsearch{position:relative;display:flex;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:0 16px;height:52px;box-shadow:0 1px 3px rgba(20,27,45,.04);transition:border-color .15s}
.hsearch:focus-within{border-color:var(--accent);box-shadow:0 2px 10px rgba(138,109,59,.1)}
.hsearch svg{width:18px;height:18px;flex:none}
.hsearch input{flex:1;border:none;outline:none;background:none;font-size:15px;padding:0 12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 17px;text-align:left}
.quick button:hover{border-color:var(--accent);background:#fdfcfa}
.quick button b{display:block;font-size:13.5px;font-weight:600}
.quick button span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
.listbox{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f2f4f7;cursor:pointer}
.srow:last-child{border-bottom:none}
.srow:hover{background:#fafbfc}
.srow b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;max-width:52%}
.srow .s{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.srow .d{font-size:11px;color:#b6bdc9;white-space:nowrap;margin-left:auto}
.srow.todo-row b{max-width:none;flex:none}
.srow.todo-row.alert b{color:var(--danger)}
.srow.todo-row.warn b{color:var(--warn)}
.stat{font-size:12px;color:var(--sub);margin:16px 0 4px;font-variant-numeric:tabular-nums}

.meta-row{display:flex;align-items:center;gap:8px;margin-top:3px}
.meta-row .meta{margin-top:0}
.sortsel{margin-left:auto;border:1px solid var(--line);border-radius:5px;background:#fff;
  padding:3px 6px;font-size:11.5px;color:var(--sub);outline:none;max-width:60%}
.sortsel:hover{border-color:var(--accent);color:var(--accent)}
.sortsel:focus{border-color:var(--accent)}
.lsearch{position:relative;display:flex;align-items:center;background:#fafbfc;border:1px solid var(--line);
  border-radius:6px;padding:0 10px;height:34px;margin-bottom:11px}
.lsearch:focus-within{border-color:var(--accent);background:#fff}
.lsearch svg{width:14px;height:14px;flex:none}
.lsearch input{flex:1;border:none;outline:none;background:none;font-size:12.5px;padding:0 8px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:12px;margin:18px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px 17px}
.card .lb{font-size:11px;color:var(--sub);letter-spacing:.04em}
.card .vl{font-size:23px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.card .vl.sm{font-size:17px}
.card .sfx{font-size:11.5px;color:#9aa3b2;margin-top:3px}
.card.alert{border-color:#e6c9c4;background:#fdf8f7}
.card.alert .vl{color:var(--danger)}
.card.warn{border-color:#e8dcc0;background:#fdfbf6}
.card.warn .vl{color:var(--warn)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);border-radius:4px;padding:6px 9px;background:#fff;outline:none;font-size:12.5px}
.filters select:focus,.filters input:focus{border-color:var(--accent)}
.filters input.kw{min-width:200px}
.btn{border:1px solid var(--line);border-radius:4px;padding:6px 13px;font-size:12.5px;background:#fff;color:var(--sub)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2);color:#fff}
.btn.sm{padding:4px 10px;font-size:11.5px}

table.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
table.tbl th{font-size:11px;color:var(--sub);letter-spacing:.04em;text-align:left;padding:10px 12px;
  background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
table.tbl th:hover{color:var(--accent)}
table.tbl th .s{color:var(--accent);font-size:9px}
table.tbl td{padding:9px 12px;border-bottom:1px solid #f2f4f7;font-size:12.5px;vertical-align:middle}
table.tbl tr:hover td{background:#fafbfc}
table.tbl tr{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.el{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;border-radius:10px;padding:1px 9px;white-space:nowrap;border:1px solid transparent}
.pill.pending{background:#fdf4e8;color:#8a5a12;border-color:#ebd9bb;font-weight:600}
.pill.unpaid{background:#fdf3f2;color:var(--danger);border-color:#eed6d2}
.pill.paid{background:#eef4f0;color:var(--ok);border-color:#d3e3da}
.pill.checked{background:#eef1f6;color:#41506e;border-color:#d8dfea}
.pill.hold{background:#fdf8ec;color:var(--warn);border-color:#eadfc4}
.pill.over{background:var(--danger);color:#fff}
.pill.soon{background:#fdf8ec;color:var(--warn);border-color:#eadfc4}
.pill.t{background:#f5f6f8;color:#5b6577;border-color:#e6e9ef}

/* ---------- ドロワー ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(20,27,45,.4);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:61;
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(20,27,45,.18)}
.drawer .dh{padding:20px 26px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer .dh h2{font-size:16.5px;font-weight:600;line-height:1.45;padding-right:30px}
.drawer .dh .x{position:absolute;top:16px;right:20px;font-size:20px;color:#9aa3b2;line-height:1}
.drawer .dh .x:hover{color:var(--text)}
.drawer .db{flex:1;overflow-y:auto;padding:20px 26px 60px}
.fgrid{display:grid;grid-template-columns:104px 1fr;gap:9px 14px;align-items:center;font-size:12.5px}
.fgrid label{color:var(--sub);font-size:11.5px}
.fgrid input,.fgrid select,.fgrid textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 9px;outline:none;background:#fff}
.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{border-color:var(--accent)}
.fgrid textarea{min-height:64px;resize:vertical;line-height:1.6}
.sect-t{font-size:11.5px;color:var(--sub);letter-spacing:.06em;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* ---------- コメント ---------- */
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f2f4f7}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;flex:none;font-weight:600}
.cmt .cb{flex:1;min-width:0}
.cmt .cb .hd{font-size:12px;font-weight:600;display:flex;gap:9px;align-items:baseline}
.cmt .cb .hd time{font-weight:400;font-size:10.5px;color:#9aa3b2}
.cmt .cb .hd button{margin-left:auto;font-size:10.5px;color:#c0c6d0}
.cmt .cb .hd button:hover{color:var(--danger)}
.cmt .cb p{font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.men{color:var(--accent);background:#f6f2e9;border-radius:3px;padding:0 3px;font-weight:600}
.cmt-form{margin-top:14px;position:relative}
.cmt-form textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-height:70px;
  outline:none;resize:vertical;font-size:12.5px;line-height:1.6}
.cmt-form textarea:focus{border-color:var(--accent)}
.cmt-form .rw{display:flex;align-items:center;gap:10px;margin-top:8px}
.cmt-form .rw .hint{font-size:11px;color:#9aa3b2}
.mention-pop{position:absolute;background:#fff;border:1px solid var(--line);border-radius:5px;
  box-shadow:0 8px 22px rgba(20,27,45,.16);z-index:70;max-height:200px;overflow-y:auto;min-width:190px}
.mention-pop div{padding:7px 12px;font-size:12.5px;cursor:pointer}
.mention-pop div:hover,.mention-pop div.sel{background:#f4f1ea}

/* ---------- ToDo ---------- */
.todo{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f2f4f7}
.todo input[type=checkbox]{margin-top:4px;width:15px;height:15px;flex:none;accent-color:var(--accent)}
.todo .tt{flex:1;min-width:0;font-size:12.5px}
.todo .tt.done{text-decoration:line-through;color:#9aa3b2}
.todo .as{font-size:11px;color:var(--sub);white-space:nowrap}
.todo .rm{font-size:11px;color:#c0c6d0}
.todo .rm:hover{color:var(--danger)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;background:#f2f4f7;border-radius:12px;padding:2px 10px;display:flex;align-items:center;gap:5px}
.chip button{font-size:11px;color:#9aa3b2}
.chip button:hover{color:var(--danger)}

/* ---------- ゲート / モーダル ---------- */
.gate{max-width:520px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px 40px}
.gate h1{font-size:17px;margin-bottom:6px;letter-spacing:.1em}
.gate h1 span{color:var(--accent)}
.gate p{font-size:13px;color:var(--sub);margin-bottom:22px}
.gate label{display:block;font-size:11.5px;color:var(--sub);margin:14px 0 4px}
.gate input,.gate textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:9px 11px;outline:none}
.gate input:focus,.gate textarea:focus{border-color:var(--accent)}
.gate textarea{height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.gate button.go{margin-top:22px;width:100%;background:var(--navy);color:#fff;padding:11px;border-radius:4px}
.gate button.go:hover{background:var(--navy2)}
.gate .err{color:var(--danger);font-size:12px;margin-top:12px}
.gate .note{font-size:11.5px;color:#9aa3b2;margin-top:16px;line-height:1.65}

.modal{position:fixed;inset:0;background:rgba(20,27,45,.55);display:flex;align-items:center;justify-content:center;z-index:80}
.modal .box{background:#fff;border-radius:6px;padding:32px 36px;width:540px;max-height:82vh;overflow:auto}
.modal h3{font-size:15px;margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sub);max-height:180px;overflow:auto;
  background:#fafbfc;border:1px solid var(--line);border-radius:4px;padding:10px;white-space:pre-wrap}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal .row button{padding:8px 16px;border-radius:4px;font-size:13px;border:1px solid var(--line)}
.modal .row button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 20px;border-radius:5px;font-size:12.5px;z-index:99;box-shadow:0 8px 24px rgba(20,27,45,.28)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 添付・アップロード ---------- */
.drop{border:2px dashed var(--line);border-radius:8px;background:#fbfcfd;cursor:pointer;
  padding:26px 18px;text-align:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:#fdfbf6}
.drop.sm{padding:18px 14px}
.drop .ph{display:flex;flex-direction:column;align-items:center;gap:5px}
.drop .ph b{font-size:13px;font-weight:600}
.drop .ph span{font-size:11.5px;color:#9aa3b2}
.drop .fn{font-size:11.5px;color:var(--sub);margin-top:9px;word-break:break-all}
.drop img{max-width:100%;max-height:200px;border-radius:5px;display:block;margin:0 auto}
.fprev{width:100%;border:1px solid var(--line);border-radius:6px;display:block;background:#fafbfc}
img.fprev{max-height:340px;object-fit:contain}
iframe.fprev.pdf{height:420px}
.modal .box.reg{width:520px}
.astat{font-size:12.5px;color:var(--text);background:#fafbfc;border:1px solid var(--line);
  border-radius:5px;padding:10px 13px;margin-bottom:9px;font-variant-numeric:tabular-nums}
.astat b{font-size:14px}
.astat .fn2{display:block;font-size:11px;color:#9aa3b2;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clsec{border:1px solid var(--line);border-radius:7px;padding:14px 16px;margin-bottom:10px;background:#fff}
.clh{display:flex;align-items:center;gap:9px}
.clh b{font-size:13.5px}
.clh .n{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600}
.cld{font-size:11.5px;color:var(--sub);line-height:1.65;margin-top:4px}
.cls{background:#fafbfc;border-radius:5px;padding:9px 11px;margin:10px 0;font-size:11.5px;
  color:var(--text);max-height:130px;overflow:auto;line-height:1.7}
.cls div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clu{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f4f7;font-size:12px}
.clu .d{font-size:11px;color:#9aa3b2;margin-left:auto;white-space:nowrap}
.imgmiss{display:inline-flex;flex-direction:column;align-items:center;gap:5px;
  border:1px dashed var(--line);border-radius:7px;background:#fafbfc;
  padding:20px 22px;margin:6px 0;max-width:100%;text-align:center}
.imgmiss svg{width:26px;height:26px}
.imgmiss b{font-size:12.5px;font-weight:600;word-break:break-all}
.imgmiss span{font-size:11px;color:#9aa3b2;line-height:1.6;max-width:280px}
.tag.click{cursor:pointer}
.tag.click:hover{border-color:var(--accent);color:var(--accent)}
.adm{display:flex;flex-direction:column;gap:8px}
.adm button{text-align:left;border:1px solid var(--line);border-radius:6px;padding:13px 15px;background:#fff}
.adm button:hover{border-color:var(--accent);background:#fdfcfa}
.adm button b{display:block;font-size:13px;font-weight:600}
.adm button span{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.6}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f2f4f7;font-size:12.5px}
.mrow:last-child{border-bottom:none}
.mrow .em{flex:1;min-width:0}
.mrow select{border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;background:#fff}
.mrow button{font-size:11.5px;color:var(--accent);white-space:nowrap}
.pgrid{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:2px 12px;margin-top:8px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid #f5f6f8;font-size:12.5px}
.prow:last-child{border-bottom:none}
.prow input[type=checkbox]{width:15px;height:15px;flex:none}

.banner{background:#fdf8ec;border:1px solid #ecdcbb;border-radius:6px;padding:14px 18px;margin-top:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner b{font-size:13.5px;color:#8a5a12}
.banner span{font-size:12px;color:var(--sub);flex:1;min-width:180px}
.approve{background:#fdf8ec;border:1px solid #ecdcbb;border-radius:6px;padding:15px 17px;margin-bottom:20px}
.approve b{font-size:13.5px;color:#8a5a12;display:block}
.approve span{font-size:12px;color:var(--sub);display:block;margin-top:3px;line-height:1.6}

/* ============================================================
   ここから 2026年8月 第2弾の追加ぶん
   （定期支払い・OCR・取引先・カレンダー・承認・スマホ・横断検索・変更履歴）
   ============================================================ */

/* 状態ピル（追加） */
.pill.planned{background:#eef2fb;color:#3a4c78;border-color:#d5deee}
.pill.approval{background:#f3eefb;color:#5b3f8a;border-color:#ded2f0}
.pill.miss{background:var(--warn);color:#fff}

/* 上部の横断検索 */
.gsearch{flex:1;max-width:420px;position:relative;margin-left:6px}
.gsearch input{width:100%;height:34px;border-radius:4px;border:1px solid var(--line2);
  background:var(--navy2);color:#fff;padding:0 12px 0 34px;outline:none;font-size:12.5px}
.gsearch input::placeholder{color:#8892a6}
.gsearch input:focus{border-color:var(--accent2)}
.gsearch .ic{position:absolute;left:11px;top:9px;width:15px;height:15px;opacity:.55;pointer-events:none}
.gpop{position:absolute;top:40px;left:0;width:min(560px,88vw);max-height:66vh;overflow-y:auto;background:#fff;
  border:1px solid var(--line);border-radius:7px;box-shadow:0 14px 36px rgba(20,27,45,.24);z-index:45;color:var(--text)}
.gpop .gh{font-size:11px;letter-spacing:.06em;color:var(--sub);padding:9px 14px 7px;background:#fafbfc;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.gpop .grow{display:flex;gap:9px;align-items:center;padding:9px 14px;border-bottom:1px solid #f2f4f7;cursor:pointer}
.gpop .grow:hover,.gpop .grow.sel{background:#f4f1ea}
.gpop .grow b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;flex:none}
.gpop .grow .s{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.gpop .grow .d{font-size:10.5px;color:#b6bdc9;white-space:nowrap}
.gpop .gmore{padding:10px 14px;font-size:11.5px;color:var(--accent);cursor:pointer;text-align:center}
.gpop .gmore:hover{background:#faf8f3}

/* 表示切替（表 / カレンダー） */
.segs{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.segs button{padding:6px 14px;font-size:12.5px;color:var(--sub);border-right:1px solid var(--line)}
.segs button:last-child{border-right:none}
.segs button.on{background:var(--navy);color:#fff}

/* 支払いカレンダー */
.calbar{display:flex;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.calbar .mo{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;min-width:128px}
.calbar .sum{font-size:12.5px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
.calbar .sum b{color:var(--text);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cal .dow{background:#fafbfc;text-align:center;font-size:11px;color:var(--sub);padding:7px 0;letter-spacing:.04em}
.cal .dow.sat{color:#3a5a8a}.cal .dow.sun{color:var(--danger)}
.cal .cell{background:#fff;min-height:104px;padding:5px 6px 7px;display:flex;flex-direction:column;gap:3px}
.cal .cell.out{background:#fbfcfd}
.cal .cell.today{background:#fdfbf6;box-shadow:inset 0 0 0 2px var(--accent2)}
.cal .cell .dn{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.cal .cell .dn .t{margin-left:auto;font-size:10.5px;color:#9aa3b2}
.cal .cell.out .dn{color:#c3c9d4}
.cal .ev{font-size:11px;border-radius:3px;padding:2px 5px;cursor:pointer;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent}
.cal .ev:hover{filter:brightness(.96)}
.cal .ev.unpaid{background:#fdf3f2;color:var(--danger);border-color:#eed6d2}
.cal .ev.paid{background:#eef4f0;color:var(--ok);border-color:#d3e3da}
.cal .ev.pending{background:#fdf4e8;color:#8a5a12;border-color:#ebd9bb}
.cal .ev.approval{background:#f3eefb;color:#5b3f8a;border-color:#ded2f0}
.cal .ev.planned{background:#eef2fb;color:#3a4c78;border-color:#d5deee}
.cal .ev.hold,.cal .ev.checked{background:#f5f6f8;color:#5b6577;border-color:#e6e9ef}
.cal .ev .a{float:right;margin-left:8px;font-variant-numeric:tabular-nums}
.cal .more{font-size:10.5px;color:#9aa3b2;padding:0 5px;cursor:pointer}
.cal .more:hover{color:var(--accent)}

/* OCR */
.ocrbox{border:1px solid var(--line);border-radius:6px;background:#fafbfc;padding:12px 14px;margin-top:10px}
.ocrbox .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ocrbox .hd b{font-size:12.5px}
.ocrbox .msg{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.6}
.ocands{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.ocands button{border:1px solid var(--line);border-radius:14px;padding:5px 14px;background:#fff;
  font-size:12.5px;font-variant-numeric:tabular-nums}
.ocands button:hover{border-color:var(--accent);color:var(--accent);background:#fdfbf6}
.ocands button.best{border-color:var(--accent);color:var(--accent);font-weight:600}
.ocrraw{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--sub);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:8px;margin-top:9px;max-height:150px;overflow:auto;white-space:pre-wrap}

/* 変更履歴 */
.hist{border-left:2px solid var(--line);margin-left:5px;padding-left:15px}
.hrow{padding:9px 0;border-bottom:1px solid #f2f4f7;position:relative}
.hrow:last-child{border-bottom:none}
.hrow::before{content:'';position:absolute;left:-21px;top:15px;width:7px;height:7px;border-radius:50%;
  background:#fff;border:2px solid var(--line)}
.hrow.new::before{border-color:var(--accent)}
.hrow .hh{font-size:11.5px;color:var(--sub);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hrow .hh b{font-size:12.5px;color:var(--text);font-weight:600}
.hrow .hc{font-size:12px;margin-top:3px;line-height:1.75}
.hrow .hc .f{color:var(--sub)}
.hrow .hc .o{color:#9aa3b2;text-decoration:line-through;margin:0 3px}
.hrow .hc .n{color:var(--text);font-weight:600}

/* 取引先・定期支払い */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px;margin-top:4px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:7px;padding:14px 16px;cursor:pointer}
.vcard:hover{border-color:var(--accent);background:#fdfcfa}
.vcard .nm{font-size:14px;font-weight:600;line-height:1.4}
.vcard .kn{font-size:11px;color:#9aa3b2}
.vcard .rw{font-size:11.5px;color:var(--sub);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vcard .amt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.help{font-size:11.5px;color:#9aa3b2;line-height:1.65;margin-top:5px}
.fgrid .full{grid-column:1 / -1}
.fgrid .hint{grid-column:2 / 3;font-size:11px;color:#9aa3b2;margin-top:-4px;line-height:1.55}
.swrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 0}
.swrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.miss{background:#fdf4e8;border:1px solid #ebd9bb;border-radius:6px;padding:13px 17px;margin-top:14px}
.miss b{font-size:13px;color:#8a5a12}
.miss .mt{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.65}
.miss .mi{font-size:12.5px;padding:6px 0;border-bottom:1px solid #efe3ca;cursor:pointer;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.miss .mi:last-child{border-bottom:none}
.miss .mi:hover{color:var(--accent)}
.miss .mi .d{margin-left:auto;font-size:11.5px;color:#9a6a1a;white-space:nowrap}

/* スマホ用のカード表（760px以下でのみ出る） */
.mcards{display:none}
.mcard{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:8px}
.mcard .t1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mcard .t2{font-size:14px;font-weight:600;margin-top:5px;line-height:1.4;word-break:break-all}
.mcard .t3{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
.mcard .t3 .amt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.mcard .t3 .due{font-size:12px;color:var(--sub)}
.mcard .t3 .due.over{color:var(--danger);font-weight:600}

/* 下部ナビ（スマホのみ） */
.tabbar{display:none}

/* ---------- 要対応の帯（上のバーの下） ---------- */
.alertbar{display:none}
.alertbar.on{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none;
  background:#fdf8ec;border-bottom:1px solid #ecdcbb;padding:7px 20px}
.alertbar.bad{background:#fdf3f2;border-bottom-color:#eed6d2}
.alertbar button{font-size:12px;color:#8a5a12;border:1px solid #e3d2b0;background:#fff;
  border-radius:13px;padding:3px 12px;white-space:nowrap}
.alertbar button:hover{border-color:var(--accent);color:var(--accent)}
.alertbar button.bad{color:var(--danger);border-color:#e6c9c4}
.alertbar button.close{margin-left:auto;border:none;background:none;color:#b6bdc9;font-size:15px;padding:0 4px}
.alertbar button.close:hover{color:var(--text)}

/* 上のタブ・下タブに出す件数バッジ */
.nav button{position:relative}
.nbadge{display:inline-block;margin-left:6px;min-width:16px;height:16px;line-height:16px;
  border-radius:8px;background:var(--danger);color:#fff;font-size:10px;padding:0 5px;
  text-align:center;font-weight:600;vertical-align:1px}

/* 「経理」の中のサブタブ */
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
.subtabs button{padding:8px 15px;font-size:12.5px;color:var(--sub);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap}
.subtabs button:hover{color:var(--text)}
.subtabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}

/* サイドバーの「最近ひらいたもの」 */
.recent{padding:10px 16px 4px}
.recent .rh{font-size:11px;letter-spacing:.06em;color:#6f7a92;margin-bottom:5px}
.recent .rr{display:flex;gap:7px;align-items:baseline;padding:4px 0;cursor:pointer;font-size:12px;color:#c8cfdd}
.recent .rr:hover{color:#fff}
.recent .rr .k{font-size:9.5px;color:#6f7a92;border:1px solid var(--line2);border-radius:3px;
  padding:0 4px;flex:none}
.recent .rr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- フォルダの追加・編集 ---------- */
.fold{position:relative}
.fold .fedit{display:none;position:absolute;right:6px;top:5px;width:22px;height:22px;border-radius:4px;
  color:#8892a6;font-size:14px;line-height:20px;text-align:center}
.fold:hover .fedit{display:block}
.fold .fedit:hover{background:var(--navy3);color:#fff}
.fold:hover .n{opacity:0}
.sbfoot{padding:12px 16px 26px}
.sbfoot button{width:100%;border:1px dashed var(--line2);border-radius:5px;padding:9px 0;
  font-size:12px;color:#9aa4b8}
.sbfoot button:hover{border-color:var(--accent2);color:#fff;background:var(--navy2)}

/* ---------- 二重払いの警告 ---------- */
.dup{background:#fdf3f2;border:1px solid #eed6d2;border-radius:6px;padding:13px 17px;margin-top:14px}
.dup b{font-size:13px;color:var(--danger)}
.dup .mt{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.65}
.dupg{border:1px solid var(--line);border-radius:6px;margin-top:10px;background:#fff;overflow:hidden}
.dupg .gh{background:#fafbfc;padding:8px 13px;font-size:12px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dupg .gh b{color:var(--text);font-size:12.5px}
.dupg .gr{padding:8px 13px;border-bottom:1px solid #f2f4f7;font-size:12.5px;cursor:pointer;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dupg .gr:last-child{border-bottom:none}
.dupg .gr:hover{background:#fafbfc}
.dupg .gr .d{margin-left:auto;color:#9aa3b2;font-size:11.5px;white-space:nowrap}

/* ---------- 月次レポート ---------- */
.rep{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:6px}
table.rept{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rept th{font-size:11px;color:var(--sub);padding:9px 10px;background:#fafbfc;
  border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;position:sticky;top:0}
table.rept th:first-child{text-align:left;left:0;z-index:2}
table.rept td{padding:8px 10px;border-bottom:1px solid #f2f4f7;font-size:12.5px;text-align:right;white-space:nowrap}
table.rept td:first-child{text-align:left;font-weight:600;background:#fff;position:sticky;left:0}
table.rept tr:last-child td{border-bottom:none;background:#fafbfc;font-weight:600}
table.rept td.z{color:#c8ced8}
.bars{margin-top:18px}
.bar2{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.bar2 .lb{width:170px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2 .tr{flex:1;background:#f2f4f7;border-radius:3px;height:16px;overflow:hidden;min-width:60px}
.bar2 .tr i{display:block;height:100%;background:var(--accent2);border-radius:3px}
.bar2 .vl{width:110px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.delta{font-size:11.5px;margin-left:6px}
.delta.up{color:var(--danger)}
.delta.dn{color:var(--ok)}

@media(max-width:1100px){#view-knowledge.on{grid-template-columns:210px 300px 1fr}.nav button{padding:7px 10px}
  .gsearch{max-width:230px}}

/* ---------- スマホ ---------- */
@media(max-width:760px){
  body{font-size:15px}
  .topbar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .brand{font-size:14px;order:1}
  .who{order:2;margin-left:auto}
  .nav{order:3;width:100%;overflow-x:auto;margin-left:0;gap:4px;-webkit-overflow-scrolling:touch}
  .nav button{flex:none;padding:7px 12px;font-size:12.5px}
  .search-wrap{order:4;width:100%;max-width:none}
  .search-wrap.hide{display:none}
  .page{padding:18px 14px 70px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
  .card .vl{font-size:20px}
  .page h1{font-size:17px}
  .quick{grid-template-columns:1fr}
  .srow{flex-wrap:wrap;gap:6px 10px}
  .srow b{max-width:100%;width:100%}
  .srow .d{margin-left:0}
  .hsearch input{font-size:16px}
  .filters select,.filters input{font-size:16px;padding:8px 9px}
  .filters input.kw{min-width:0;flex:1}
  .lsearch input{font-size:16px}
  .page > .page-w > div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}
  table.tbl th:nth-child(5),table.tbl td:nth-child(5),
  table.tbl th:nth-child(9),table.tbl td:nth-child(9){display:none}
  table.tbl td,table.tbl th{padding:8px 8px;font-size:12px}
  .drawer{width:100vw}
  .drawer .dh{padding:16px 18px 12px}
  .drawer .db{padding:16px 18px 60px}
  .fgrid{grid-template-columns:1fr;gap:4px 0}
  .fgrid label{margin-top:9px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where,
  orderBy, limit, writeBatch, Bytes }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   小道具
   ============================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => { if(!d) return ''; const t=new Date(d);
  return isNaN(t) ? '' : `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`; };
const fmtT = d => { if(!d) return ''; const t=new Date(d); if(isNaN(t)) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`; };
const mb  = n => n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
const yen = n => (n==null||n==='') ? '—' : '¥'+Number(n).toLocaleString('ja-JP');
const today = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const initials = s => (s||'?').trim().slice(0,1);
function toast(msg){ const t=el('div','toast',esc(msg)); document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200); }

let fb=null, db=null, auth=null, ME=null;

const STORES  = ["本部","FITNESS","BEAUTY","CAFE"];
/* 2026年8月：店舗名を4つにまとめた。旧名→新名のマップ（既存データの一括書き換えに使う）
   本部+経理→本部／Fitness+Li'l Fit+NIRAM→FITNESS／Beauty+ULuLu→BEAUTY／CAFE+it's Time coffee→CAFE */
const STORE_MERGE_MAP = {
  '本部':'本部', '経理':'本部',
  'Fitness':'FITNESS', "Li'l Fit":'FITNESS', 'NIRAM':'FITNESS',
  'Beauty':'BEAUTY', 'ULuLu':'BEAUTY',
  'CAFE':'CAFE', "it's Time coffee":'CAFE',
};
const DTYPES  = ["請求書","納品書","領収書","見積書","発注書","契約書","その他"];
// 流れ： 予定（定期支払いから自動生成）
//        → 確認待ち（店舗が登録）→ 承認待ち（金額が大きいとき）→ 未払い → 支払済
const DSTATUS = { planned:'予定', pending:'確認待ち', approval:'承認待ち',
                  unpaid:'未払い', paid:'支払済', hold:'保留', checked:'確認済' };
// 支払いを待っている＝まだお金が出ていない状態
const OPEN_ST = ['pending','approval','unpaid','hold'];

const ROLES = { member:'メンバー', accounting:'経理', manager:'マネージャー', admin:'管理者' };
const roleOf = () => (S.myRole||'member').toLowerCase();
const isAdmin      = () => roleOf()==='admin';
const isAccounting = () => ['accounting','admin'].includes(roleOf());
const isManager    = () => ['manager','admin'].includes(roleOf());
function folderVisibleToMe(f){
  if(!f) return true;
  const p = f.participants;
  return !p || !p.length || p.includes(ME.email);
}

const S = {
  view:'knowledge', kstep:1,
  // ナレッジ
  folders:[], notes:[], corpus:null, mode:'work', folderId:null, noteId:null, open:{}, results:null, editing:false,
  // 共通
  members:[], myRole:'member', notifs:[], notifOpen:false, attIds:new Set(), noteQ:'',
  created:null, tags:null, noteSort: localStorage.getItem('period_stock_notesort') || 'updated_desc',
  // 書類
  docs:[], docSort:{k:'issuedAt',d:-1}, docId:null, docEditing:false,
  dfil:{type:'',store:'',year:'',status:'',vendor:'',kw:''},
  // 議事録
  minutes:[], minuteId:null, minuteEditing:false,
  mfil:{store:'',year:'',kw:''},
  // 取引先マスタ（A-4）
  vendors:[], vendorId:null, vfil:{kw:'',store:''},
  // 定期支払い（A-1）
  recurring:[], recurringId:null,
  // 台帳の表示（表 / カレンダー）（A-5）
  docView: localStorage.getItem('period_stock_docview') || 'table',
  calYM: null,
  // 月次レポート
  repYear: null, repScope:'請求書',
  // 全体設定（承認フローなど）（A-6）
  settings:{ approvalOn:false, approvalMin:100000, approvalRoles:['manager','admin'], dupIgnore:[] },
};

const CFG_KEY = 'period_stock_cfg';
const OLD_CFG_KEY = 'period_knowledge_cfg';
boot();

/* ============================================================
   起動・認証
   ============================================================ */
async function boot(){
  let raw = null;
  try{
    const r = await fetch('./firebase-config.json', {cache:'no-cache'});
    if(r.ok){ const j = await r.json(); if(j && j.apiKey) raw = JSON.stringify(j); }
  }catch(e){}
  if(!raw) raw = localStorage.getItem(CFG_KEY) || localStorage.getItem(OLD_CFG_KEY);
  if(!raw){ return renderSetup(); }
  let cfg; try{ cfg=JSON.parse(raw); }catch(e){ return renderSetup('保存された設定を読めませんでした'); }
  try{ fb = initializeApp(cfg); db = getFirestore(fb); auth = getAuth(fb); }
  catch(e){ return renderSetup('Firebaseの初期化に失敗しました: '+e.message); }

  onAuthStateChanged(auth, async u => {
    if(!u) return renderLogin();
    const ok = await allowed(u.email);
    if(!ok){ await signOut(auth);
      return renderLogin(`${u.email} はまだ許可されていません。管理者に members への追加を依頼してください。`); }
    ME = { email:u.email, name:u.displayName || u.email };
    $('#gate').style.display='none';
    $('#app').classList.add('ready');
    $('#whoami').textContent = ME.name;
    renderNav();
    initGlobalSearch();
    await loadAll();
  });
}

async function allowed(email){
  try{
    const s = await getDoc(doc(db,'members',email));
    if(s.exists()) return true;
    const any = await getDocs(query(collection(db,'members'), limit(1)));
    return any.empty;
  }catch(e){ return false; }
}

function renderSetup(err){
  $('#app').classList.remove('ready');
  const g=$('#gate'); g.style.display='block';
  g.innerHTML = `<div class="gate">
    <h1>初回セットアップ</h1>
    <p>Firebaseコンソールで作成したウェブアプリの設定を貼り付けてください。この端末にのみ保存されます。</p>
    <label>firebaseConfig（波かっこごと貼り付け）</label>
    <textarea id="cfg" placeholder='{ "apiKey": "...", "projectId": "..." }'></textarea>
    <button class="go" id="save">保存して開始</button>
    ${err?`<div class="err">${esc(err)}</div>`:''}
    <div class="note">Firebaseコンソール → プロジェクトの設定 → マイアプリ → ウェブアプリ の
    「SDK の設定と構成」に出る内容です。const firebaseConfig = の右側だけを貼ってください。</div>
  </div>`;
  $('#save').onclick = () => {
    let t = $('#cfg').value.trim();
    t = t.replace(/^const\s+firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'');
    let cfg;
    try{ cfg = JSON.parse(t); }
    catch(e){ try{ cfg = (0,eval)('('+t+')'); }catch(e2){ return alert('設定を読み取れませんでした。波かっこごと貼り付けてください。'); } }
    if(!cfg || !cfg.apiKey || !cfg.projectId) return alert('apiKey と projectId が見つかりません。');
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    location.reload();
  };
}

/* ============================================================
   ログイン
   ─────────────────────────────────────────────
   GitHub Pages（Firebase Hosting以外）で Firebase の signInWithPopup /
   signInWithRedirect を使うと、認証ドメイン（*.firebaseapp.com）との間で
   SafariなどのITP（ストレージ分離）に引っかかり、
   「Unable to process request due to missing initial state」等で
   失敗したり、画面が固まったように進まなくなったりする。
   （Firebase公式: https://firebase.google.com/docs/auth/web/redirect-best-practices ）
   このアプリはFirebase Hostingを使っていない（authDomainを合わせられない）ので、
   同ドキュメントの Option 5 にしたがい、Googleへのサインイン自体は
   Google Identity Services（GIS。Firebaseの認証ドメインを経由しない）で行い、
   取れたIDトークンだけを signInWithCredential でFirebaseに渡す。
   スクリプトが読み込めない場合だけ、従来の signInWithPopup にフォールバックする。
   LINEなどのアプリ内ブラウザは、Google側がそもそもログインを拒否するので
   （disallowed_useragent）、先に検知して案内を出す。
   ============================================================ */
const GOOGLE_WEB_CLIENT_ID = '221343551074-6r2rnrf6g88aoqt3me4d7ttvhqibcrc0.apps.googleusercontent.com';

function isInAppBrowser(){
  const ua = navigator.userAgent||'';
  return /Line\//i.test(ua) || /FBAN|FBAV/i.test(ua) || /Instagram/i.test(ua) ||
         /Twitter/i.test(ua) || /KAKAOTALK/i.test(ua) || /MicroMessenger/i.test(ua);
}
function friendlyAuthError(e){
  const code = (e && e.code) || '';
  const msg  = (e && e.message) || '';
  if(code==='auth/popup-closed-by-user' || code==='auth/cancelled-popup-request') return null; // 自分で閉じただけ
  if(code==='auth/unauthorized-domain') return 'このサイトのドメインがFirebase側で許可されていません。管理者に連絡してください。';
  if(code==='auth/network-request-failed') return '通信が不安定なようです。電波の良いところでもう一度お試しください。';
  if(/missing initial state/i.test(msg))
    return 'ログイン処理がうまく引き継げませんでした。もう一度お試しください。';
  return 'ログインに失敗しました: '+msg;
}
// GISのスクリプトはasync読み込みなので、ボタンを出す時点でまだ来ていないことがある
function waitForGis(timeoutMs){
  return new Promise((resolve, reject)=>{
    const t0 = Date.now();
    (function poll(){
      if(window.google && google.accounts && google.accounts.id) return resolve();
      if(Date.now()-t0 > (timeoutMs||8000))
        return reject(new Error('Googleログイン用のスクリプトを読み込めませんでした'));
      setTimeout(poll, 100);
    })();
  });
}
async function onGoogleCredential(resp){
  try{ await signInWithCredential(auth, GoogleAuthProvider.credential(resp.credential)); }
  catch(e){ const msg = friendlyAuthError(e); if(msg) renderLogin(msg); }
}
function renderPopupButton(box){
  box.innerHTML='';
  const b = el('button','go','Googleでログイン');
  b.onclick = async () => {
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ const msg=friendlyAuthError(e); if(msg) renderLogin(msg); }
  };
  box.appendChild(b);
}
// GIS（Googleの直接ログイン）を使うには、Google Cloud Console →
// このプロジェクトの OAuth 2.0 クライアントID → 承認済みの JavaScript 生成元 に
// https://periodcoo.github.io を追加する必要がある（未設定だと origin_mismatch で失敗する）。
// 追加が済むまでは、これまでどおりの signInWithPopup を使う。
const GIS_ORIGIN_AUTHORIZED = true;
async function renderGoogleButton(){
  const box = $('#gin'); if(!box) return;
  if(!GIS_ORIGIN_AUTHORIZED) return renderPopupButton(box);
  try{
    await waitForGis();
    google.accounts.id.initialize({ client_id: GOOGLE_WEB_CLIENT_ID, callback: onGoogleCredential });
    box.innerHTML='';
    google.accounts.id.renderButton(box, {theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', locale:'ja', width:280});
  }catch(e){
    renderPopupButton(box); // GISが読み込めない環境向けの予備ルート
  }
}

function renderLogin(err){
  $('#app').classList.remove('ready');
  const g=$('#gate'); g.style.display='block';
  const inApp = isInAppBrowser();
  g.innerHTML = `<div class="gate">
    <h1>PERIOD.<span>stock</span></h1>
    <p>社内アカウントでログインしてください。</p>
    ${inApp
      ? `<div class="err">LINEなどのアプリ内ブラウザではGoogleログインができません。<br>
          画面右下（または右上）の「…」メニューから「ブラウザで開く」「Safariで開く」を選んで、
          あらためて開き直してください。</div>`
      : `<div id="gin" style="display:flex;justify-content:center;min-height:44px;align-items:center;color:#9aa4b8;font-size:12.5px">読み込み中…</div>`}
    ${err?`<div class="err" style="white-space:pre-line">${esc(err)}</div>`:''}
    <div class="note"><button id="reset" style="text-decoration:underline">Firebaseの設定をやり直す</button></div>
  </div>`;
  if(!inApp) renderGoogleButton();
  $('#reset').onclick = () => { localStorage.removeItem(CFG_KEY); localStorage.removeItem(OLD_CFG_KEY); location.reload(); };
}
$('#signout').onclick = () => signOut(auth).then(()=>location.reload());

/* ---------- メンバー管理 ----------
   役割(role)の変更・新規追加はadmin、フォルダごとの閲覧権限(参加フォルダ)の
   変更はmanager以上が行える。一覧の閲覧と自分のフォルダ確認は全メンバー共通。 */
function openMembers(){
  const m=el('div','modal');
  const rows = S.members.slice().sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email,'ja'));
  m.innerHTML = `<div class="box" style="width:640px">
    <h3>メンバー</h3>
    <p>${rows.length}人が登録されています。役割を変えると経理・管理メニューで見える操作が変わります。
    各フォルダを誰に見せるかは「参加フォルダ」、またはフォルダの設定から選べます。</p>
    <div id="mem-list"></div>
    ${isAdmin() ? `
    <div class="fgrid" style="margin-top:16px">
      <label>メールアドレス</label><input id="mem-email" placeholder="name@example.com">
      <label>名前</label><input id="mem-name" placeholder="例：新村 佑介">
      <label>役割</label><select id="mem-role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
    </div>
    <div class="row"><button id="mem-add" class="primary">＋ 新規追加</button></div>
    ` : ''}
    <div class="row"><button id="mem-cl">閉じる</button></div>
  </div>`;
  document.body.appendChild(m);
  const list = m.querySelector('#mem-list');
  rows.forEach(mm=>{
    const row=el('div','mrow');
    row.innerHTML = `<span class="em"><b>${esc(mm.name||mm.email)}</b> <span class="help" style="display:inline">${esc(mm.email)}</span></span>`;
    const sel=document.createElement('select');
    Object.entries(ROLES).forEach(([k,v])=>{
      const o=document.createElement('option'); o.value=k; o.textContent=v;
      if((mm.role||'member').toLowerCase()===k) o.selected=true;
      sel.appendChild(o);
    });
    sel.disabled = !isAdmin();
    sel.onchange = async ()=>{
      await setDoc(doc(db,'members',mm.email), {name:mm.name||'', role:sel.value}, {merge:true});
      mm.role = sel.value;
      if(mm.email===ME.email){ S.myRole = sel.value; renderNav(); }
      toast('更新しました');
    };
    row.appendChild(sel);
    const fb=el('button', null, '参加フォルダ');
    fb.onclick=()=>openMemberFolders(mm.email, mm.name);
    row.appendChild(fb);
    if(isAdmin() && mm.email!==ME.email){
      const delb=el('button', null, '削除');
      delb.style.color='var(--danger)';
      delb.onclick=async()=>{
        if(!confirm(`${mm.name||mm.email} を削除します。よろしいですか？`)) return;

})();

function alertItems(){
  if(!S.docs || !S.docs.length) return [];
  const out=[];
  const yensum = a => a.reduce((s,d)=>s+(Number(d.amount)||0),0);
  const dups = (typeof openDuplicates==='function') ? openDuplicates() : [];
  const miss = missingInvoices();
  const overdue = S.docs.filter(d=>d.status==='unpaid' && d.dueAt && d.dueAt<today());
  const pending = S.docs.filter(d=>d.status==='pending');
  const approval= S.docs.filter(d=>d.status==='approval');
  if(dups.length)   out.push({t:`二重払いのおそれ ${dups.length}件`, go:()=>openDupModal(), lv:'bad'});
  if(miss.length)   out.push({t:`請求書が届いていない ${miss.length}件`, go:()=>go('recurring'), lv:'bad'});
  if(overdue.length)out.push({t:`支払期日ぎれ ${overdue.length}件（${yen(yensum(overdue))}）`,
                              go:()=>{ S.dfil={...emptyDfil(), status:'unpaid'}; go('docs'); }, lv:'bad'});
  if(approval.length && isManager())
                    out.push({t:`あなたの承認待ち ${approval.length}件`,
                              go:()=>{ S.dfil={...emptyDfil(), status:'approval'}; go('docs'); }, lv:'warn'});
  if(pending.length && isAccounting())
                    out.push({t:`経理の確認待ち ${pending.length}件`,
                              go:()=>{ S.dfil={...emptyDfil(), status:'pending'}; go('docs'); }, lv:'warn'});
  return out;
}

/* --- 汎用 差分同期（updatedAt をキーに端末にキャッシュ） --- */
async function syncColl(name, cacheKey){
  let cache = await idbGet(cacheKey);
  if(!cache || !Array.isArray(cache.rows)) cache = {rows:[], since:'1970-01-01T00:00:00.000Z'};
  let snap;
  try{
    snap = await getDocs(query(collection(db,name),
      where('updatedAt','>',cache.since), orderBy('updatedAt','asc'), limit(3000)));
  }catch(e){ return cache.rows; }
  const map = new Map(cache.rows.map(r=>[r.id,r]));
  let since = cache.since;
  snap.docs.forEach(d=>{
    const v = {id:d.id, ...d.data()};
    map.set(d.id, v);
    if((v.updatedAt||'') > since) since = v.updatedAt;
  });
  const rows = [...map.values()].filter(r=>!r.deleted);
  await idbSet(cacheKey, {rows:[...map.values()], since});
  return rows;
}
async function syncDocs(){    S.docs    = await syncColl('documents','docs_cache'); return S.docs; }
async function syncMinutes(){ S.minutes = await syncColl('minutes','minutes_cache'); return S.minutes; }
async function syncVendors(){ S.vendors = await syncColl('vendors','vendors_cache'); return S.vendors; }

/* --- ナレッジ索引（既存） --- */
async function loadIndex(){
  const meta = await getDoc(doc(db,'meta','index'));
  const md  = meta.exists()? meta.data() : {version:0, builtAt:'1970-01-01'};
  const cached = await idbGet('idx_'+md.version);
  if(cached){ S.notes = cached; }
  else{
    const shards = await getDocs(query(collection(db,'indexShards'), orderBy('n')));
    let all=[];
    for(const s of shards.docs){
      const txt = await ungzip(s.data().gz.toUint8Array());
      all = all.concat(JSON.parse(txt));
    }
    S.notes = all;
    await idbSet('idx_'+md.version, all);
  }
  try{
    const delta = await getDocs(query(collection(db,'notes'),
      where('updatedAt','>', md.builtAt || '1970-01-01'), orderBy('updatedAt','desc'), limit(500)));
    const map = new Map(S.notes.map(n=>[String(n.id),n]));
    delta.docs.forEach(d=>{
      const v=d.data();
      map.set(d.id, {id:d.id, folderId:String(v.folderId), folder:v.folder, title:v.title,
        preview:v.preview, updatedAt:v.updatedAt, author:v.author, archived:!!v.archived,
        daily:!!v.daily, att:(v.attachments||[]).length});
    });
    S.notes=[...map.values()];
  }catch(e){}
  S.notes = S.notes.filter(n=>{
    const f = S.folders.find(x=>String(x.id)===String(n.folderId));
    return !f || folderVisibleToMe(f);
  });
  loadCorpus();
}
async function loadCorpus(){
  if(S.corpus) return;
  try{
    const meta = await getDoc(doc(db,'meta','corpus'));
    const ver = meta.exists()? meta.data().version : 0;
    if(!ver) return;
    const cached = await idbGet('corpus_'+ver);
    if(cached){ S.corpus = cached; return; }
    const shards = await getDocs(query(collection(db,'corpusShards'), orderBy('n')));
    const all = {};
    for(const s of shards.docs){
      const txt = await ungzip(s.data().gz.toUint8Array());
      Object.assign(all, JSON.parse(txt));
    }
    S.corpus = all;
    await idbSet('corpus_'+ver, all);
  }catch(e){}
}

async function ungzip(u8){
  const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
async function gzipStr(str){
  const cs = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  return new Uint8Array(await new Response(cs).arrayBuffer());
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('period_knowledge',1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
  r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const d=await idb();
  return await new Promise(r=>{ const q=d.transaction('kv').objectStore('kv').get(k);
    q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const d=await idb();
  const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); }catch(e){} }

   ホーム（ダッシュボード）
   ============================================================ */
/* --- 最近ひらいたもの（この端末に保存） --- */
const RECENT_KEY='period_stock_recent';
const recents = () => { try{ return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]'); }catch(e){ return []; } };
function pushRecent(kind, id, title, sub){
  if(!title) return;
  const a = recents().filter(x=>!(x.kind===kind && x.id===id));
  a.unshift({kind, id, title, sub:sub||'', at:nowISO()});
  localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0,12)));
}
const KINDLABEL = {note:'ノート', doc:'書類', minute:'議事録'};
function openByKind(kind, id){
  if(kind==='note'){ go('knowledge'); S.noteId=id; S.results=null; S.editing=false;
    renderList(); renderDetail(); kStep(2); }
  if(kind==='doc'){ go('docs'); openDoc(id); }
  if(kind==='minute'){ go('minutes'); openMinute(id); }
}

/* --- 全体をまとめて検索 --- */
function globalSearch(q){
  const keys=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!keys.length) return [];
  const hit=(hay)=>keys.every(k=>hay.toLowerCase().includes(k));
  const out=[];
  S.docs.forEach(d=>{
    if(hit(`${d.vendor||''} ${d.fileName||''} ${d.noteTitle||''} ${d.folder||''} ${d.memo||''} ${d.period||''} ${d.store||''} ${d.amount||''}`))
      out.push({kind:'doc', id:d.id, title:`${d.vendor||'（取引先未設定）'}　${d.period||''}`,
        sub:`${d.type||''}・${d.store||''}・${yen(d.amount)}`, at:d.issuedAt||''});
  });
  S.minutes.forEach(m=>{
    if(hit(`${m.title||''} ${m.store||''} ${(m.attendees||[]).join(' ')} ${(m.decisions||[]).join(' ')} ${(m.todos||[]).map(t=>t.text).join(' ')} ${stripHtml(m.body||'')}`))
      out.push({kind:'minute', id:m.id, title:m.title||'(無題)',
        sub:`${m.date||''}・${m.store||''}`, at:m.date||''});
  });
  const C=S.corpus;
  S.notes.forEach(n=>{
    if(hit(`${n.title||''} ${n.folder||''} ${n.preview||''} ${tagsOf(n).join(' ')} ${(C&&C[String(n.id)])||''}`))
      out.push({kind:'note', id:n.id, title:n.title||'(無題)',
        sub:`${n.folder||''}${n.att?`・添付${n.att}`:''}`, at:(n.updatedAt||'').slice(0,10)});
  });
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,60);
}

   探すことは上のバーの横断検索とナレッジの検索へ、

/* ============================================================

function renderSidebar(){
  const sb=$('#sidebar'); sb.innerHTML='';
  const tabs = el('div','mode-tabs');
  [['work','実務'],['daily','日報'],['arc','アーカイブ']].forEach(([k,label])=>{
    const b=el('button',S.mode===k?'on':'',label);
    b.onclick=()=>{ S.mode=k; S.folderId=null; S.results=null; S.noteQ='';
      renderSidebar(); renderList(); renderDetail(); };
    tabs.appendChild(b);
  });
  sb.appendChild(tabs);
  const pool = notesInMode();
  const counts={};
  pool.forEach(n=>{ counts[n.folderId]=(counts[n.folderId]||0)+1; });
  // ノートが1件も無いフォルダ（作ったばかりのもの）は「実務」タブに出す
  const totals={};
  S.notes.forEach(n=>{ totals[n.folderId]=(totals[n.folderId]||0)+1; });
  const visible = f => (counts[f.id] || (S.mode==='work' && !totals[f.id])) && folderVisibleToMe(f);

  const bySec={};
  S.folders.forEach(f=>{ if(!visible(f)) return; (bySec[f.section] = bySec[f.section]||[]).push(f); });
  Object.keys(bySec).sort().forEach(sec=>{
    const total = bySec[sec].reduce((a,f)=>a+(counts[f.id]||0),0);
    const wrap = el('div','sec');
    const open = S.open[sec] === true;   // はじめは閉じておく
    const h = el('div','sec-h',
      `<span class="arrow${open?' open':''}">&#9654;</span><span>${esc(sec)}</span>
       <span class="cnt">${total}</span>`);
    h.onclick=()=>{ S.open[sec]=!open; renderSidebar(); };
    wrap.appendChild(h);
    if(open){
      bySec[sec].sort((a,b)=>a.name.localeCompare(b.name,'ja')).forEach(f=>{
        const c = counts[f.id]||0;
        const d=el('div','fold'+(S.folderId===f.id?' on':''),
          `<span>${esc(f.name)}</span><span class="n">${c}</span>`);
        d.onclick=()=>{ S.folderId=f.id; S.results=null; S.noteQ='';
          renderSidebar(); renderList(); renderDetail(); kStep(1); };
        const eb=el('button','fedit','⋯'); eb.title='このフォルダの設定';
        eb.onclick=e=>{ e.stopPropagation(); openFolder(f.id); };
        d.appendChild(eb);
        wrap.appendChild(d);
      });
    }
    sb.appendChild(wrap);
  });

  const foot=el('div','sbfoot');
  const nb=el('button',null,'＋ フォルダを追加');
  nb.onclick=()=>openFolder(null);
  foot.appendChild(nb);
  sb.appendChild(foot);

  // 最近ひらいたもの（ホーム画面をやめたぶん、ここに置く）
  const rc=recents();
  if(rc.length){
    const r=el('div','recent');
    r.appendChild(el('div','rh','最近ひらいたもの'));
    rc.slice(0,6).forEach(x=>{
      const row=el('div','rr');
      row.innerHTML=`<span class="k">${esc(KINDLABEL[x.kind]||'')}</span><span class="n">${esc(x.title)}</span>`;
      row.onclick=()=>openByKind(x.kind, x.id);
      r.appendChild(row);
    });
    sb.appendChild(r);
  }
}

/* フォルダの追加・名前の変更・削除 */
function openFolder(id, presetSection){
  const isNew = !id;
  const f = isNew ? null : S.folders.find(x=>x.id===id);
  if(!isNew && !f) return;
  const used = S.notes.filter(n=>String(n.folderId)===String(id)).length;
  const sections = [...new Set(S.folders.map(x=>x.section).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'ja'));
  const cur = isNew ? (presetSection || sections[0] || 'その他') : f.section;

  const m=el('div','modal');
  m.innerHTML=`<div class="box" style="width:460px">
    <h3>${isNew?'フォルダを追加':'フォルダの設定'}</h3>
    <p>${isNew
      ? 'ノートを入れる場所を作ります。区分は左のサイドバーの見出しです。'
      : `名前を変えても、中のノート ${used}件 はそのまま残ります。`}</p>
    <div class="fgrid">
      <label>フォルダ名</label><input id="f-name" value="${esc(isNew?'':f.name)}" placeholder="例：2026年 契約書">
      <label>区分</label>
      <select id="f-sec">
        ${sections.map(s=>`<option value="${esc(s)}"${s===cur?' selected':''}>${esc(s)}</option>`).join('')}
        <option value="__new">＋ 新しい区分を作る…</option>
      </select>
    </div>
    <div class="fgrid" id="f-newsec" style="display:none;margin-top:9px">
      <label>新しい区分名</label><input id="f-newsec-v" placeholder="例：⑧新規事業">
    </div>
    <div class="fgrid" style="margin-top:14px">
      <label>閲覧メンバー</label>
      <div class="help">チェックしたメンバーだけが閲覧できます。誰もチェックしなければ全員が閲覧できます。</div>
    </div>
    <div class="pgrid" id="f-participants"></div>
    <div class="row">
      ${(!isNew && used===0)?'<button id="f-del" style="color:var(--danger);margin-right:auto">削除</button>':''}
      <button id="f-c">キャンセル</button>
      <button id="f-s" class="primary">${isNew?'追加する':'保存'}</button>
    </div>
    ${(!isNew && used>0)?`<div class="help" style="text-align:right">中にノートがあるフォルダは消せません（${used}件）。空にしてから消してください。</div>`:''}
  </div>`;
  document.body.appendChild(m);
  const $$ = s => m.querySelector(s);
  $$('#f-c').onclick=()=>m.remove();
  $$('#f-name').focus();
  const curParts = new Set((f && f.participants) || []);
  const pwrap = $$('#f-participants');
  (S.members.length ? S.members : [{email:ME.email,name:ME.name}])
    .slice().sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email,'ja'))
    .forEach(mm=>{
      const prow=el('label','prow');
      prow.innerHTML=`<input type="checkbox" value="${esc(mm.email)}"${curParts.has(mm.email)?' checked':''}>
        <span>${esc(mm.name||mm.email)}</span>
        <span class="help" style="margin-left:auto">${esc(ROLES[(mm.role||'member').toLowerCase()]||'')}</span>`;
      pwrap.appendChild(prow);
    });

  const sel=$$('#f-sec'), newRow=$$('#f-newsec');
  sel.onchange=()=>{
    const isNewSec = sel.value==='__new';
    newRow.style.display = isNewSec ? 'grid' : 'none';
    if(isNewSec) $$('#f-newsec-v').focus();
  };
  const pickedSection = () => sel.value==='__new'
    ? ($$('#f-newsec-v').value.trim() || '')
    : sel.value;

  const del = $$('#f-del');
  if(del) del.onclick=async()=>{
    if(!confirm(`フォルダ「${f.name}」を消します。よろしいですか？`)) return;
    await deleteDoc(doc(db,'folders',String(f.id)));
    await logChange('folder', f.id, f.name, null, null, 'delete');
    S.folders = S.folders.filter(x=>x.id!==f.id);
    if(S.folderId===f.id) S.folderId=null;
    m.remove(); renderSidebar(); renderList(); renderDetail(); toast('削除しました');
  };

  $$('#f-s').onclick=async()=>{
    const name=$$('#f-name').value.trim();
    const sec =pickedSection();
    if(!name) return alert('フォルダ名を入れてください。');
    if(!sec)  return alert('新しい区分の名前を入れてください。');
    const dupF = S.folders.find(x=>x.name===name && x.section===sec && x.id!==id);
    if(dupF) return alert('同じ区分に同じ名前のフォルダがすでにあります。');
    const btn=$$('#f-s'); btn.disabled=true;
    const participants = [...pwrap.querySelectorAll('input:checked')].map(x=>x.value);
    if(isNew){
      const nf={ id:'f'+Date.now(), name, section:sec, participants,
                 createdBy:ME.name, createdAt:nowISO(), updatedAt:nowISO() };
      await setDoc(doc(db,'folders',nf.id), nf);
      await logChange('folder', nf.id, name, null, nf, 'create');
      S.folders.push(nf);
      S.open[sec]=true; S.folderId=nf.id; S.mode='work'; S.results=null;
      m.remove(); renderSidebar(); renderList(); renderDetail();
      toast('フォルダを作りました。「＋ 新規ノート」から書けます');
    }else{
      const before={name:f.name, section:f.section};
      const renamed = f.name!==name;
      f.name=name; f.section=sec; f.participants=participants; f.updatedAt=nowISO(); f.editor=ME.name;
      await setDoc(doc(db,'folders',String(f.id)), f);
      await logChange('folder', f.id, name, before, {name, section:sec}, 'update');
      if(renamed){
        // 一覧・検索に出る名前もそろえる
        S.notes.forEach(n=>{ if(String(n.folderId)===String(f.id)) n.folder=name; });
        try{ await rebuildIndex(); }catch(e){}
      }
      S.open[sec]=true;
      m.remove(); renderSidebar(); renderList(); renderDetail(); toast('保存しました');
    }
  };
}

/* ---------- 並び替え ---------- */
const NOTE_SORTS = [
  ['updated_desc', '更新が新しい順'],
  ['updated_asc',  '更新が古い順'],
  ['created_desc', '作成が新しい順'],
  ['created_asc',  '作成が古い順'],
  ['title_asc',    'タイトル順（あ→ん）'],
  ['title_desc',   'タイトル順（ん→あ）'],
  ['author_asc',   '作成者順'],
  ['att_desc',     '添付が多い順'],
];
// 作成日。索引には入っていないので、別に読み込んだ表を使う。
// 無ければノートIDの順（Stockでは古いものほど番号が小さい）で代用する。
function createdKey(n){
  const c = (S.created && S.created[String(n.id)]) || n.createdAt;
  if(c) return c;
  const num = Number(String(n.id).replace(/\D/g,''));
  return isNaN(num) ? '' : String(num).padStart(20,'0');
}
function sortNotes(rows){
  const s = rows.slice();
  const txt = (v)=>String(v||'');
  const cmpJa = (a,b)=>txt(a).localeCompare(txt(b),'ja',{numeric:true});
  const byUpdated = (a,b)=>txt(b.updatedAt).localeCompare(txt(a.updatedAt));
  switch(S.noteSort){
    case 'updated_asc':  s.sort((a,b)=>txt(a.updatedAt).localeCompare(txt(b.updatedAt))); break;
    case 'created_desc': s.sort((a,b)=>txt(createdKey(b)).localeCompare(txt(createdKey(a)))); break;
    case 'created_asc':  s.sort((a,b)=>txt(createdKey(a)).localeCompare(txt(createdKey(b)))); break;
    case 'title_asc':    s.sort((a,b)=>cmpJa(a.title,b.title) || byUpdated(a,b)); break;
    case 'title_desc':   s.sort((a,b)=>cmpJa(b.title,a.title) || byUpdated(a,b)); break;
    case 'author_asc':   s.sort((a,b)=>cmpJa(a.author,b.author) || byUpdated(a,b)); break;
    case 'att_desc':     s.sort((a,b)=>(b.att||0)-(a.att||0) || byUpdated(a,b)); break;
    default:             s.sort(byUpdated);
  }
  return s;
}

function notesInMode(){
  if(S.mode==='arc') return S.notes.filter(n=>n.archived);
  if(S.mode==='daily') return S.notes.filter(n=>n.daily && !n.archived);
  return S.notes.filter(n=>!n.daily && !n.archived);
}

      ${n.att?`<span class="badge">添付 ${n.att}</span>`:''}
      ${n.archived?'<span class="badge arc">アーカイブ</span>':''}
      ${tagsOf(n).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}

    box.appendChild(it);

  if(rows.length>300) box.appendChild(el('div','empty',`ほか ${rows.length-300} 件は検索で絞り込んでください`));

async function renderDetail(){

  D.innerHTML='<div class="empty"><span class="spin"></span></div>';

  const n = {id:snap.id, ...snap.data()};
  pushRecent('note', String(n.id), n.title, n.folder);
  const ed = S.editing;
  D.innerHTML='';
  { const bk=el('button','kback','← ノート一覧'); bk.onclick=()=>{ S.noteId=null; renderList(); kStep(1); }; D.appendChild(bk); }
  const head=el('div','detail-head');

  head.appendChild(el('div','detail-meta',
    `<span>${esc(n.folder||'')}</span><span>作成 ${esc(n.author||'')} / ${fmt(n.createdAt)}</span>
     <span>更新 ${esc(n.editor||'')} / ${fmt(n.updatedAt)}</span>

  const tools=el('div','tools');
  if(ed){
    [['太字','bold'],['斜体','italic'],['下線','underline'],['箇条書き','insertUnorderedList'],
     ['番号','insertOrderedList'],['見出し','formatBlock:h3'],['標準','formatBlock:div']]
      .forEach(([label,cmd])=>{
        const b=el('button',null,label);
        b.onmousedown=e=>{ e.preventDefault();
          const p=cmd.split(':'); document.execCommand(p[0],false,p[1]); };

      });

    tools.appendChild(lk);

    const cn=el('button',null,'取消'); cn.onclick=()=>{ S.editing=false; renderDetail(); }; tools.appendChild(cn);
  }else{
    const e1=el('button','primary','編集'); e1.onclick=()=>{ S.editing=true; renderDetail(); }; tools.appendChild(e1);
    const a1=el('button',null, n.archived?'アーカイブ解除':'アーカイブする');
    a1.onclick=()=>toggleArchive(n); tools.appendChild(a1);
    const d1=el('button',null,'削除'); d1.onclick=()=>removeNote(n); tools.appendChild(d1);
  }
  head.querySelectorAll('.tag.click').forEach(t=>{
    t.onclick=()=>{ S.noteQ=t.dataset.tag; S.results=null; doSearch(t.dataset.tag); };
  });
  head.appendChild(tools);
  D.appendChild(head);
  const bodyText = stripHtml(n.body||'');
  const echo = !ed && isAttachmentEcho(bodyText, n.attachments, [n.author, n.editor]);
  const body=el('div','body'); body.id='b-edit';
  body.innerHTML = n.body || '<p style="color:#9aa3b2">（本文なし）</p>';
  if(ed) body.contentEditable='true';

    // 本文はファイル名の再掲だけ。下の添付欄と重複するので画面には出さない。
    body.style.display='none';
    body.setAttribute('aria-hidden','true');
  }else{
    tidyBodyImages(body);
  }
  D.appendChild(body);
  if((n.attachments||[]).length){

    n.attachments.forEach(f=>a.appendChild(attachmentRow(f)));

  }
  // コメント欄
  const cw = el('div'); cw.style.cssText='margin:0 32px 60px;max-width:900px';
  D.appendChild(cw);
  mountComments(cw, 'note', String(n.id), n.title);
}
/* ------------------------------------------------------------
   Stockは添付を貼ると、本文にファイル名・日時・サイズ・投稿者を
   自動で書き込んでいた。下の「添付ファイル」欄と丸かぶりになるので、
   本文がその再掲だけのときは本文を出さない（データは消さない）。
   ------------------------------------------------------------ */
function stripAttachmentNoise(text, names, people){
  let t = String(text||'');
  (names||[]).forEach(nm=>{
    if(!nm) return;
    t = t.split(nm).join(' ');
    const base = nm.replace(/\.[^.]+$/,'');
    if(base.length>3) t = t.split(base).join(' ');
  });
  (people||[]).forEach(p=>{
    if(!p) return;
    t = t.split(p).join(' ');
    t = t.split(String(p).replace(/[\s　]/g,'')).join(' ');
  });
  return t
    .replace(/[^\s　]+\.(pdf|jpe?g|png|gif|webp|avif|heic|xlsx?|docx?|pptx?|numbers|key|pages|mov|mp4|m4a|zip|gz|csv|txt|webloc)/gi,' ')
    .replace(/[\d.,]+\s*(KB|MB|GB|バイト|bytes?)/gi,' ')
    .replace(/\d{1,4}[\/\-年.]\d{1,2}[\/\-月.]\d{1,2}日?/g,' ')
    .replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ')
    .replace(/[\s　.,、。・:：\-–—_|/\\()（）\[\]【】'"“”]/g,'')
    .trim();
}
// 本文が添付の再掲だけか？
function isAttachmentEcho(text, atts, people){
  if(!atts || !atts.length) return false;
  const t = String(text||'').trim();
  if(!t) return true;
  return stripAttachmentNoise(t, atts.map(a=>a.name), people).length <= 6;
}
// 一覧の抜粋用（添付の名前が分からないので文面から判断する）
function previewText(n){
  const p = String(n.preview||'');
  if(!p) return '';
  if(!n.att) return p;
  const hasFile = /\.(pdf|jpe?g|png|gif|webp|avif|heic|xlsx?|docx?|pptx?|numbers|key|pages|mov|mp4|m4a|zip|csv)\b/i.test(p);
  if(!hasFile) return p;
  if(stripAttachmentNoise(p, [], [n.author, n.editor]).length <= 6) return '';
  return p;
}

/* ------------------------------------------------------------
   本文の中の画像をきれいにする
   ・Stockが付けていたファイル種別アイコン（同じ絵が461個）は隠す
   ・本文に貼った写真は Stock のサーバーにあり、URLの有効期限が切れている。
     壊れた画像アイコンではなく、何の写真だったか分かる枠に置き換える。
   本文データそのものは書き換えない（画面の見え方だけ）。
   ------------------------------------------------------------ */
const DEAD_IMG_HOST = /stock-app\.jp|llstock\.s3|s3[.-][\w-]*amazonaws\.com/i;
function tidyBodyImages(container){
  container.querySelectorAll('img').forEach(im=>{
    const src = im.getAttribute('src') || '';
    const inWidget = im.closest && im.closest('.stockImageWidget, .attachmentPanel, .photoLi');
    if(/^data:/i.test(src)){
      if(inWidget) im.style.display='none';       // ファイル種別アイコン
      return;
    }
    const name = im.getAttribute('alt') || im.getAttribute('title') || '画像';
    const swap = ()=>{
      if(!im.parentNode) return;
      const ph = el('div','imgmiss');
      ph.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#b9c0cc" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/></svg>
        <b>${esc(name)}</b>
        <span>Stockのサーバーに置いたままの写真です。取り込むと、ここに表示されます。</span>`;
      im.replaceWith(ph);
    };
    // 取り込み済みなら、その場で本物の写真に差し替える
    const pid = (src.match(/\/uploads\/photo\/image\/(\d+)\//)||[])[1];
    if(pid && S.attIds && S.attIds.has(pathId('stockimg/'+pid))){
      loadAttachment('stockimg/'+pid).then(v=>{
        if(v && im.parentNode){ im.src = v.url; im.style.maxWidth='100%'; im.style.height='auto'; }
        else swap();
      }).catch(swap);
      return;
    }
    if(DEAD_IMG_HOST.test(src)) swap();
    else im.addEventListener('error', swap, {once:true});
  });
}

/* 添付ファイル1件ぶんの行。アプリに取り込み済みならその場で開ける。 */
function attachmentRow(f){
  const wrap = el('div');
  const inApp = S.attIds && S.attIds.has(pathId(f.path));
  const r = el('div','att-row');
  r.innerHTML = `<span style="word-break:break-all">${esc(f.name)}</span><span class="sz">${mb(f.size||0)}</span>`;

  const pv = el('div'); pv.style.cssText='margin:10px 0 4px';
  let open=false;

  const canPreview = CAN_PREVIEW.test(f.name||'');

  if(inApp){
    // 中身をアプリから取り出す（開く／再生／ダウンロード 共通）
    const fetchIt = async (btn)=>{
      const old = btn.textContent;
      btn.textContent='読み込み中…'; btn.disabled=true;
      try{
        const v = await loadAttachment(f.path, t=>{ btn.textContent=t; });
        btn.textContent=old; btn.disabled=false;
        return v;
      }catch(e){
        btn.textContent=old; btn.disabled=false;
        pv.innerHTML=`<div style="font-size:12px;color:var(--danger)">${esc(e.message)}</div>`;
        return null;
      }
    };

    if(canPreview){
      const b=el('button',null,'開く');
      b.style.fontWeight='600';
      b.onclick=async()=>{
        if(open){ pv.innerHTML=''; open=false; b.textContent='開く'; return; }
        pv.innerHTML='<div style="padding:16px;color:#9aa3b2;font-size:12px"><span class="spin"></span> 読み込み中</div>';
        const v = await fetchIt(b);
        pv.innerHTML='';
        if(!v){ pv.innerHTML='<div style="font-size:12px;color:var(--sub)">アプリの中に見つかりませんでした。</div>'; return; }
        const t = v.type||'';
        if(/^image\//.test(t)){
          const a2=el('a'); a2.href=v.url; a2.target='_blank'; a2.rel='noopener';
          const im=el('img'); im.src=v.url; im.className='fprev'; a2.appendChild(im); pv.appendChild(a2);
        }else if(/^audio\//.test(t)){
          const au=el('audio'); au.src=v.url; au.controls=true; au.style.cssText='width:100%;margin-top:4px';
          pv.appendChild(au);
        }else if(/^video\//.test(t)){
          const vd=el('video'); vd.src=v.url; vd.controls=true; vd.className='fprev';
          vd.style.maxHeight='420px'; pv.appendChild(vd);
        }else{
          const fr=el('iframe'); fr.src=v.url; fr.className='fprev pdf'; pv.appendChild(fr);
          const ob=el('button','btn sm','別タブで大きく見る'); ob.style.marginTop='8px';
          ob.onclick=()=>window.open(v.url,'_blank','noopener'); pv.appendChild(ob);
        }
        open=true; b.textContent='閉じる';
      };
      r.appendChild(b);
    }

    // ダウンロード（Numbers・Excel・Keynote など、ブラウザで開けないもの用）
    const dl=el('button',null, canPreview ? '保存' : 'ダウンロード');
    if(!canPreview) dl.style.fontWeight='600';
    dl.onclick=async()=>{
      const v = await fetchIt(dl);
      if(!v) return;
      const a2=el('a'); a2.href=v.url; a2.download=f.name||'file';
      document.body.appendChild(a2); a2.click(); a2.remove();
      toast('ダウンロードしました');
    };
    r.appendChild(dl);
  }

  const cp=el('button',null,'パスをコピー');
  cp.onclick=()=>{ navigator.clipboard.writeText('Claude/stock データ移行/'+f.path);
    cp.textContent='コピーしました'; setTimeout(()=>cp.textContent='パスをコピー',1500); };
  r.appendChild(cp);

  wrap.appendChild(r); wrap.appendChild(pv);
  return wrap;
}

async function saveNote(n){
  const title = $('#t-edit').innerText.trim() || '(無題)';
  const body  = $('#b-edit').innerHTML;
  const text  = $('#b-edit').innerText;
  const prev  = text.slice(0,200).replace(/\n/g,' ');
  const now = nowISO();
  await setDoc(doc(db,'notes',String(n.id)),
    { title, body, preview:prev, updatedAt:now, editor:ME.name }, {merge:true});
  const i = S.notes.findIndex(x=>x.id==n.id);
  if(i>=0) Object.assign(S.notes[i], {title, preview:prev, updatedAt:now, editor:ME.name, text});
  S.editing=false; renderList(); renderDetail();
}
async function newNote(){
  const f = S.folders.find(x=>x.id===S.folderId); if(!f) return;
  const id = 'n'+Date.now();
  const now = nowISO();
  const n = { folderId:f.id, folder:f.name, section:f.section, title:'新しいノート', body:'',
    preview:'', createdAt:now, updatedAt:now, author:ME.name, editor:ME.name,
    archived:false, daily:S.mode==='daily', tags:[], attachments:[] };
  await setDoc(doc(db,'notes',id), n);
  S.notes.unshift({id, ...n, text:'', att:0});
  S.noteId=id; S.editing=true; renderSidebar(); renderList(); renderDetail();
}
async function toggleArchive(n){
  const v=!n.archived;
  await setDoc(doc(db,'notes',String(n.id)),{archived:v},{merge:true});
  const i=S.notes.findIndex(x=>x.id==n.id); if(i>=0) S.notes[i].archived=v;
  renderSidebar(); renderList(); renderDetail();
}
async function removeNote(n){
  if(!confirm(`「${n.title}」を削除します。元に戻せません。`)) return;
  await deleteDoc(doc(db,'notes',String(n.id)));
  S.notes = S.notes.filter(x=>x.id!=n.id);
  S.noteId=null; renderSidebar(); renderList(); renderDetail();
}
function doSearch(q){
  if(!q){ S.results=null; renderList(); return; }
  const keys = q.toLowerCase().split(/\s+/).filter(Boolean);
  const C = S.corpus;
  const hits = S.notes.filter(n=>{
    const hay = ((n.title||'')+' '+(n.folder||'')+' '+(n.preview||'')+' '
      +tagsOf(n).join(' ')+' '
      +((C && C[String(n.id)]) || n.text || '')).toLowerCase();
    return keys.every(k=>hay.includes(k));
  });
  hits.sort((a,b)=>{
    const at=(a.title||'').toLowerCase(), bt=(b.title||'').toLowerCase();
    const ah=keys.every(k=>at.includes(k))?1:0, bh=keys.every(k=>bt.includes(k))?1:0;
    if(ah!==bh) return bh-ah;
    return (b.updatedAt||'').localeCompare(a.updatedAt||'');
  });
  S.results = hits; renderList();
}
